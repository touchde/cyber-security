<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-label="Code panel template"><title>Code panel template</title><defs></defs><rect x="0" y="0" width="960" height="442" fill="#0F1B33" stroke="#26375C" stroke-width="2"/><circle cx="32" cy="32" r="7" fill="#FF5F57"/><circle cx="56" cy="32" r="7" fill="#FEBC2E"/><circle cx="80" cy="32" r="7" fill="#28C840"/><text x="928" y="38" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#8796B3" text-anchor="end">main.dart</text><line x1="0" y1="64" x2="960" y2="64" stroke="#26375C" stroke-width="2"/><rect x="2" y="196" width="956" height="34" fill="#1C2E52" stroke="none" stroke-width="0"/><rect x="2" y="196" width="4" height="34" fill="#7FA6FF" stroke="none" stroke-width="0"/><text x="36" y="118" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#8796B3" text-anchor="end">1</text><text x="64" y="118" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="22" xml:space="preserve"><tspan fill="#D59BFF">void </tspan><tspan fill="#FFD479">main</tspan><tspan fill="#9EDCF0">() {</tspan></text><text x="36" y="152" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#8796B3" text-anchor="end">2</text><text x="64" y="152" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="22" xml:space="preserve"><tspan fill="#E8EEF8">  </tspan><tspan fill="#D59BFF">final </tspan><tspan fill="#E8EEF8">name = </tspan><tspan fill="#A8E07A">&#x27;Mina&#x27;</tspan><tspan fill="#9EDCF0">;</tspan></text><text x="36" y="186" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#8796B3" text-anchor="end">3</text><text x="64" y="186" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="22" xml:space="preserv