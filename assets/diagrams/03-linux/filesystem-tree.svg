<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-label="The Linux file system"><title>The Linux file system</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#4E6357"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#4E6357"/></marker></defs><rect width="1000" height="510" fill="#FFFFFF"/><text x="40" y="52" font-family="'Work Sans', sans-serif" font-size="30" font-weight="700" fill="#122017" text-anchor="start">The Linux file system</text><text x="40" y="84" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="start">one tree from the root /, not separate drive letters</text><rect x="420" y="130" width="160" height="64" fill="#0A1711" stroke="#15803D" stroke-width="2.5"/><text x="500.0" y="141.9" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">/</text><text x="500.0" y="169.8" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">the root of</text><text x="500.0" y="192.8" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">everything</text><path d="M500,194 L500,250 L124.0,250 L124.0,300" fill="none" stroke="#CFE3D6" stroke-width="2.5"/><rect x="39.0" y="300" width="170" height="72" fill="#EBF5EF" stroke="#15803D" stroke-width="2.5"/><text x="124.0" y="327.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#122017" text-anchor="middle">/home</text><text x="124.0" y="355.3" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">users&#x27; files</text><path d="M500,194 L500,250 L312.0,250 L312.0,300" fill="none" stroke="#CFE3D6" stroke-width="2.5"/><rect x="227.0" y="300" width="170" height="72" fill="#EBF5EF" stroke="#15803D" stroke-width="2.5"/><text x="312.0" y="327.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#122017" text-anchor="middle">/etc</text><text x="312.0" y="355.3" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">configuration</text><path d="M500,194 L500,250 L500.0,250 L500.0,300" fill="none" stroke="#CFE3D6" stroke-width="2.5"/><rect x="415.0" y="300" width="170" height="72" fill="#EBF5EF" stroke="#15803D" stroke-width="2.5"/><text x="500.0" y="328.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#122017" text-anchor="middle">/var</text><text x="500.0" y="354.6" font-family="'Work Sans', sans-serif" font-size="16" font-weight="400" fill="#4E6357" text-anchor="middle">logs, changing data</text><path d="M500,194 L500,250 L688.0,250 L688.0,300" fill="none" stroke="#CFE3D6" stroke-width="2.5"/><rect x="603.0" y="300" width="170" height="72" fill="#EBF5EF" stroke="#15803D" stroke-width="2.5"/><text x="688.0" y="327.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#122017" text-anchor="middle">/usr</text><text x="688.0" y="355.3" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">programs</text><path d="M500,194 L500,250 L876.0,250 L876.0,300" fill="none" stroke="#CFE3D6" stroke-width="2.5"/><rect x="791.0" y="300" width="170" height="72" fill="#EBF5EF" stroke="#15803D" stroke-width="2.5"/><text x="876.0" y="327.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#122017" text-anchor="middle">/bin</text><text x="876.0" y="355.3" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">core commands</text><path d="M124.0,372 L124.0,420" fill="none" stroke="#CFE3D6" stroke-width="2.5"/><rect x="29.0" y="420" width="190" height="60" fill="#FFFFFF" stroke="#4E6357" stroke-width="2.5"/><text x="124.0" y="441.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#122017" text-anchor="middle">/home/dara</text><text x="124.0" y="469.3" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">your home directory</text></svg>