<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="A hardened server"><title>A hardened server</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#4E6357"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#4E6357"/></marker></defs><rect width="1000" height="560" fill="#FFFFFF"/><text x="40" y="52" font-family="'Work Sans', sans-serif" font-size="30" font-weight="700" fill="#122017" text-anchor="start">A hardened server</text><text x="40" y="84" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="start">several layers, so one failure is not a break-in</text><rect x="190.0" y="130" width="620" height="66" fill="#E3F2E9" stroke="#15803D" stroke-width="2.5"/><text x="500.0" y="154.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#122017" text-anchor="middle">Updates</text><text x="500.0" y="182.3" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">patch known holes</text><rect x="190.0" y="212" width="620" height="66" fill="#EBF5EF" stroke="#15803D" stroke-width="2.5"/><text x="500.0" y="236.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#122017" text-anchor="middle">Least privilege</text><text x="500.0" y="264.3" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">non-root users, sudo</text><rect x="190.0" y="294" width="620" height="66" fill="#E3F2E9" stroke="#15803D" stroke-width="2.5"/><text x="500.0" y="318.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#122017" text-anchor="middle">SSH keys, no passwords</text><text x="500.0" y="346.3" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">and fail2ban</text><rect x="190.0" y="376" width="620" height="66" fill="#EBF5EF" stroke="#15803D" stroke-width="2.5"/><text x="500.0" y="400.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#122017" text-anchor="middle">Host firewall (ufw)</text><text x="500.0" y="428.3" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">only needed ports open</text><rect x="190.0" y="458" width="620" height="66" fill="#E3F2E9" stroke="#15803D" stroke-width="2.5"/><text x="500.0" y="482.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#122017" text-anchor="middle">Remove what you don&#x27;t need</text><text x="500.0" y="510.3" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">fewer services = smaller attack surface</text><text x="500" y="570" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">Defense in depth: an attacker must beat every layer.</text></svg>