<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="538" viewBox="0 0 1000 538" role="img" aria-label="Where Linux runs"><title>Where Linux runs</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#4E6357"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#4E6357"/></marker></defs><rect width="1000" height="538" fill="#FFFFFF"/><text x="40" y="52" font-family="'Work Sans', sans-serif" font-size="30" font-weight="700" fill="#122017" text-anchor="start">Where Linux runs</text><text x="40" y="84" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="start">the systems you attack and defend are mostly Linux</text><rect x="380" y="130" width="240" height="68" fill="#0A1711" stroke="#15803D" stroke-width="2.5"/><text x="500.0" y="172.05" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">Linux kernel</text><path d="M500,198 L500,238 L196.0,238 L196.0,278" fill="none" stroke="#CFE3D6" stroke-width="2.5"/><rect x="56.0" y="278" width="280" height="80" fill="#EBF5EF" stroke="#15803D" stroke-width="2.5"/><text x="196.0" y="309.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#122017" text-anchor="middle">Web servers</text><text x="196.0" y="337.3" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">most of the internet</text><path d="M500,198 L500,238 L500.0,238 L500.0,278" fill="none" stroke="#CFE3D6" stroke-width="2.5"/><rect x="360.0" y="278" width="280" height="80" fill="#EBF5EF" stroke="#15803D" stroke-width="2.5"/><text x="500.0" y="309.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#122017" text-anchor="middle">The cloud</text><text x="500.0" y="337.3" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">AWS, Google, Azure</text><path d="M500,198 L500,238 L804.0,238 L804.0,278" fill="none" stroke="#CFE3D6" stroke-width="2.5"/><rect x="664.0" y="278" width="280" height="80" fill="#EBF5EF" stroke="#15803D" stroke-width="2.5"/><text x="804.0" y="309.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#122017" text-anchor="middle">Phones</text><text x="804.0" y="337.3" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">Android (billions)</text><line x1="196.0" y1="358" x2="196.0" y2="428" stroke="#CFE3D6" stroke-width="2.5"/><rect x="56.0" y="428" width="280" height="80" fill="#EBF5EF" stroke="#15803D" stroke-width="2.5"/><text x="196.0" y="459.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#122017" text-anchor="middle">Devices / IoT</text><text x="196.0" y="487.3" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">routers, TVs, cars</text><line x1="500.0" y1="358" x2="500.0" y2="428" stroke="#CFE3D6" stroke-width="2.5"/><rect x="360.0" y="428" width="280" height="80" fill="#EBF5EF" stroke="#15803D" stroke-width="2.5"/><text x="500.0" y="459.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#122017" text-anchor="middle">Supercomputers</text><text x="500.0" y="487.3" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">essentially all</text><line x1="804.0" y1="358" x2="804.0" y2="428" stroke="#CFE3D6" stroke-width="2.5"/><rect x="664.0" y="428" width="280" height="80" fill="#EBF5EF" stroke="#15803D" stroke-width="2.5"/><text x="804.0" y="459.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#122017" text-anchor="middle">Security tools</text><text x="804.0" y