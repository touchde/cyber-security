<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="A pipeline"><title>A pipeline</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#4E6357"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#4E6357"/></marker></defs><rect width="1200" height="320" fill="#FFFFFF"/><text x="40" y="52" font-family="'Work Sans', sans-serif" font-size="30" font-weight="700" fill="#122017" text-anchor="start">A pipeline</text><text x="40" y="84" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="start">small commands joined by | (pipe) into one powerful line</text><rect x="40" y="170" width="210" height="80" fill="#EBF5EF" stroke="#15803D" stroke-width="2.5"/><text x="145.0" y="201.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#122017" text-anchor="middle">cat auth.log</text><text x="145.0" y="229.3" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">read the file</text><rect x="296" y="170" width="210" height="80" fill="#EBF5EF" stroke="#15803D" stroke-width="2.5"/><text x="401.0" y="201.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#122017" text-anchor="middle">grep &#x27;Failed&#x27;</text><text x="401.0" y="229.3" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">keep failed logins</text><text x="273.0" y="200.0" font-family="'Fira Code', monospace" font-size="30" font-weight="700" fill="#15803D" text-anchor="middle">|</text><line x1="256" y1="210.0" x2="294" y2="210.0" stroke="#4E6357" stroke-width="2.5" marker-end="url(#head)"/><rect x="552" y="170" width="210" height="80" fill="#EBF5EF" stroke="#15803D" stroke-width="2.5"/><text x="657.0" y="201.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#122017" text-anchor="middle">sort</text><text x="657.0" y="229.3" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">group them</text><text x="529.0" y="200.0" font-family="'Fira Code', monospace" font-size="30" font-weight="700" fill="#15803D" text-anchor="middle">|</text><line x1="512" y1="210.0" x2="550" y2="210.0" stroke="#4E6357" stroke-width="2.5" marker-end="url(#head)"/><rect x="808" y="170" width="210" height="80" fill="#EBF5EF" stroke="#15803D" stroke-width="2.5"/><text x="913.0" y="201.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#122017" text-anchor="middle">uniq -c</text><text x="913.0" y="229.3" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="middle">count each</text><text x="785.0" y="200.0" font-family="'Fira Code', monospace" font-size="30" font-weight="700" fill="#15803D" text-anchor="middle">|</text><line x1="768" y1="210.0" x2="806" y2="210.0" stroke="#4E6357" stroke-width="2.5" marker-end="url(#head)"/><line x1="1024" y1="210.0" x2="1062" y2="210.0" stroke="#4E6357" stroke-width="2.5" marker-end="url(#head)"/><rect x="1064" y="170" width="190" height="80" fill="#0A1711" stroke="#15803D" stroke-width="2.5"/><text x="1159.0" y="201.4" font-family="'Work Sans', sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">12 Failed</text><text x="1159.0" y="229.3" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#9FE0C8" text-anchor="middle">the answer</text><text x="40" y="306" font-family="'Work Sans', sans-serif" font-size="18" font-weight="400" fill="#4E6357" text-anchor="start">Each command&#x27;s output becomes the next command&#x27;s input. One line does the work of many.</text></svg>