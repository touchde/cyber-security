<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-label="The event loop"><title>The event loop</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5A5748"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5A5748"/></marker></defs><rect width="1100" height="650" fill="#FFFFFF"/><text x="40" y="52" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="start">The event loop</text><text x="40" y="84" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="start">How waiting work gets back onto the call stack</text><rect x="40" y="160" width="300" height="400" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="190" y="195" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#141414" text-anchor="middle">Call stack</text><rect x="70" y="460" width="240" height="70" fill="#FFF8C4" stroke="#141414" stroke-width="2.5"/><text x="190.0" y="503.05" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">main script</text><rect x="70" y="380" width="240" height="70" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="190.0" y="423.05" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">a callback</text><rect x="470" y="170" width="300" height="100" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="620.0" y="211.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">Web APIs / Node.js</text><text x="620.0" y="239.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">timers, network, files</text><rect x="470" y="340" width="300" height="100" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="620.0" y="381.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">Microtask queue</text><text x="620.0" y="409.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">promise callbacks: first</text><rect x="470" y="480" width="300" height="100" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="620.0" y="521.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">Task queue</text><text x="620.0" y="549.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">timer callbacks: after</text><rect x="850" y="340" width="210" height="100" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="955.0" y="381.9" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">Event loop</text><text x="955.0" y="408.95" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5A5748" text-anchor="middle">when the stack is empty</text><line x1="340" y1="220" x2="468" y2="220" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><line x1="620" y1="270" x2="620" y2="338" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><line x1="770" y1="390" x2="848" y2="390" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><line x1="770" y1="530" x2="955" y2="530" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><line x1="955" y1="530" x2="955" y2="442" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><path d="M470,245 L430,245 L430,530 L466,530" fill="none" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><path d="M955,340 L955,110 L190,110 L190,156" fill="none" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><text x="600" y="132" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5A5748" text-anchor="start">moves the next callback onto the stack</text><text x="40" y="620" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#141414" text-anchor="start">1. Run the script. 2. Run every microtask. 3. Run one task. Repeat from 2.</text></svg>