<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="The scope chain"><title>The scope chain</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5A5748"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5A5748"/></marker></defs><rect width="1100" height="560" fill="#FFFFFF"/><text x="40" y="52" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="start">The scope chain</text><text x="40" y="84" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="start">A name is searched for from the inside out</text><rect x="40" y="110" width="1020" height="420" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="60" y="145" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#141414" text-anchor="start">Global scope</text><text x="60" y="178" font-family="'Space Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#141414" text-anchor="start">TAX_RATE = 0.1</text><text x="330" y="178" font-family="'Space Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#141414" text-anchor="start">order()</text><rect x="90" y="205" width="920" height="300" fill="#FFF8C4" stroke="#141414" stroke-width="2.5"/><text x="110" y="240" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#141414" text-anchor="start">order&#x27;s scope</text><text x="110" y="273" font-family="'Space Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#141414" text-anchor="start">total = 6000</text><text x="330" y="273" font-family="'Space Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#141414" text-anchor="start">line()</text><rect x="140" y="300" width="460" height="180" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="160" y="335" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#141414" text-anchor="start">line&#x27;s scope</text><text x="160" y="368" font-family="'Space Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#141414" text-anchor="start">name = &quot;Latte&quot;</text><text x="160" y="410" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5A5748" text-anchor="start">Looking for TAX_RATE:</text><text x="160" y="438" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5A5748" text-anchor="start">1. here? no   2. in order? no</text><text x="160" y="462" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5A5748" text-anchor="start">3. in global? yes</text><line x1="700" y1="330" x2="700" y2="232" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><line x1="700" y1="222" x2="700" y2="132" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><text x="720" y="290" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5A5748" text-anchor="start">step 2: search order</text><text x="720" y="180" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5A5748" text-anchor="start">step 3: search global</text><text x="640" y="420" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#141414" text-anchor="start">The search goes outward only.</text><text x="640" y="448" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5A5748" text-anchor="start">order cannot see name.</text></svg>