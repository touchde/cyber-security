<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-label="Where JavaScript runs"><title>Where JavaScript runs</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5A5748"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5A5748"/></marker></defs><rect width="1100" height="540" fill="#FFFFFF"/><text x="40" y="52" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="start">Where JavaScript runs</text><text x="40" y="84" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="start">One language, many homes</text><rect x="410" y="120" width="280" height="100" fill="#FFF8C4" stroke="#141414" stroke-width="2.5"/><text x="550.0" y="161.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">JavaScript code</text><text x="550.0" y="189.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">.js files</text><rect x="40" y="300" width="240" height="100" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="160.0" y="342.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">Web browsers</text><text x="160.0" y="368.6" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5A5748" text-anchor="middle">Chrome, Safari, Firefox, Edge</text><line x1="550" y1="220" x2="160" y2="298" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><rect x="300" y="300" width="240" height="100" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="420.0" y="341.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">Servers</text><text x="420.0" y="369.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">Node.js, Deno, Bun</text><line x1="550" y1="220" x2="420" y2="298" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><rect x="560" y="300" width="240" height="100" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="680.0" y="341.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">Mobile apps</text><text x="680.0" y="369.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">React Native</text><line x1="550" y1="220" x2="680" y2="298" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><rect x="820" y="300" width="240" height="100" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="940.0" y="341.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">Desktop apps</text><text x="940.0" y="369.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">Electron, VS Code</text><line x1="550" y1="220" x2="940" y2="298" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><text x="550" y="470" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#141414" text-anchor="middle">The same language everywhere. Each place adds its own tools:</text><text x="550" y="500" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">the browser adds the web page (the DOM); Node.js adds files and the network.</text></svg>