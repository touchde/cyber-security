<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-label="The states of a promise"><title>The states of a promise</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5A5748"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5A5748"/></marker></defs><rect width="920" height="500" fill="#FFFFFF"/><text x="40" y="52" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="start">The states of a promise</text><text x="40" y="84" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="start">Pending, then fulfilled or rejected</text><rect x="60" y="210" width="260" height="100" fill="#FFF8C4" stroke="#141414" stroke-width="2.5"/><text x="190.0" y="251.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">pending</text><text x="190.0" y="279.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">the work is still running</text><rect x="560" y="120" width="300" height="100" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="710.0" y="161.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">fulfilled</text><text x="710.0" y="189.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">has a value; then() runs</text><rect x="560" y="300" width="300" height="100" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="710.0" y="341.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">rejected</text><text x="710.0" y="369.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">has an error; catch() runs</text><line x1="320" y1="245" x2="558" y2="175" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><line x1="320" y1="275" x2="558" y2="345" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><text x="330" y="165" font-family="'Space Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#5A5748" text-anchor="start">resolve(value)</text><text x="330" y="385" font-family="'Space Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#5A5748" text-anchor="start">reject(error)</text><text x="60" y="460" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#141414" text-anchor="start">A promise settles once. After that its state and value never change.</text></svg>