<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-label="The call stack"><title>The call stack</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5A5748"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5A5748"/></marker></defs><rect width="1100" height="580" fill="#FFFFFF"/><text x="40" y="52" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="start">The call stack</text><text x="40" y="84" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="start">The stack while printReceipt calls withTax</text><text x="130" y="140" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#141414" text-anchor="middle">1. Start</text><rect x="40" y="430" width="180" height="66" fill="#FFF8C4" stroke="#141414" stroke-width="2.5"/><text x="130.0" y="471.05" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">global</text><text x="342" y="140" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#141414" text-anchor="middle">2. printReceipt(1000)</text><rect x="252" y="430" width="180" height="66" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="342.0" y="471.05" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">global</text><rect x="252" y="350" width="180" height="66" fill="#FFF8C4" stroke="#141414" stroke-width="2.5"/><text x="342.0" y="391.05" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">printReceipt</text><line x1="222" y1="465" x2="248" y2="465" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><text x="554" y="140" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#141414" text-anchor="middle">3. withTax(1000)</text><rect x="464" y="430" width="180" height="66" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="554.0" y="471.05" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">global</text><rect x="464" y="350" width="180" height="66" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="554.0" y="391.05" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">printReceipt</text><rect x="464" y="270" width="180" height="66" fill="#FFF8C4" stroke="#141414" stroke-width="2.5"/><text x="554.0" y="311.05" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">withTax</text><line x1="434" y1="465" x2="460" y2="465" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><text x="766" y="140" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#141414" text-anchor="middle">4. withTax returns</text><rect x="676" y="430" width="180" height="66" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="766.0" y="471.05" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">global</text><rect x="676" y="350" width="180" height="66" fill="#FFF8C4" stroke="#141414" stroke-width="2.5"/><text x="766.0" y="391.05" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">printReceipt</text><line x1="646" y1="465" x2="672" y2="465" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><text x="978" y="140" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#141414" text-anchor="middle">5. printReceipt returns</text><rect x="888" y="430" width="180" height="66" fill="#FFF8C4" stroke="#141414" stroke-width="2.5"/><text x="978.0" y="471.05" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">global</text><line x1="858" y1="465" x2="884" y2="465" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><text x="40" y="545" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="start">The box on top is the function running now. A call pushes a box; a return pops it.</text></svg>