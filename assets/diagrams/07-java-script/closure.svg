<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="A closure"><title>A closure</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5A5748"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5A5748"/></marker></defs><rect width="1000" height="560" fill="#FFFFFF"/><text x="40" y="52" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="start">A closure</text><text x="40" y="84" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="start">A returned function keeps the variables it was created with</text><rect x="40" y="130" width="330" height="90" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="205.0" y="166.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">makeCounter()</text><text x="205.0" y="194.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">has returned; its call is over</text><rect x="40" y="280" width="330" height="90" fill="#FFF8C4" stroke="#141414" stroke-width="2.5"/><text x="205.0" y="316.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">nextOrder</text><text x="205.0" y="344.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">a function</text><rect x="40" y="430" width="330" height="90" fill="#FFF8C4" stroke="#141414" stroke-width="2.5"/><text x="205.0" y="466.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">nextTable</text><text x="205.0" y="494.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">a function</text><rect x="640" y="280" width="300" height="90" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="790.0" y="316.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">count = 3</text><text x="790.0" y="344.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">kept for nextOrder</text><rect x="640" y="430" width="300" height="90" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="790.0" y="466.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">count = 1</text><text x="790.0" y="494.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">kept for nextTable</text><line x1="370" y1="325" x2="638" y2="325" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><line x1="370" y1="475" x2="638" y2="475" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><text x="400" y="310" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5A5748" text-anchor="start">remembers</text><text x="400" y="460" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5A5748" text-anchor="start">remembers</text><text x="420" y="175" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="start">Each call to makeCounter made a new count.</text><text x="420" y="200" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="start">No other code can reach these boxes.</text></svg>