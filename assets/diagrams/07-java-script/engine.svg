<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-label="How JavaScript runs"><title>How JavaScript runs</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5A5748"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5A5748"/></marker></defs><rect width="1100" height="470" fill="#FFFFFF"/><text x="40" y="52" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="start">How JavaScript runs</text><text x="40" y="84" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="start">An engine inside the browser or Node.js runs your code</text><rect x="40" y="150" width="230" height="110" fill="#FFF8C4" stroke="#141414" stroke-width="2.5"/><text x="155.0" y="196.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">Your code</text><text x="155.0" y="224.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">welcome.js</text><rect x="305" y="150" width="230" height="110" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="420.0" y="184.9" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">Engine</text><text x="420.0" y="212.8" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">V8, SpiderMonkey,</text><text x="420.0" y="235.8" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">JavaScriptCore</text><line x1="270" y1="205" x2="303" y2="205" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><rect x="570" y="150" width="230" height="110" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="685.0" y="196.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">Machine code</text><text x="685.0" y="224.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">made while it runs</text><line x1="535" y1="205" x2="568" y2="205" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><rect x="835" y="150" width="230" height="110" fill="#FFF8C4" stroke="#141414" stroke-width="2.5"/><text x="950.0" y="196.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">Result</text><text x="950.0" y="224.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">Welcome to Mina Coffee!</text><line x1="800" y1="205" x2="833" y2="205" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><text x="40" y="330" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#141414" text-anchor="start">No separate compile step: the engine reads your code, and turns the busy parts</text><text x="40" y="360" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5A5748" text-anchor="start">into fast machine code while the program runs (just-in-time compilation).</text><text x="40" y="425" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#141414" text-anchor="start">Every engine follows the same rules: the ECMAScript standard, updated every June.</text></svg>