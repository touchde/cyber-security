<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-label="Two names, one object"><title>Two names, one object</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5A5748"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5A5748"/></marker></defs><rect width="1000" height="540" fill="#FFFFFF"/><text x="40" y="52" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="start">Two names, one object</text><text x="40" y="84" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="start">Objects are shared by reference</text><rect x="40" y="150" width="220" height="80" fill="#FFF8C4" stroke="#141414" stroke-width="2.5"/><text x="150.0" y="181.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">first</text><text x="150.0" y="209.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">a variable</text><rect x="40" y="330" width="220" height="80" fill="#FFF8C4" stroke="#141414" stroke-width="2.5"/><text x="150.0" y="361.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">second</text><text x="150.0" y="389.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">a variable</text><rect x="560" y="220" width="380" height="130" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="750.0" y="276.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">{ price: 7000 }</text><text x="750.0" y="304.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">one object in memory</text><line x1="260" y1="190" x2="558" y2="260" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><line x1="260" y1="370" x2="558" y2="310" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><text x="40" y="470" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#141414" text-anchor="start">const second = first; copies the arrow, not the object.</text><text x="40" y="500" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="start">A change made through second is seen through first.</text></svg>