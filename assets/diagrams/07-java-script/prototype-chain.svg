<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-label="The prototype chain"><title>The prototype chain</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5A5748"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5A5748"/></marker></defs><rect width="1100" height="400" fill="#FFFFFF"/><text x="40" y="52" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="start">The prototype chain</text><text x="40" y="84" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="start">Each arrow is a [[Prototype]] link</text><rect x="40" y="160" width="230" height="110" fill="#FFF8C4" stroke="#141414" stroke-width="2.5"/><text x="155.0" y="206.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">latte</text><text x="155.0" y="234.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">name, price</text><rect x="305" y="160" width="230" height="110" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="420.0" y="206.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">Drink.prototype</text><text x="420.0" y="234.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">describe()</text><line x1="270" y1="215" x2="303" y2="215" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><rect x="570" y="160" width="230" height="110" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="685.0" y="207.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">Object.prototype</text><text x="685.0" y="233.6" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5A5748" text-anchor="middle">toString(), hasOwnProperty()</text><line x1="535" y1="215" x2="568" y2="215" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><rect x="835" y="160" width="230" height="110" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="950.0" y="206.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">null</text><text x="950.0" y="234.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">the end of the chain</text><line x1="800" y1="215" x2="833" y2="215" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><text x="40" y="330" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#141414" text-anchor="start">latte.describe(): not on latte, so JavaScript follows [[Prototype]] to Drink.prototype.</text><text x="40" y="360" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="start">latte.toString(): two steps up, on Object.prototype. Reaching null means the property does not exist.</text></svg>