<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="How an event travels"><title>How an event travels</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5A5748"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5A5748"/></marker></defs><rect width="900" height="560" fill="#FFFFFF"/><text x="40" y="52" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="start">How an event travels</text><text x="40" y="84" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="start">Capturing goes down; bubbling goes up</text><rect x="60" y="130" width="300" height="80" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="210.0" y="178.05" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">document</text><rect x="60" y="260" width="300" height="80" fill="#FFF8C4" stroke="#141414" stroke-width="2.5"/><text x="210.0" y="291.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">ul#menu</text><text x="210.0" y="319.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">a listener can catch it here</text><rect x="60" y="390" width="300" height="80" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/><text x="210.0" y="421.4" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">button Latte</text><text x="210.0" y="449.3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="middle">the target: clicked</text><line x1="450" y1="170" x2="450" y2="428" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><line x1="620" y1="428" x2="620" y2="172" stroke="#5A5748" stroke-width="2.5" marker-end="url(#head)"/><text x="470" y="300" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#141414" text-anchor="start">1. capture</text><text x="640" y="300" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#141414" text-anchor="start">2. bubble</text><text x="400" y="500" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="start">The click travels down to the target, then bubbles back up.</text><text x="400" y="528" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5A5748" text-anchor="start">Event delegation puts one listener on ul#menu.</text></svg>