<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-label="Local state compared with shared state"><title>Local state compared with shared state</title><defs><marker id="arrow-2353C9" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#2353C9"/></marker><marker id="arrow-C26A00" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#C26A00"/></marker></defs><rect width="1100" height="600" fill="#FFFFFF"/><text x="40" y="52" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="28" font-weight="700" fill="#14213D" text-anchor="start">Local state vs shared state</text><text x="40" y="82" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start">Start local. Lift state up when several widgets need it.</text><rect x="40" y="120" width="440" height="440" fill="#F4F6FA" stroke="#D9DEE8" stroke-width="2" stroke-dasharray="8 6"/><text x="56" y="148" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="13" font-weight="700" fill="#55607A" text-anchor="start">LOCAL STATE · SETSTATE()</text><rect x="90" y="190" width="340" height="70" fill="#EAF0FD" stroke="#2353C9" stroke-width="2"/><text x="260.0" y="221.0" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#14213D" text-anchor="middle">CounterButton</text><text x="260.0" y="245.0" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle">owns count</text><path d="M230 262 C 200 310, 330 310, 296 266" fill="none" stroke="#2353C9" stroke-width="2.5" marker-end="url(#arrow-2353C9)"/><text x="260" y="336" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#2353C9" text-anchor="middle">setState(() =&gt; count++)</text><text x="260" y="400" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="middle">Only this widget</text><text x="260" y="424" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="middle">needs the value.</text><rect x="520" y="120" width="540" height="440" fill="#F4F6FA" stroke="#D9DEE8" stroke-width="2" stroke-dasharray="8 6"/><text x="536" y="148" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="13" font-weight="700" fill="#55607A" text-anchor="start">SHARED STATE · CHANGENOTIFIER, PROVIDER, BLOC…</text><rect x="640" y="180" width="300" height="70" fill="#FFF3E0" stroke="#C26A00" stroke-width="2"/><text x="790.0" y="211.0" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#14213D" text-anchor="middle">CartModel</text><text x="790.0" y="235.0" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle">state holder</text><rect x="535" y="420" width="160" height="60" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="615.0" y="455.6" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#14213D" text-anchor="middle">CartBadge</text><line x1="790" y1="252" x2="615" y2="414" stroke="#C26A00" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-C26A00)"/><rect x="710" y="420" width="160" height="60" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="790.0" y="455.6" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#14213D" text-anchor="middle">ProductList</text><line x1="790" y1="252" x2="790" y2="414" stroke="#C26A00" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-C26A00)"/><rect x="885" y="420" width="160" height="60" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="965.0" y="455.6" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#14213D" text-anchor="middle">CheckoutPage</text><line x1="790" y1="252" x2="965" y2="414" stroke="#C26A00" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-C26A00)"/><text x="1045" y="290" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="600" fill="#C26A00" text-anchor="end">notifies listeners → rebuild</text><path d="M745 420 C 700 360, 700 300, 722 258" fill="none" stroke="#2353C9" stroke-width="2.5" marker-end="url(#arrow-2353C9)"/><text x="696" y="300" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#2353C9" text-anchor="end">add(item)</text></svg>
