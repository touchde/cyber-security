-size="19" font-weight="600" fill="#61534B" text-anchor="middle">Bindings, generated by tools such as UniFFI and wasm-bindgen</text><line x1="560" y1="380" x2="560" y2="332" stroke="#61534B" stroke-width="2.5" marker-end="url(#head)"/><rect x="330" y="382" width="460" height="100" fill="#FBF0E9" stroke="#A9380F" stroke-width="2.5"/><text x="560.0" y="423.4" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1714" text-anchor="middle">The Mina Coffee core, in Rust</text><text x="560.0" y="451.3" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="middle">prices, member discounts, and offline orders</text><text x="40" y="540" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1E1714" text-anchor="start">The price rules are written once, tested once, and give the same answer in every app.</text></svg>