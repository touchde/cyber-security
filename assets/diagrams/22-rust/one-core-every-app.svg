<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-label="One core for every app"><title>One core for every app</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#61534B"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#61534B"/></marker></defs><rect width="1120" height="580" fill="#FFFFFF"/><text x="40" y="52" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1E1714" text-anchor="start">One core for every app</text><text x="40" y="84" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="start">How a shared Rust library reaches each platform</text><rect x="40" y="120" width="192" height="84" fill="#FFFFFF" stroke="#A9380F" stroke-width="2.5"/><text x="136.0" y="153.4" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1714" text-anchor="middle">Android</text><text x="136.0" y="181.3" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="middle">Kotlin</text><line x1="136" y1="268" x2="136" y2="206" stroke="#61534B" stroke-width="2.5" marker-end="url(#head)"/><rect x="252" y="120" width="192" height="84" fill="#FFFFFF" stroke="#A9380F" stroke-width="2.5"/><text x="348.0" y="153.4" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1714" text-anchor="middle">iOS</text><text x="348.0" y="181.3" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="middle">Swift</text><lin