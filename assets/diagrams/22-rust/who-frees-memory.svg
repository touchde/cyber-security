<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="470" viewBox="0 0 1140 470" role="img" aria-label="Who gives memory back?"><title>Who gives memory back?</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#61534B"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#61534B"/></marker></defs><rect width="1140" height="470" fill="#FFFFFF"/><text x="40" y="52" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1E1714" text-anchor="start">Who gives memory back?</text><text x="40" y="84" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="start">Four answers to the same question</text><text x="40" y="228" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#61534B" text-anchor="start">Who frees it?</text><text x="40" y="330" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#61534B" text-anchor="start">The cost</text><rect x="170" y="110" width="220" height="50" fill="#FFFFFF" stroke="#A9380F" stroke-width="2.5"/><text x="280" y="142" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#1E1714" text-anchor="middle">C and C++</text><rect x="170" y="172" width="220" height="100" fill="#FFFFFF" stroke="#A9380F" stroke-width="2.5"/><text x="280.0" y="213.9" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1714" text-anchor="middle">You do</text><text x="280.0" y="240.95" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#61534B" text-anchor="middle">free() and delete, by hand</text><rect x="170" y="284" width="220" height="90" fill="#FFFFFF" stroke="#A9380F" stroke-width="2.5"/><text x="280.0" y="308.6" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#1E1714" text-anchor="middle">Easy to get wrong</text><text x="280.0" y="336.3" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="middle">forget: a leak;</text><text x="280.0" y="359.3" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="middle">too early: a crash</text><rect x="410" y="110" width="220" height="50" fill="#FFFFFF" stroke="#A9380F" stroke-width="2.5"/><text x="520" y="142" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#1E1714" text-anchor="middle">Kotlin and Dart</text><rect x="410" y="172" width="220" height="100" fill="#FFFFFF" stroke="#A9380F" stroke-width="2.5"/><text x="520.0" y="201.3" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#1E1714" text-anchor="middle">A garbage collector</text><text x="520.0" y="228.8" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="middle">finds unused memory</text><text x="520.0" y="251.8" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="middle">while the app runs</text><rect x="410" y="284" width="220" height="90" fill="#FFFFFF" stroke="#A9380F" stroke-width="2.5"/><text x="520.0" y="320.4" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1714" text-anchor="middle">Short pauses</text><text x="520.0" y="348.3" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="middle">and more memory in use</text><rect x="650" y="110" width="220" height="50" fill="#FFFFFF" stroke="#A9380F" stroke-width="2.5"/><text x="760" y="142" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#1E1714" text-anchor="middle">Swift</text><rect x="650" y="172" width="220" height="100" fill="#FFFFFF" stroke="#A9380F" stroke-width="2.5"/><text x="760.0" y="201.9" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1714" text-anchor="middle">ARC</text><text x="760.0" y="229.8" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="middle">counts references</text><text x="760.0" y="252.8" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="middle">while the app runs</text><rect x="650" y="284" width="220" height="90" fill="#FFFFFF" stroke="#A9380F" stroke-width="2.5"/><text x="760.0" y="318.6" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1E1714" text-anchor="middle">A small cost each time</text><text x="760.0" y="345.3" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="middle">and cycles can leak</text><rect x="890" y="110" width="220" height="50" fill="#A9380F" stroke="#A9380F" stroke-width="2.5"/><text x="1000" y="142" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Rust</text><rect x="890" y="172" width="220" height="100" fill="#FBF0E9" stroke="#A9380F" stroke-width="2.5"/><text x="1000.0" y="201.9" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1714" text-anchor="middle">The compiler</text><text x="1000.0" y="229.8" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="middle">adds the free where</text><text x="1000.0" y="252.8" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="middle">the owner ends</text><rect x="890" y="284" width="220" height="90" fill="#FBF0E9" stroke="#A9380F" stroke-width="2.5"/><text x="1000.0" y="319.8" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#1E1714" text-anchor="middle">No cost at run time</text><text x="1000.0" y="347.3" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="middle">but stricter rules to learn</text><text x="40" y="430" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1E1714" text-anchor="start">Rust decides when memory is freed while it compiles, so nothing has to watch the memory while the app runs.</text></svg>