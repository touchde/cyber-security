<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-label="The menu-reload crash"><title>The menu-reload crash</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#61534B"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#61534B"/></marker></defs><rect width="1120" height="540" fill="#FFFFFF"/><text x="40" y="52" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1E1714" text-anchor="start">The menu-reload crash</text><text x="40" y="84" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="start">The same mistake, in C++ and in Rust</text><text x="40" y="140" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#B3261E" text-anchor="start">C++: the program runs, and sometimes crashes</text><rect x="40" y="160" width="230" height="96" fill="#FFFFFF" stroke="#A9380F" stroke-width="2.5"/><text x="155.0" y="198.5" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#1E1714" text-anchor="middle">Point at the first item</text><text x="155.0" y="225.8" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="middle">of today&#x27;s menu</text><rect x="310" y="160" width="230" height="96" fill="#FFFFFF" stroke="#A9380F" stroke-width="2.5"/><text x="425.0" y="186.7" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1E1714" text-anchor="middle">The new menu arrives</text><text x="425.0" y="213.8" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="middle">the old menu&#x27;s</text><text x="425.0" y="236.8" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="middle">memory is freed</text><line x1="272" y1="208" x2="308" y2="208" stroke="#61534B" stroke-width="2.5" marker-end="url(#head)"/><rect x="580" y="160" width="230" height="96" fill="#FFFFFF" stroke="#A9380F" stroke-width="2.5"/><text x="695.0" y="199.4" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1714" text-anchor="middle">Read the first item</text><text x="695.0" y="227.3" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="middle">through the old pointer</text><line x1="542" y1="208" x2="578" y2="208" stroke="#61534B" stroke-width="2.5" marker-end="url(#head)"/><line x1="812" y1="208" x2="848" y2="208" stroke="#61534B" stroke-width="2.5" marker-end="url(#head)"/><rect x="850" y="160" width="230" height="96" fill="#FCE8E6" stroke="#B3261E" stroke-width="2.5"/><text x="965.0" y="200.0" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#B3261E" text-anchor="middle">Wrong data or a crash</text><text x="965.0" y="224.75" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#B3261E" text-anchor="middle">once a week, on some phones</text><text x="40" y="320" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#1B7A44" text-anchor="start">Rust: the program is never built</text><rect x="40" y="340" width="230" height="96" fill="#FFFFFF" stroke="#A9380F" stroke-width="2.5"/><text x="155.0" y="378.8" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#1E1714" text-anchor="middle">Borrow the first item</text><text x="155.0" y="406.3" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="middle">let first = &amp;menu[0];</text><rect x="310" y="340" width="230" height="96" fill="#FFFFFF" stroke="#A9380F" stroke-width="2.5"/><text x="425.0" y="378.5" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#1E1714" text-anchor="middle">Try to clear the menu</text><text x="425.0" y="405.8" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#61534B" text-anchor="middle">menu.clear();</text><line x1="272" y1="388" x2="308" y2="388" stroke="#61534B" stroke-width="2.5" marker-end="url(#head)"/><line x1="542" y1="388" x2="578" y2="388" stroke="#61534B" stroke-width="2.5" marker-end="url(#head)"/><rect x="580" y="340" width="500" height="96" fill="#E3F5EC" stroke="#1B7A44" stroke-width="2.5"/><text x="830" y="380" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#1B7A44" text-anchor="middle">Compile error E0502</text><text x="830" y="410" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#1B7A44" text-anchor="middle">the mistake is fixed before any customer sees it</text><text x="40" y="500" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1E1714" text-anchor="start">Both programs make the same mistake. C++ finds it on a customer&#x27;s phone; Rust finds it on Vanna&#x27;s laptop.</text></svg>