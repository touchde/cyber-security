<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="What the attacker controls"><title>What the attacker controls</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#64505A"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#64505A"/></marker></defs><rect width="1100" height="560" fill="#FFFFFF"/><text x="40" y="52" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1D0E12" text-anchor="start">What the attacker controls</text><text x="40" y="84" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#64505A" text-anchor="start">Your app runs on a device you do not own</text><text x="40" y="135" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#A3123A" text-anchor="start">On the attacker&#x27;s phone: they control all of this</text><rect x="40" y="150" width="600" height="330" fill="#FCF0F3" stroke="#A3123A" stroke-width="2.5"/><text x="70" y="200" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#1D0E12" text-anchor="start">• the app file: read every string and every line of logic</text><text x="70" y="256" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#1D0E12" text-anchor="start">• the app&#x27;s memory while it runs</text><text x="70" y="312" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#1D0E12" text-anchor="start">• every request before it is sent</text><text x="70" y="368" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#1D0E12" text-anchor="start">• every response before the app sees it</text><text x="70" y="424" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#1D0E12" text-anchor="start">• the device itself, even the system</text><text x="690" y="135" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#2E7D4F" text-anchor="start">On your server: only you control this</text><rect x="690" y="150" width="370" height="330" fill="#EAF4EE" stroke="#2E7D4F" stroke-width="2.5"/><text x="720" y="210" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#1D0E12" text-anchor="start">• secret keys</text><text x="720" y="272" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#1D0E12" text-anchor="start">• the record of every sale</text><text x="720" y="334" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#1D0E12" text-anchor="start">• the rules for points</text><text x="720" y="396" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#1D0E12" text-anchor="start">• who may do what</text><text x="550" y="525" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1D0E12" text-anchor="middle">Anything that must stay secret or be trusted belongs on the right.</text></svg>