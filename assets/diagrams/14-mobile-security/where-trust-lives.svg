<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="Where trust lives"><title>Where trust lives</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#64505A"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#64505A"/></marker></defs><rect width="1100" height="560" fill="#FFFFFF"/><text x="40" y="52" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1D0E12" text-anchor="start">Where trust lives</text><text x="40" y="84" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#64505A" text-anchor="start">The same request, designed two ways</text><text x="40" y="130" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#A3123A" text-anchor="start">Trusting the app</text><rect x="40" y="150" width="300" height="90" fill="#FCF0F3" stroke="#A3123A" stroke-width="2.5"/><text x="190.0" y="186.4" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D0E12" text-anchor="middle">App</text><text x="190.0" y="214.3" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#64505A" text-anchor="middle">asks: add 5000 points</text><rect x="620" y="150" width="300" height="90" fill="#FFFFFF" stroke="#A3123A" stroke-width="2.5"/><text x="770.0" y="186.4" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D0E12" text-anchor="middle">Server</text><text x="770.0" y="214.3" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#64505A" text-anchor="middle">adds 5000 points</text><line x1="340" y1="195" x2="618" y2="195" stroke="#64505A" stroke-width="2.5" marker-end="url(#head)"/><text x="480" y="270" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#A3123A" text-anchor="middle">The server believes whatever the app says.</text><text x="40" y="340" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#2E7D4F" text-anchor="start">Letting the server decide</text><rect x="40" y="360" width="300" height="90" fill="#FCF0F3" stroke="#A3123A" stroke-width="2.5"/><text x="190.0" y="396.4" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D0E12" text-anchor="middle">App</text><text x="190.0" y="424.3" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#64505A" text-anchor="middle">says: I paid for sale-1042</text><rect x="620" y="360" width="300" height="90" fill="#EAF4EE" stroke="#2E7D4F" stroke-width="2.5"/><text x="770.0" y="396.4" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D0E12" text-anchor="middle">Server</text><text x="770.0" y="424.3" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#64505A" text-anchor="middle">looks up the sale: 8800</text><line x1="340" y1="405" x2="618" y2="405" stroke="#64505A" stroke-width="2.5" marker-end="url(#head)"/><text x="770" y="485" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#2E7D4F" text-anchor="middle">8800 riel → 8 points</text><text x="480" y="530" font-family="'Barlow', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#64505A" text-anchor="middle">The app asks; the server checks its own records and decides.</text></svg>