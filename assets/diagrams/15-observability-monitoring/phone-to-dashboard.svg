<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-label="From a phone to a dashboard"><title>From a phone to a dashboard</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#55604A"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#55604A"/></marker></defs><rect width="1100" height="460" fill="#FFFFFF"/><text x="40" y="52" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#141A10" text-anchor="start">From a phone to a dashboard</text><text x="40" y="84" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#55604A" text-anchor="start">How signals travel from users&#x27; phones to the team</text><rect x="30" y="160" width="240" height="110" fill="#F3F8E6" stroke="#4F6B00" stroke-width="2.5"/><text x="150.0" y="206.4" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141A10" text-anchor="middle">Phones</text><text x="150.0" y="234.3" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#55604A" text-anchor="middle">the app records signals</text><rect x="298" y="160" width="240" height="110" fill="#FFFFFF" stroke="#4F6B00" stroke-width="2.5"/><text x="418.0" y="206.4" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141A10" text-anchor="middle">Collection</text><text x="418.0" y="234.3" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#55604A" text-anchor="middle">a service receives them</text><line x1="272" y1="215" x2="296" y2="215" stroke="#55604A" stroke-width="2.5" marker-end="url(#head)"/><rect x="566" y="160" width="240" height="110" fill="#FFFFFF" stroke="#4F6B00" stroke-width="2.5"/><text x="686.0" y="206.4" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141A10" text-anchor="middle">Storage</text><text x="686.0" y="234.3" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#55604A" text-anchor="middle">kept, searchable</text><line x1="540" y1="215" x2="564" y2="215" stroke="#55604A" stroke-width="2.5" marker-end="url(#head)"/><rect x="834" y="160" width="240" height="110" fill="#F3F8E6" stroke="#4F6B00" stroke-width="2.5"/><text x="954.0" y="206.4" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141A10" text-anchor="middle">Dashboards</text><text x="954.0" y="234.3" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#55604A" text-anchor="middle">alerts and questions</text><line x1="808" y1="215" x2="832" y2="215" stroke="#55604A" stroke-width="2.5" marker-end="url(#head)"/><text x="30" y="330" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#141A10" text-anchor="start">Signals are sent in small batches, when the phone has a connection,</text><text x="30" y="360" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#55604A" text-anchor="start">and crashes are sent the next time the app starts.</text><text x="30" y="420" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#4F6B00" text-anchor="start">No names, phone numbers, or exact locations leave the phone.</text></svg>