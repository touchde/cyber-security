<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-label="The signals"><title>The signals</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#55604A"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#55604A"/></marker></defs><rect width="1100" height="600" fill="#FFFFFF"/><text x="40" y="52" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#141A10" text-anchor="start">The signals</text><text x="40" y="84" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#55604A" text-anchor="start">Four kinds of data an app can send home</text><rect x="40" y="125" width="380" height="85" fill="#F3F8E6" stroke="#4F6B00" stroke-width="2.5"/><text x="230.0" y="158.9" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141A10" text-anchor="middle">Logs</text><text x="230.0" y="186.8" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#55604A" text-anchor="middle">what happened, step by step</text><text x="460" y="175" font-family="'Martian Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#141A10" text-anchor="start">address_parse_failed, field: address</text><rect x="40" y="230" width="380" height="85" fill="#FFFFFF" stroke="#4F6B00" stroke-width="2.5"/><text x="230.0" y="263.9" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141A10" text-anchor="middle">Metrics</text><text x="230.0" y="291.8" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#55604A" text-anchor="middle">numbers counted over time</text><text x="460" y="280" font-family="'Martian Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#141A10" text-anchor="start">crash-free users: 75%</text><rect x="40" y="335" width="380" height="85" fill="#F3F8E6" stroke="#4F6B00" stroke-width="2.5"/><text x="230.0" y="368.9" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141A10" text-anchor="middle">Traces</text><text x="230.0" y="396.8" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#55604A" text-anchor="middle">how long each step of one action took</text><text x="460" y="385" font-family="'Martian Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#141A10" text-anchor="start">tap &#x27;Deliver&#x27; → server → map: 2.9 s</text><rect x="40" y="440" width="380" height="85" fill="#FFFFFF" stroke="#4F6B00" stroke-width="2.5"/><text x="230.0" y="473.9" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141A10" text-anchor="middle">Crashes</text><text x="230.0" y="501.8" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#55604A" text-anchor="middle">where and how the app died</text><text x="460" y="490" font-family="'Martian Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#141A10" text-anchor="start">stack trace, device, version</text><text x="40" y="565" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#141A10" text-anchor="start">Together they answer questions you did not know you would need to ask.</text></svg>