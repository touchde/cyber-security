<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="Where an app&#x27;s data lives"><title>Where an app&#x27;s data lives</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#566078"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#566078"/></marker></defs><rect width="1100" height="560" fill="#FFFFFF"/><text x="40" y="52" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#141B2B" text-anchor="start">Where an app&#x27;s data lives</text><text x="40" y="84" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#566078" text-anchor="start">Three places, each with its own trade-offs</text><rect x="40" y="130" width="420" height="95" fill="#FFFFFF" stroke="#C03A1F" stroke-width="2.5"/><text x="250.0" y="168.9" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141B2B" text-anchor="middle">In memory</text><text x="250.0" y="196.8" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#566078" text-anchor="middle">fast; lost when the app closes</text><text x="490" y="185" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#141B2B" text-anchor="start">e.g. the menu on screen right now</text><rect x="40" y="250" width="420" height="95" fill="#FFFFFF" stroke="#C03A1F" stroke-width="2.5"/><text x="250.0" y="288.9" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141B2B" text-anchor="middle">On the device</text><text x="250.0" y="316.8" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#566078" text-anchor="middle">kept between launches; only this phone</text><text x="490" y="305" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#141B2B" text-anchor="start">e.g. saved orders, a cached menu</text><rect x="40" y="370" width="420" height="95" fill="#FFF2EE" stroke="#C03A1F" stroke-width="2.5"/><text x="250.0" y="408.9" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141B2B" text-anchor="middle">On the server</text><text x="250.0" y="436.8" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#566078" text-anchor="middle">shared by every app; needs the network</text><text x="490" y="425" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#141B2B" text-anchor="start">e.g. the real menu, every sale</text><text x="40" y="520" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#C03A1F" text-anchor="start">The server holds the true copy. The others are copies, and can be out of date.</text></svg>