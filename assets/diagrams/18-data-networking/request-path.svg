<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="The path of a request"><title>The path of a request</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#566078"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#566078"/></marker></defs><rect width="1100" height="520" fill="#FFFFFF"/><text x="40" y="52" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#141B2B" text-anchor="start">The path of a request</text><text x="40" y="84" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#566078" text-anchor="start">What happens when the counter app asks for a price</text><rect x="40" y="170" width="220" height="110" fill="#FFF2EE" stroke="#C03A1F" stroke-width="2.5"/><text x="150.0" y="216.4" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141B2B" text-anchor="middle">App</text><text x="150.0" y="244.3" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#566078" text-anchor="middle">the counter tablet</text><rect x="840" y="170" width="220" height="110" fill="#FFF2EE" stroke="#C03A1F" stroke-width="2.5"/><text x="950.0" y="216.4" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#141B2B" text-anchor="middle">Server</text><text x="950.0" y="244.3" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#566078" text-anchor="middle">the shop&#x27;s menu</text><text x="550" y="148" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#566078" text-anchor="middle">across the network: Wi-Fi, providers, and more</text><line x1="262" y1="205" x2="838" y2="205" stroke="#566078" stroke-width="2.5" marker-end="url(#head)"/><text x="550" y="192" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#141B2B" text-anchor="True">GET /menu/iced-latte</text><line x1="838" y1="250" x2="276" y2="250" stroke="#C03A1F" stroke-width="2.5"/><path d="M276,244 L262,250 L276,256 z" fill="#C03A1F"/><text x="550" y="280" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#C03A1F" text-anchor="True">200 OK + the iced latte as JSON</text><text x="40" y="370" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#141B2B" text-anchor="start">1. The app sends a request: a method, a path, and headers.</text><text x="40" y="402" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#141B2B" text-anchor="start">2. The server finds the data, and sends a response: a status code, headers, and a body.</text><text x="40" y="434" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#141B2B" text-anchor="start">3. The app reads the body (JSON), and shows the price.</text><text x="40" y="486" font-family="'Nunito Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#C03A1F" text-anchor="start">Any step can fail, or be slow: the app must be ready for that.</text></svg>