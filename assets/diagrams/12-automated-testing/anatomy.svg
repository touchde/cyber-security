<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-label="What a test does"><title>What a test does</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5E5470"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5E5470"/></marker></defs><rect width="1100" height="450" fill="#FFFFFF"/><text x="40" y="52" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1E1430" text-anchor="start">What a test does</text><text x="40" y="84" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5470" text-anchor="start">Three steps: arrange, act, assert</text><rect x="40" y="140" width="320" height="110" fill="#F5F0FC" stroke="#5E3594" stroke-width="2.5"/><text x="200.0" y="186.4" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1430" text-anchor="middle">Arrange</text><text x="200.0" y="214.3" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5470" text-anchor="middle">set up what the test needs</text><text x="200" y="290" font-family="'Inconsolata', Menlo, monospace" font-size="18" font-weight="400" fill="#1E1430" text-anchor="middle">prices = [6000, 4000]</text><rect x="395" y="140" width="320" height="110" fill="#FFFFFF" stroke="#5E3594" stroke-width="2.5"/><text x="555.0" y="186.4" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1430" text-anchor="middle">Act</text><text x="555.0" y="214.3" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5470" text-anchor="middle">do the one thing being tested</text><text x="555" y="290" font-family="'Inconsolata', Menlo, monospace" font-size="18" font-weight="400" fill="#1E1430" text-anchor="middle">orderTotal(prices, member: true)</text><line x1="362" y1="195" x2="393" y2="195" stroke="#5E5470" stroke-width="2.5" marker-end="url(#head)"/><rect x="750" y="140" width="320" height="110" fill="#E7F7EE" stroke="#1F8A4F" stroke-width="2.5"/><text x="910.0" y="186.4" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1430" text-anchor="middle">Assert</text><text x="910.0" y="214.3" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5470" text-anchor="middle">check the result</text><text x="910" y="290" font-family="'Inconsolata', Menlo, monospace" font-size="18" font-weight="400" fill="#1E1430" text-anchor="middle">expect(..., 8800)</text><line x1="717" y1="195" x2="748" y2="195" stroke="#5E5470" stroke-width="2.5" marker-end="url(#head)"/><text x="40" y="370" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#1E1430" text-anchor="start">A test is a small program that checks another program.</text><text x="40" y="402" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5470" text-anchor="start">If the result is not what you expected, the test fails, and tells you what it got instead.</text></svg>