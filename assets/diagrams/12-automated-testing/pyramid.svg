<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-label="The test pyramid"><title>The test pyramid</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5E5470"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5E5470"/></marker></defs><rect width="1100" height="580" fill="#FFFFFF"/><text x="40" y="52" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1E1430" text-anchor="start">The test pyramid</text><text x="40" y="84" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5470" text-anchor="start">Many small, fast tests at the bottom; a few big ones at the top</text><rect x="280.0" y="120" width="300" height="96" fill="#FFFFFF" stroke="#5E3594" stroke-width="2.5"/><text x="430.0" y="159.4" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1430" text-anchor="middle">End-to-end</text><text x="430.0" y="187.3" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5470" text-anchor="middle">the whole app on a device</text><rect x="210.0" y="228" width="440" height="96" fill="#F5F0FC" stroke="#5E3594" stroke-width="2.5"/><text x="430.0" y="267.4" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1430" text-anchor="middle">Integration</text><text x="430.0" y="295.3" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5470" text-anchor="middle">several parts together</text><rect x="140.0" y="336" width="580" height="96" fill="#F5F0FC" stroke="#5E3594" stroke-width="2.5"/><text x="430.0" y="375.4" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1430" text-anchor="middle">UI component</text><text x="430.0" y="403.3" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5470" text-anchor="middle">one screen or widget</text><rect x="70.0" y="444" width="720" height="96" fill="#E7F7EE" stroke="#1F8A4F" stroke-width="2.5"/><text x="430.0" y="483.4" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1430" text-anchor="middle">Unit</text><text x="430.0" y="511.3" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5470" text-anchor="middle">one function or class</text><text x="840" y="165" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5470" text-anchor="start">Fewer, slower,</text><text x="840" y="190" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5470" text-anchor="start">costly to keep</text><text x="840" y="490" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1F8A4F" text-anchor="start">Many, fast,</text><text x="840" y="515" font-family="'Lexend', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1F8A4F" text-anchor="start">cheap to keep</text><line x1="820" y1="470" x2="820" y2="200" stroke="#5E5470" stroke-width="2.5" marker-end="url(#head)"/></svg>