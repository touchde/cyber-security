<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="REST request flow between a Flutter app and a server"><title>REST request flow between a Flutter app and a server</title><defs><marker id="arrow-2353C9" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#2353C9"/></marker><marker id="arrow-55607A" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#55607A"/></marker><marker id="arrow-C26A00" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#C26A00"/></marker></defs><rect width="1100" height="560" fill="#FFFFFF"/><text x="40" y="52" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="28" font-weight="700" fill="#14213D" text-anchor="start">A REST request, step by step</text><text x="40" y="82" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start">The app asks; the server answers with a status code and JSON.</text><rect x="40" y="120" width="380" height="400" fill="#F4F6FA" stroke="#D9DEE8" stroke-width="2" stroke-dasharray="8 6"/><text x="56" y="148" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="13" font-weight="700" fill="#55607A" text-anchor="start">FLUTTER APP</text><rect x="70" y="170" width="320" height="64" fill="#EAF0FD" stroke="#2353C9" stroke-width="2"/><text x="230.0" y="198.0" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#14213D" text-anchor="middle">Widget</text><text x="230.0" y="222.0" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle">user taps “Load todos”</text><rect x="70" y="290" width="320" height="64" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="230.0" y="318.0" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#14213D" text-anchor="middle">http.get(uri)</text><text x="230.0" y="342.0" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle">send the request</text><rect x="70" y="410" width="320" height="64" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="230.0" y="438.0" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#14213D" text-anchor="middle">Todo.fromJson(...)</text><text x="230.0" y="462.0" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle">parse and show the data</text><line x1="230" y1="236" x2="230" y2="284" stroke="#55607A" stroke-width="2.5" marker-end="url(#arrow-55607A)"/><rect x="680" y="120" width="380" height="400" fill="#F4F6FA" stroke="#D9DEE8" stroke-width="2" stroke-dasharray="8 6"/><text x="696" y="148" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="13" font-weight="700" fill="#55607A" text-anchor="start">SERVER</text><rect x="710" y="230" width="320" height="64" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="870.0" y="258.0" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#14213D" text-anchor="middle">API endpoint</text><text x="870.0" y="282.0" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle">GET /todos</text><rect x="710" y="380" width="320" height="64" fill="#F4F6FA" stroke="#D9DEE8" stroke-width="2"/><text x="870.0" y="408.0" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#14213D" text-anchor="middle">Database</text><text x="870.0" y="432.0" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle">reads the records</text><line x1="870" y1="296" x2="870" y2="374" stroke="#55607A" stroke-width="2.5" marker-end="url(#arrow-55607A)"/><line x1="394" y1="312" x2="704" y2="262" stroke="#2353C9" stroke-width="2.5" marker-end="url(#arrow-2353C9)"/><text x="549.0" y="263.0" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="600" fill="#2353C9" text-anchor="middle">GET /todos  ·  headers</text><line x1="704" y1="280" x2="394" y2="432" stroke="#C26A00" stroke-width="2.5" marker-end="url(#arrow-C26A00)"/><text x="560" y="446" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="600" fill="#C26A00" text-anchor="middle">200 OK  ·  JSON body</text><text x="560" y="472" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#55607A" text-anchor="middle">[{&quot;id&quot;: 1, &quot;title&quot;: …}]</text></svg>
