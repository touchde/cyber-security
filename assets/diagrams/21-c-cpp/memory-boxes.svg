<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-label="Memory as numbered boxes"><title>Memory as numbered boxes</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#56636B"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#56636B"/></marker></defs><rect width="1100" height="460" fill="#FFFFFF"/><text x="40" y="52" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#172026" text-anchor="start">Memory as numbered boxes</text><text x="40" y="84" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">Eight bytes of memory, shown in hexadecimal. The addresses are examples.</text><text x="145" y="178" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">0x1000</text><rect x="90" y="190" width="110" height="100" fill="#E6F4F2" stroke="#0B7A75" stroke-width="2.5"/><text x="145" y="240" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="32" font-weight="700" fill="#172026" text-anchor="middle">4D</text><text x="145" y="276" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#0B7A75" text-anchor="middle">M</text><text x="260" y="178" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">0x1001</text><rect x="205" y="190" width="110" height="100" fill="#E6F4F2" stroke="#0B7A75" stroke-width="2.5"/><text x="260" y="240" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="32" font-weight="700" fill="#172026" text-anchor="middle">69</text><text x="260" y="276" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#0B7A75" text-anchor="middle">i</text><text x="375" y="178" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">0x1002</text><rect x="320" y="190" width="110" height="100" fill="#E6F4F2" stroke="#0B7A75" stroke-width="2.5"/><text x="375" y="240" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="32" font-weight="700" fill="#172026" text-anchor="middle">6E</text><text x="375" y="276" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#0B7A75" text-anchor="middle">n</text><text x="490" y="178" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">0x1003</text><rect x="435" y="190" width="110" height="100" fill="#E6F4F2" stroke="#0B7A75" stroke-width="2.5"/><text x="490" y="240" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="32" font-weight="700" fill="#172026" text-anchor="middle">61</text><text x="490" y="276" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#0B7A75" text-anchor="middle">a</text><text x="605" y="178" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">0x1004</text><rect x="550" y="190" width="110" height="100" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="605" y="240" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="32" font-weight="700" fill="#172026" text-anchor="middle">10</text><text x="720" y="178" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">0x1005</text><rect x="665" y="190" width="110" height="100" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="720" y="240" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="32" font-weight="700" fill="#172026" text-anchor="middle">27</text><text x="835" y="178" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">0x1006</text><rect x="780" y="190" width="110" height="100" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="835" y="240" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="32" font-weight="700" fill="#172026" text-anchor="middle">00</text><text x="950" y="178" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">0x1007</text><rect x="895" y="190" width="110" height="100" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="950" y="240" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="32" font-weight="700" fill="#172026" text-anchor="middle">00</text><path d="M90,308 L90,322 L545,322 L545,308" fill="none" stroke="#0B7A75" stroke-width="2.5"/><text x="317" y="352" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0B7A75" text-anchor="middle">The text &quot;Mina&quot;: 4 bytes</text><path d="M550,308 L550,322 L1005,322 L1005,308" fill="none" stroke="#0B7A75" stroke-width="2.5"/><text x="777" y="352" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0B7A75" text-anchor="middle">The number 10000: 4 bytes</text><text x="550" y="402" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#56636B" text-anchor="middle">Every box holds one byte, and every box has its own number: its address.</text><text x="550" y="432" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#56636B" text-anchor="middle">The boxes do not say what they mean. The program decides.</text></svg>