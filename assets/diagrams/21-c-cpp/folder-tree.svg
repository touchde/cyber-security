<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="Folders form a tree"><title>Folders form a tree</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#56636B"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#56636B"/></marker></defs><rect width="1100" height="520" fill="#FFFFFF"/><text x="40" y="52" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#172026" text-anchor="start">Folders form a tree</text><text x="40" y="84" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">The shop folder from this section, and the path to one file</text><rect x="80" y="140" width="200" height="50" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="98" y="173" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#172026" text-anchor="start">/</text><text x="310" y="172" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">the top of the tree</text><rect x="150" y="210" width="200" height="50" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="168" y="243" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#172026" text-anchor="start">tmp/</text><path d="M110,190 L110,235 L150,235" fill="none" stroke="#B7C9C7" stroke-width="2.5"/><rect x="220" y="280" width="200" height="50" fill="#E6F4F2" stroke="#0B7A75" stroke-width="2.5"/><text x="238" y="313" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#172026" text-anchor="start">shop/</text><path d="M180,260 L180,305 L220,305" fill="none" stroke="#B7C9C7" stroke-width="2.5"/><text x="450" y="312" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#0B7A75" text-anchor="start">pwd shows /tmp/shop</text><rect x="290" y="350" width="200" height="50" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="308" y="383" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#172026" text-anchor="start">receipts/</text><path d="M250,330 L250,375 L290,375" fill="none" stroke="#B7C9C7" stroke-width="2.5"/><text x="520" y="382" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">mkdir receipts</text><rect x="290" y="420" width="200" height="50" fill="#FFFFFF" stroke="#56636B" stroke-width="2.5"/><text x="308" y="453" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#172026" text-anchor="start">menu.txt</text><path d="M250,400 L250,445 L290,445" fill="none" stroke="#B7C9C7" stroke-width="2.5"/><text x="520" y="452" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">cat menu.txt</text><text x="780" y="160" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#172026" text-anchor="start">The path to the file:</text><text x="780" y="195" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#0B7A75" text-anchor="start">/tmp/shop/menu.txt</text><text x="780" y="250" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">cd ..  goes up one level,</text><text x="780" y="276" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">from receipts/ back to shop/.</text></svg>