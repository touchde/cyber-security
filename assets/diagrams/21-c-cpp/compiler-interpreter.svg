<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-label="Compiler and interpreter"><title>Compiler and interpreter</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#56636B"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#56636B"/></marker></defs><rect width="1100" height="590" fill="#FFFFFF"/><text x="40" y="52" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#172026" text-anchor="start">Compiler and interpreter</text><text x="40" y="84" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">Two ways to make a processor follow code that people wrote</text><text x="40" y="150" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0B7A75" text-anchor="start">Compiler: translate everything first, then run</text><rect x="40" y="170" width="200" height="100" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="140.0" y="214.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Source code</text><text x="140.0" y="244.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">hello.c</text><rect x="320" y="170" width="200" height="100" fill="#E6F4F2" stroke="#0B7A75" stroke-width="2.5"/><text x="420.0" y="214.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Compiler</text><text x="420.0" y="244.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">checks and translates</text><rect x="600" y="170" width="200" height="100" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="700.0" y="214.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Program file</text><text x="700.0" y="244.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">machine code</text><rect x="880" y="170" width="180" height="100" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="970.0" y="214.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Processor</text><text x="970.0" y="244.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">runs it</text><line x1="240" y1="220" x2="318" y2="220" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><line x1="520" y1="220" x2="598" y2="220" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><line x1="800" y1="220" x2="878" y2="220" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><text x="40" y="315" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">Used by C, C++, and Swift. Slower to start, but the program runs very fast.</text><text x="40" y="390" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0B7A75" text-anchor="start">Interpreter: read and do, one piece at a time, while the program runs</text><rect x="40" y="410" width="200" height="100" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="140.0" y="454.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Source code</text><text x="140.0" y="484.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">hello.py</text><rect x="460" y="410" width="240" height="100" fill="#E6F4F2" stroke="#0B7A75" stroke-width="2.5"/><text x="580.0" y="454.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Interpreter</text><text x="580.0" y="484.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">a running program</text><rect x="880" y="410" width="180" height="100" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="970.0" y="454.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Processor</text><text x="970.0" y="484.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">runs the interpreter</text><line x1="240" y1="460" x2="458" y2="460" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><line x1="700" y1="460" x2="878" y2="460" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><text x="40" y="555" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">Used by Python and JavaScript, often with speed-up tricks. Easy to start, but usually slower.</text></svg>