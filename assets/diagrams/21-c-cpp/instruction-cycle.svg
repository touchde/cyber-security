<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-label="How the processor runs a program"><title>How the processor runs a program</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#56636B"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#56636B"/></marker></defs><rect width="1100" height="610" fill="#FFFFFF"/><text x="40" y="52" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#172026" text-anchor="start">How the processor runs a program</text><text x="40" y="84" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">It repeats the same three steps, one instruction at a time.</text><rect x="90" y="170" width="240" height="120" fill="#E6F4F2" stroke="#0B7A75" stroke-width="2.5"/><text x="210.0" y="224.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">1. Fetch</text><text x="210.0" y="254.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">read the next instruction</text><rect x="430" y="170" width="240" height="120" fill="#E6F4F2" stroke="#0B7A75" stroke-width="2.5"/><text x="550.0" y="224.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">2. Decode</text><text x="550.0" y="254.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">work out what it means</text><rect x="770" y="170" width="240" height="120" fill="#E6F4F2" stroke="#0B7A75" stroke-width="2.5"/><text x="890.0" y="224.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">3. Execute</text><text x="890.0" y="254.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">do the job</text><line x1="330" y1="230" x2="428" y2="230" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><line x1="670" y1="230" x2="768" y2="230" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><path d="M890,290 L890,350 L210,350 L210,294" fill="none" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><text x="550" y="340" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">then the next instruction, billions of times every second</text><text x="90" y="398" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#172026" text-anchor="start">Taking 20% off 10000 riel, in small jobs:</text><rect x="90" y="414" width="920" height="40" fill="#FFFFFF" stroke="#B7C9C7" stroke-width="1.5"/><rect x="97" y="419" width="30" height="30" fill="#0B7A75"/><text x="112" y="440" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="145" y="441" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#172026" text-anchor="start">Read the price from memory</text><text x="990" y="441" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#0B7A75" text-anchor="end">10000</text><rect x="90" y="458" width="920" height="40" fill="#FFFFFF" stroke="#B7C9C7" stroke-width="1.5"/><rect x="97" y="463" width="30" height="30" fill="#0B7A75"/><text x="112" y="484" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="145" y="485" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#172026" text-anchor="start">Divide it by 5</text><text x="990" y="485" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#0B7A75" text-anchor="end">2000</text><rect x="90" y="502" width="920" height="40" fill="#FFFFFF" stroke="#B7C9C7" stroke-width="1.5"/><rect x="97" y="507" width="30" height="30" fill="#0B7A75"/><text x="112" y="528" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="145" y="529" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#172026" text-anchor="start">Subtract that from the price</text><text x="990" y="529" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#0B7A75" text-anchor="end">8000</text><rect x="90" y="546" width="920" height="40" fill="#FFFFFF" stroke="#B7C9C7" stroke-width="1.5"/><rect x="97" y="551" width="30" height="30" fill="#0B7A75"/><text x="112" y="572" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="145" y="573" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#172026" text-anchor="start">Write the result to memory</text><text x="990" y="573" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#0B7A75" text-anchor="end">8000 saved</text></svg>