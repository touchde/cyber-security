<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-label="What every computer does"><title>What every computer does</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#56636B"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#56636B"/></marker></defs><rect width="1100" height="490" fill="#FFFFFF"/><text x="40" y="52" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#172026" text-anchor="start">What every computer does</text><text x="40" y="84" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">Input, processing, and output, again and again</text><rect x="40" y="150" width="300" height="120" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="190.0" y="204.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Input</text><text x="190.0" y="234.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">data comes in</text><rect x="400" y="150" width="300" height="120" fill="#E6F4F2" stroke="#0B7A75" stroke-width="2.5"/><text x="550.0" y="204.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Processing</text><text x="550.0" y="234.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">exact steps, from a program</text><rect x="760" y="150" width="300" height="120" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="910.0" y="204.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Output</text><text x="910.0" y="234.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">a result goes out</text><line x1="340" y1="210" x2="398" y2="210" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><line x1="700" y1="210" x2="758" y2="210" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><text x="190" y="320" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0B7A75" text-anchor="middle">Mina presses the key</text><text x="190" y="346" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">for an iced latte</text><text x="550" y="320" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0B7A75" text-anchor="middle">take 20% off, add the tax</text><text x="550" y="346" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">billions of small steps a second</text><text x="910" y="320" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0B7A75" text-anchor="middle">the receipt prints</text><text x="910" y="346" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">6600 riel</text><text x="40" y="420" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#172026" text-anchor="start">A phone, a laptop, and the chip in a coffee machine all follow this pattern.</text><text x="40" y="452" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">The computer knows nothing about lattes. It only follows the program.</text></svg>