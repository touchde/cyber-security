<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="Where the operating system sits"><title>Where the operating system sits</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#56636B"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#56636B"/></marker></defs><rect width="1100" height="640" fill="#FFFFFF"/><text x="40" y="52" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#172026" text-anchor="start">Where the operating system sits</text><text x="40" y="84" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">Between the programs you run and the machine itself</text><rect x="40" y="130" width="330" height="90" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="205.0" y="169.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Your C program</text><text x="205.0" y="199.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">a process</text><rect x="385" y="130" width="330" height="90" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="550.0" y="169.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Web browser</text><text x="550.0" y="199.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">a process</text><rect x="730" y="130" width="330" height="90" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="895.0" y="169.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Music app</text><text x="895.0" y="199.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">a process</text><rect x="40" y="290" width="1020" height="110" fill="#E6F4F2" stroke="#0B7A75" stroke-width="2.5"/><text x="550.0" y="339.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Operating system</text><text x="550.0" y="369.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">runs programs · shares the processor · protects memory · manages files · talks to devices</text><rect x="40" y="470" width="1020" height="90" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="550.0" y="509.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Hardware</text><text x="550.0" y="539.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">processor, memory, storage, screen, keyboard, network</text><line x1="205" y1="222" x2="205" y2="288" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><line x1="550" y1="222" x2="550" y2="288" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><line x1="895" y1="222" x2="895" y2="288" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><line x1="550" y1="402" x2="550" y2="468" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><text x="222" y="262" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#0B7A75" text-anchor="start">system call: “print this line”</text><text x="40" y="610" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#172026" text-anchor="start">Programs never touch the hardware directly. They ask the operating system.</text></svg>