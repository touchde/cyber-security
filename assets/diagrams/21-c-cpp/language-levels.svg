<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-label="From C down to machine code"><title>From C down to machine code</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#56636B"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#56636B"/></marker></defs><rect width="1100" height="620" fill="#FFFFFF"/><text x="40" y="52" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#172026" text-anchor="start">From C down to machine code</text><text x="40" y="84" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">Adding the tax, written three ways (ARM processor)</text><rect x="40" y="130" width="700" height="100" fill="#E6F4F2" stroke="#0B7A75" stroke-width="2.5"/><text x="70" y="170" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#172026" text-anchor="start">High-level language: C</text><text x="70" y="206" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#0B7A75" text-anchor="start">price + tax</text><text x="790" y="176" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#56636B" text-anchor="start">Read easily by:</text><text x="790" y="204" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#172026" text-anchor="start">Most programmers</text><rect x="40" y="280" width="700" height="100" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="70" y="320" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#172026" text-anchor="start">Assembly</text><text x="70" y="356" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#0B7A75" text-anchor="start">add w0, w1, w0</text><text x="790" y="326" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#56636B" text-anchor="start">Read easily by:</text><text x="790" y="354" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#172026" text-anchor="start">Careful people</text><line x1="390" y1="232" x2="390" y2="278" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><text x="410" y="262" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#56636B" text-anchor="start">compiler</text><rect x="40" y="430" width="700" height="100" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="70" y="470" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#172026" text-anchor="start">Machine code</text><text x="70" y="506" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#0B7A75" text-anchor="start">0b000020</text><text x="790" y="476" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#56636B" text-anchor="start">Read easily by:</text><text x="790" y="504" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#172026" text-anchor="start">The processor</text><line x1="390" y1="382" x2="390" y2="428" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><text x="410" y="412" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#56636B" text-anchor="start">assembler</text><text x="40" y="590" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">The same work at three levels. Higher is closer to how people think; lower is closer to the machine.</text></svg>