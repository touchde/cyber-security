<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-label="Reading one byte"><title>Reading one byte</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#56636B"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#56636B"/></marker></defs><rect width="1100" height="410" fill="#FFFFFF"/><text x="40" y="52" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#172026" text-anchor="start">Reading one byte</text><text x="40" y="84" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">Each bit is worth double the bit on its right. Add the values of the bits that are 1.</text><text x="175" y="165" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#56636B" text-anchor="middle">128</text><rect x="130" y="180" width="90" height="90" fill="#FFFFFF" stroke="#B7C9C7" stroke-width="2.5"/><text x="175" y="240" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="40" font-weight="700" fill="#56636B" text-anchor="middle">0</text><text x="280" y="165" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0B7A75" text-anchor="middle">64</text><rect x="235" y="180" width="90" height="90" fill="#0B7A75" stroke="#0B7A75" stroke-width="2.5"/><text x="280" y="240" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="385" y="165" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#56636B" text-anchor="middle">32</text><rect x="340" y="180" width="90" height="90" fill="#FFFFFF" stroke="#B7C9C7" stroke-width="2.5"/><text x="385" y="240" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="40" font-weight="700" fill="#56636B" text-anchor="middle">0</text><text x="490" y="165" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#56636B" text-anchor="middle">16</text><rect x="445" y="180" width="90" height="90" fill="#FFFFFF" stroke="#B7C9C7" stroke-width="2.5"/><text x="490" y="240" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="40" font-weight="700" fill="#56636B" text-anchor="middle">0</text><text x="595" y="165" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0B7A75" text-anchor="middle">8</text><rect x="550" y="180" width="90" height="90" fill="#0B7A75" stroke="#0B7A75" stroke-width="2.5"/><text x="595" y="240" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="700" y="165" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0B7A75" text-anchor="middle">4</text><rect x="655" y="180" width="90" height="90" fill="#0B7A75" stroke="#0B7A75" stroke-width="2.5"/><text x="700" y="240" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="805" y="165" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#56636B" text-anchor="middle">2</text><rect x="760" y="180" width="90" height="90" fill="#FFFFFF" stroke="#B7C9C7" stroke-width="2.5"/><text x="805" y="240" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="40" font-weight="700" fill="#56636B" text-anchor="middle">0</text><text x="910" y="165" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0B7A75" text-anchor="middle">1</text><rect x="865" y="180" width="90" height="90" fill="#0B7A75" stroke="#0B7A75" stroke-width="2.5"/><text x="910" y="240" font-family="'Source Code Pro', Menlo, Consolas, monospace" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="40" y="170" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">Place value</text><text x="40" y="232" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">One byte</text><text x="550" y="325" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="700" fill="#172026" text-anchor="middle">64 + 8 + 4 + 1 = 77</text><text x="550" y="372" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#56636B" text-anchor="middle">The same value, three ways:  decimal 77   ·   hexadecimal 4D   ·   the letter M in ASCII</text></svg>