<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" role="img" aria-label="Finding the biggest order"><title>Finding the biggest order</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#56636B"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#56636B"/></marker></defs><rect width="1100" height="710" fill="#FFFFFF"/><text x="40" y="52" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#172026" text-anchor="start">Finding the biggest order</text><text x="40" y="84" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">Vanna&#x27;s steps, drawn as a flowchart</text><rect x="60" y="130" width="300" height="80" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="210.0" y="164.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Paper = 0</text><text x="210.0" y="194.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">the biggest so far</text><rect x="60" y="260" width="300" height="80" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="210.0" y="308.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Take the next order</text><polygon points="210,385 360,445 210,505 60,445" fill="#E6F4F2" stroke="#0B7A75" stroke-width="2.5"/><text x="210" y="440" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#172026" text-anchor="middle">Bigger than</text><text x="210" y="464" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#172026" text-anchor="middle">the paper?</text><rect x="480" y="405" width="300" height="80" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="630.0" y="453.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Paper = this order</text><polygon points="210,555 360,615 210,675 60,615" fill="#E6F4F2" stroke="#0B7A75" stroke-width="2.5"/><text x="210" y="610" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#172026" text-anchor="middle">More orders?</text><text x="210" y="634" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#172026" text-anchor="middle"></text><rect x="480" y="575" width="300" height="80" fill="#E6F4F2" stroke="#0B7A75" stroke-width="2.5"/><text x="630.0" y="623.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Answer: the paper</text><line x1="210" y1="212" x2="210" y2="258" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><line x1="210" y1="342" x2="210" y2="383" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><line x1="362" y1="445" x2="478" y2="445" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><text x="400" y="433" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#0B7A75" text-anchor="start">yes</text><line x1="210" y1="507" x2="210" y2="553" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><text x="222" y="522" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#56636B" text-anchor="start">no</text><path d="M630,487 L630,530 L210,530" fill="none" stroke="#56636B" stroke-width="2.5"/><line x1="362" y1="615" x2="478" y2="615" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><text x="400" y="603" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#56636B" text-anchor="start">no</text><path d="M60,615 L30,615 L30,300 L58,300" fill="none" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><text x="38" y="596" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#0B7A75" text-anchor="start">yes</text><text x="840" y="160" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#172026" text-anchor="start">Three patterns:</text><text x="840" y="195" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">Sequence: one step,</text><text x="840" y="219" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">then the next</text><text x="840" y="260" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">Decision: the diamonds</text><text x="840" y="300" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">Repetition: the arrow</text><text x="840" y="324" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">back up</text></svg>