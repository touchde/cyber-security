<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-label="The parts of a computer"><title>The parts of a computer</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#56636B"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#56636B"/></marker></defs><rect width="1100" height="630" fill="#FFFFFF"/><text x="40" y="52" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#172026" text-anchor="start">The parts of a computer</text><text x="40" y="84" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="start">Following one order at Mina Coffee, from key press to receipt</text><rect x="30" y="210" width="240" height="110" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="150.0" y="259.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Input</text><text x="150.0" y="289.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">keyboard, touch screen</text><rect x="390" y="115" width="320" height="110" fill="#E6F4F2" stroke="#0B7A75" stroke-width="2.5"/><text x="550.0" y="164.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Processor (CPU)</text><text x="550.0" y="194.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">follows instructions</text><rect x="390" y="300" width="320" height="110" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="550.0" y="349.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Memory (RAM)</text><text x="550.0" y="379.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">fast, lost with no power</text><rect x="830" y="210" width="240" height="110" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="950.0" y="259.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Output</text><text x="950.0" y="289.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">printer, screen</text><rect x="390" y="490" width="320" height="110" fill="#FFFFFF" stroke="#0B7A75" stroke-width="2.5"/><text x="550.0" y="539.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#172026" text-anchor="middle">Storage (SSD)</text><text x="550.0" y="569.0" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#56636B" text-anchor="middle">slower, keeps data with no power</text><line x1="270" y1="240" x2="388" y2="170" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><line x1="712" y1="170" x2="828" y2="240" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)"/><line x1="550" y1="227" x2="550" y2="298" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#tail)"/><line x1="550" y1="412" x2="550" y2="488" stroke="#56636B" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#tail)"/><rect x="520" y="435" width="30" height="30" fill="#0B7A75"/><text x="535" y="456" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="305" y="190" width="30" height="30" fill="#0B7A75"/><text x="320" y="211" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="520" y="247" width="30" height="30" fill="#0B7A75"/><text x="535" y="268" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="765" y="190" width="30" height="30" fill="#0B7A75"/><text x="780" y="211" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><rect x="585" y="435" width="30" height="30" fill="#0B7A75"/><text x="600" y="456" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="745" y="470" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#56636B" text-anchor="start">1  Program copied to memory</text><text x="745" y="498" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#56636B" text-anchor="start">2  A key is pressed</text><text x="745" y="526" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#56636B" text-anchor="start">3  Processor reads and writes memory</text><text x="745" y="554" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#56636B" text-anchor="start">4  Result goes to the printer</text><text x="745" y="582" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#56636B" text-anchor="start">5  Sales saved to storage</text></svg>