<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="A link that opens the app or the website"><title>A link that opens the app or the website</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5E5366"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5E5366"/></marker></defs><rect width="1100" height="520" fill="#FFFFFF"/><text x="40" y="52" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1C1426" text-anchor="start">A link that opens the app or the website</text><text x="40" y="84" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="start">Universal Links on iOS and App Links on Android</text><rect x="40" y="200" width="270" height="110" fill="#E2F7F2" stroke="#B0204F" stroke-width="2.5"/><text x="175.0" y="246.9" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">A tap on a link</text><text x="175.0" y="273.95" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5E5366" text-anchor="middle">minacoffee.example/order/latte</text><rect x="400" y="200" width="260" height="110" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="530.0" y="247.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">The phone checks</text><text x="530.0" y="273.6" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5E5366" text-anchor="middle">Is the app installed and verified?</text><line x1="312" y1="255" x2="398" y2="255" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><rect x="760" y="120" width="300" height="100" fill="#FBE9F0" stroke="#B0204F" stroke-width="2.5"/><text x="910.0" y="161.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">The app opens</text><text x="910.0" y="189.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">at the order screen</text><rect x="760" y="290" width="300" height="100" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="910.0" y="331.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">The website opens</text><text x="910.0" y="359.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">the same order page</text><line x1="662" y1="235" x2="758" y2="170" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><line x1="662" y1="275" x2="758" y2="340" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><text x="700" y="180" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#5E5366" text-anchor="middle">yes</text><text x="700" y="345" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#5E5366" text-anchor="middle">no</text><text x="40" y="450" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1C1426" text-anchor="start">One https address works in both cases, so a link never leads nowhere.</text><text x="40" y="480" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5E5366" text-anchor="start">The link files on the website and the settings in the app decide which way it goes.</text></svg>