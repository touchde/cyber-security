<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-label="A grid with three columns"><title>A grid with three columns</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5E5366"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5E5366"/></marker></defs><rect width="1100" height="450" fill="#FFFFFF"/><text x="40" y="52" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1C1426" text-anchor="start">A grid with three columns</text><text x="40" y="84" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="start">Columns, rows, and the numbered lines between them</text><rect x="100" y="130" width="200" height="120" fill="#FBE9F0" stroke="#B0204F" stroke-width="2.5"/><text x="200.0" y="198.05" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">cell 1</text><rect x="320" y="130" width="200" height="120" fill="#E2F7F2" stroke="#B0204F" stroke-width="2.5"/><text x="420.0" y="198.05" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">cell 2</text><rect x="540" y="130" width="200" height="120" fill="#E2F7F2" stroke="#B0204F" stroke-width="2.5"/><text x="640.0" y="198.05" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">cell 3</text><rect x="100" y="270" width="200" height="120" fill="#E2F7F2" stroke="#B0204F" stroke-width="2.5"/><text x="200.0" y="338.05" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">cell 4</text><rect x="320" y="270" width="200" height="120" fill="#E2F7F2" stroke="#B0204F" stroke-width="2.5"/><text x="420.0" y="338.05" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">cell 5</text><rect x="540" y="270" width="200" height="120" fill="#E2F7F2" stroke="#B0204F" stroke-width="2.5"/><text x="640.0" y="338.05" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">cell 6</text><text x="90" y="420" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#1C1426" text-anchor="middle">line 1</text><text x="310" y="420" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#1C1426" text-anchor="middle">line 2</text><text x="530" y="420" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#1C1426" text-anchor="middle">line 3</text><text x="750" y="420" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#1C1426" text-anchor="middle">line 4</text><text x="780" y="200" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1C1426" text-anchor="start">grid-template-columns:</text><text x="780" y="226" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="start">repeat(3, 1fr)</text><text x="780" y="290" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5E5366" text-anchor="start">Lines are numbered from 1;</text><text x="780" y="314" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5E5366" text-anchor="start">items can span between lines.</text></svg>