<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-label="Everything on one domain"><title>Everything on one domain</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5E5366"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5E5366"/></marker></defs><rect width="1100" height="460" fill="#FFFFFF"/><text x="40" y="52" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1C1426" text-anchor="start">Everything on one domain</text><text x="40" y="84" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="start">How the Mina Coffee projects share one address</text><rect x="330" y="120" width="440" height="90" fill="#FBE9F0" stroke="#B0204F" stroke-width="2.5"/><text x="550.0" y="156.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">One domain, one server</text><text x="550.0" y="184.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">HTTPS for every path</text><rect x="40" y="260" width="186" height="110" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="133.0" y="304.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#1C1426" text-anchor="middle">minacoffee.example</text><text x="133.0" y="330.8" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">website and menu</text><path d="M550,210 L550,235 L133.0,235 L133.0,258" fill="none" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><rect x="256" y="260" width="186" height="110" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="349.0" y="306.9" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">/app</text><text x="349.0" y="333.95" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5E5366" text-anchor="middle">the installable menu</text><path d="M550,210 L550,235 L349.0,235 L349.0,258" fill="none" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><rect x="472" y="260" width="186" height="110" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="565.0" y="306.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">/admin</text><text x="565.0" y="334.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">staff dashboard</text><path d="M550,210 L550,235 L565.0,235 L565.0,258" fill="none" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><rect x="688" y="260" width="186" height="110" fill="#E2F7F2" stroke="#B0204F" stroke-width="2.5"/><text x="781.0" y="307.9" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">/api</text><text x="781.0" y="333.25" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5E5366" text-anchor="middle">JSON for app and web</text><path d="M550,210 L550,235 L781.0,235 L781.0,258" fill="none" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><rect x="904" y="260" width="186" height="110" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="997.0" y="306.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">/.well-known</text><text x="997.0" y="334.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">app and Play links</text><path d="M550,210 L550,235 L997.0,235 L997.0,258" fill="none" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><text x="40" y="420" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="start">The mobile app calls /api, opens order links under /order, and checks /.well-known for app links.</text></svg>