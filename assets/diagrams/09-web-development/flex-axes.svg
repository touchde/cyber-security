<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-label="Flexbox axes"><title>Flexbox axes</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5E5366"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5E5366"/></marker></defs><rect width="1100" height="480" fill="#FFFFFF"/><text x="40" y="52" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1C1426" text-anchor="start">Flexbox axes</text><text x="40" y="84" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="start">A flex container lays its items out in one direction</text><rect x="60" y="130" width="760" height="200" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><rect x="90" y="175" width="200" height="110" fill="#E2F7F2" stroke="#B0204F" stroke-width="2.5"/><text x="190.0" y="221.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">Latte</text><text x="190.0" y="249.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">flex item</text><rect x="320" y="175" width="200" height="110" fill="#E2F7F2" stroke="#B0204F" stroke-width="2.5"/><text x="420.0" y="221.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">Mocha</text><text x="420.0" y="249.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">flex item</text><rect x="550" y="175" width="200" height="110" fill="#E2F7F2" stroke="#B0204F" stroke-width="2.5"/><text x="650.0" y="221.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">Tea</text><text x="650.0" y="249.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">flex item</text><line x1="60" y1="370" x2="818" y2="370" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><text x="440" y="400" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1C1426" text-anchor="middle">main axis (flex-direction: row)</text><line x1="860" y1="130" x2="860" y2="328" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><text x="880" y="235" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1C1426" text-anchor="start">cross axis</text><text x="60" y="450" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="start">justify-content arranges items along the main axis; align-items, along the cross axis.</text></svg>