<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-label="How the cascade picks a winner"><title>How the cascade picks a winner</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5E5366"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5E5366"/></marker></defs><rect width="1100" height="350" fill="#FFFFFF"/><text x="40" y="52" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1C1426" text-anchor="start">How the cascade picks a winner</text><text x="40" y="84" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="start">Checked from left to right</text><rect x="40" y="140" width="230" height="110" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="155.0" y="185.1" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1C1426" text-anchor="middle">1. Origin and importance</text><text x="155.0" y="210.95" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5E5366" text-anchor="middle">!important, author, browser</text><rect x="305" y="140" width="230" height="110" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="420.0" y="186.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">2. Cascade layers</text><text x="420.0" y="214.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">@layer order</text><line x1="270" y1="195" x2="303" y2="195" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><rect x="570" y="140" width="230" height="110" fill="#FBE9F0" stroke="#B0204F" stroke-width="2.5"/><text x="685.0" y="186.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">3. Specificity</text><text x="685.0" y="214.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">id &gt; class &gt; element</text><line x1="535" y1="195" x2="568" y2="195" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><rect x="835" y="140" width="230" height="110" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="950.0" y="186.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">4. Order</text><text x="950.0" y="214.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">the later rule wins</text><line x1="800" y1="195" x2="833" y2="195" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><text x="40" y="310" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1C1426" text-anchor="start">When two rules set the same property, the browser compares them in this order; the first difference decides.</text></svg>