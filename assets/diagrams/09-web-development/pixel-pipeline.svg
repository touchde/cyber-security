<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-label="From URL to pixels"><title>From URL to pixels</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5E5366"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5E5366"/></marker></defs><rect width="1100" height="460" fill="#FFFFFF"/><text x="40" y="52" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1C1426" text-anchor="start">From URL to pixels</text><text x="40" y="84" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="start">The steps a browser takes for every page</text><rect x="40" y="120" width="300" height="100" fill="#E2F7F2" stroke="#B0204F" stroke-width="2.5"/><text x="190.0" y="161.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">1. Request</text><text x="190.0" y="189.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">DNS, TCP, TLS, HTTP</text><rect x="400" y="120" width="300" height="100" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="550.0" y="161.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">2. Parse</text><text x="550.0" y="189.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">HTML to DOM, CSS to CSSOM</text><line x1="342" y1="170.0" x2="398" y2="170.0" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><rect x="760" y="120" width="300" height="100" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="910.0" y="161.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">3. Render tree</text><text x="910.0" y="189.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">visible nodes + styles</text><line x1="702" y1="170.0" x2="758" y2="170.0" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><rect x="40" y="280" width="300" height="100" fill="#FBE9F0" stroke="#B0204F" stroke-width="2.5"/><text x="190.0" y="321.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">4. Layout</text><text x="190.0" y="349.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">sizes and positions</text><path d="M910.0,220 L910.0,250.0 L190.0,250.0 L190.0,278" fill="none" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><rect x="400" y="280" width="300" height="100" fill="#FBE9F0" stroke="#B0204F" stroke-width="2.5"/><text x="550.0" y="321.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">5. Paint</text><text x="550.0" y="349.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">pixels for each layer</text><line x1="342" y1="330.0" x2="398" y2="330.0" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><rect x="760" y="280" width="300" height="100" fill="#E2F7F2" stroke="#B0204F" stroke-width="2.5"/><text x="910.0" y="321.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">6. Composite</text><text x="910.0" y="349.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">layers into one frame</text><line x1="702" y1="330.0" x2="758" y2="330.0" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><text x="40" y="425" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1C1426" text-anchor="start">JavaScript and CSS changes can send the browser back to layout, paint, or only composite.</text></svg>