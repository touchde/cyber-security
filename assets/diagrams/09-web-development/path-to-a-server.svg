<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370" role="img" aria-label="From a phone to a server"><title>From a phone to a server</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5E5366"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5E5366"/></marker></defs><rect width="1100" height="370" fill="#FFFFFF"/><text x="40" y="52" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1C1426" text-anchor="start">From a phone to a server</text><text x="40" y="84" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="start">The networks between Mina&#x27;s phone and a website</text><rect x="30" y="140" width="184" height="100" fill="#E2F7F2" stroke="#B0204F" stroke-width="2.5"/><text x="122.0" y="181.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">Phone</text><text x="122.0" y="209.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">at Mina Coffee</text><rect x="244" y="140" width="184" height="100" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="336.0" y="181.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">Wi-Fi router</text><text x="336.0" y="209.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">the shop&#x27;s network</text><line x1="216" y1="190" x2="242" y2="190" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#tail)"/><rect x="458" y="140" width="184" height="100" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="550.0" y="169.0" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#1C1426" text-anchor="middle">Internet provider</text><text x="550.0" y="196.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">for example, a</text><text x="550.0" y="219.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">Cambodian ISP</text><line x1="430" y1="190" x2="456" y2="190" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#tail)"/><rect x="672" y="140" width="184" height="100" fill="#FBE9F0" stroke="#B0204F" stroke-width="2.5"/><text x="764.0" y="182.9" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">The internet</text><text x="764.0" y="208.25" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5E5366" text-anchor="middle">many networks, joined</text><line x1="644" y1="190" x2="670" y2="190" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#tail)"/><rect x="886" y="140" width="184" height="100" fill="#E2F7F2" stroke="#B0204F" stroke-width="2.5"/><text x="978.0" y="181.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">Data center</text><text x="978.0" y="209.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">the server</text><line x1="858" y1="190" x2="884" y2="190" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#tail)"/><text x="30" y="300" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1C1426" text-anchor="start">A request leaves the phone, crosses several networks, and reaches a server in a data center.</text><text x="30" y="330" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5E5366" text-anchor="start">The answer comes back the same way. Each step is a router that passes the data on.</text></svg>