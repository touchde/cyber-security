<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="490" viewBox="0 0 1110 490" role="img" aria-label="Packets"><title>Packets</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5E5366"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5E5366"/></marker></defs><rect width="1110" height="490" fill="#FFFFFF"/><text x="40" y="52" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1C1426" text-anchor="start">Packets</text><text x="40" y="84" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="start">How a photo travels across the internet</text><rect x="40" y="150" width="200" height="110" fill="#E2F7F2" stroke="#B0204F" stroke-width="2.5"/><text x="140.0" y="196.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">Photo of a latte</text><text x="140.0" y="224.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">300 KB</text><rect x="290" y="120" width="120" height="34" fill="#FBE9F0" stroke="#B0204F" stroke-width="2.5"/><text x="350" y="143" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#B0204F" text-anchor="middle">packet 1</text><rect x="290" y="165" width="120" height="34" fill="#FBE9F0" stroke="#B0204F" stroke-width="2.5"/><text x="350" y="188" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#B0204F" text-anchor="middle">packet 2</text><rect x="290" y="210" width="120" height="34" fill="#FBE9F0" stroke="#B0204F" stroke-width="2.5"/><text x="350" y="233" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#B0204F" text-anchor="middle">packet 3</text><rect x="290" y="255" width="120" height="34" fill="#FBE9F0" stroke="#B0204F" stroke-width="2.5"/><text x="350" y="278" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#B0204F" text-anchor="middle">packet 4</text><line x1="242" y1="205" x2="288" y2="205" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><rect x="520" y="110" width="120" height="56" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="580.0" y="146.05" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">Router</text><rect x="520" y="250" width="120" height="56" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="580.0" y="286.05" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">Router</text><rect x="690" y="180" width="120" height="56" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="750.0" y="216.05" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">Router</text><rect x="690" y="320" width="120" height="56" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="750.0" y="356.05" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">Router</text><line x1="412" y1="137" x2="518" y2="132" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><line x1="412" y1="182" x2="518" y2="150" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><line x1="412" y1="227" x2="518" y2="272" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><line x1="412" y1="272" x2="518" y2="290" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><line x1="640" y1="138" x2="688" y2="205" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><line x1="640" y1="278" x2="688" y2="345" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><line x1="812" y1="208" x2="878" y2="230" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><line x1="812" y1="348" x2="878" y2="260" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><rect x="880" y="190" width="190" height="110" fill="#E2F7F2" stroke="#B0204F" stroke-width="2.5"/><text x="975.0" y="224.9" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">Phone</text><text x="975.0" y="252.8" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">puts packets</text><text x="975.0" y="275.8" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">back in order</text><text x="40" y="420" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1C1426" text-anchor="start">Data is cut into small packets. Each packet can take a different path, and the phone puts them back together.</text><text x="40" y="450" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="start">If a packet is lost, TCP asks for it again, so the photo arrives complete.</text></svg>