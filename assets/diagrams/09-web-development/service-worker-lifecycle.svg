<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-label="The service worker lifecycle"><title>The service worker lifecycle</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5E5366"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5E5366"/></marker></defs><rect width="1100" height="430" fill="#FFFFFF"/><text x="40" y="52" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1C1426" text-anchor="start">The service worker lifecycle</text><text x="40" y="84" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="start">From registering to controlling pages</text><rect x="40" y="140" width="180" height="110" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="130.0" y="186.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">register()</text><text x="130.0" y="214.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">the page asks</text><rect x="257" y="140" width="180" height="110" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="347.0" y="186.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">install</text><text x="347.0" y="214.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">save the app shell</text><line x1="222" y1="195" x2="255" y2="195" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><rect x="474" y="140" width="180" height="110" fill="#FBE9F0" stroke="#B0204F" stroke-width="2.5"/><text x="564.0" y="187.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">waiting</text><text x="564.0" y="213.6" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5E5366" text-anchor="middle">old version still open</text><line x1="439" y1="195" x2="472" y2="195" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><rect x="691" y="140" width="180" height="110" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="781.0" y="186.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">activate</text><text x="781.0" y="214.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">delete old caches</text><line x1="656" y1="195" x2="689" y2="195" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><rect x="908" y="140" width="180" height="110" fill="#E2F7F2" stroke="#B0204F" stroke-width="2.5"/><text x="998.0" y="186.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">controlling</text><text x="998.0" y="214.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">fetch, push, sync</text><line x1="873" y1="195" x2="906" y2="195" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)"/><path d="M347.0,250 L347.0,300 L781.0,300 L781.0,252" fill="none" stroke="#5E5366" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#head)"/><text x="564.0" y="330" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1C1426" text-anchor="middle">self.skipWaiting() skips the wait</text><text x="40" y="390" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="start">The first version activates at once. A new version waits until every tab of the old one is closed.</text></svg>