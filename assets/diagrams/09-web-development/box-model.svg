<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="The CSS box model"><title>The CSS box model</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5E5366"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5E5366"/></marker></defs><rect width="1100" height="560" fill="#FFFFFF"/><text x="40" y="52" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1C1426" text-anchor="start">The CSS box model</text><text x="40" y="84" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="start">Every element is a box of four layers</text><rect x="80" y="120" width="640" height="400" fill="#FFF4E5" stroke="#B0204F" stroke-width="2.5"/><text x="95" y="148" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1C1426" text-anchor="start">margin</text><rect x="130" y="165" width="540" height="310" fill="#333333" stroke="#B0204F" stroke-width="0"/><text x="145" y="192" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">border</text><rect x="150" y="205" width="500" height="250" fill="#E2F7F2" stroke="#B0204F" stroke-width="0"/><text x="165" y="232" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1C1426" text-anchor="start">padding</text><rect x="230" y="260" width="340" height="130" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="400.0" y="316.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">content</text><text x="400.0" y="344.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">width x height</text><text x="760" y="200" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1C1426" text-anchor="start">box-sizing: content-box</text><text x="760" y="228" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="start">width = content only</text><text x="760" y="290" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1C1426" text-anchor="start">box-sizing: border-box</text><text x="760" y="318" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="start">width = content + padding</text><text x="760" y="342" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="start">+ border</text></svg>