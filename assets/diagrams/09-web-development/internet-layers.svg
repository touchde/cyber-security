<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="The layers of the internet"><title>The layers of the internet</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5E5366"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5E5366"/></marker></defs><rect width="1000" height="520" fill="#FFFFFF"/><text x="40" y="52" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1C1426" text-anchor="start">The layers of the internet</text><text x="40" y="84" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="start">Four layers, from the meaning down to the wire</text><rect x="40" y="120" width="190" height="66" fill="#FBE9F0" stroke="#B0204F" stroke-width="2.5"/><text x="135" y="161" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#B0204F" text-anchor="middle">Application</text><rect x="230" y="120" width="470" height="66" fill="#FFFFFF" stroke="#EED3DD" stroke-width="2.5"/><text x="250" y="161" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#1C1426" text-anchor="start">HTTP, DNS: what the data means</text><rect x="700" y="120" width="260" height="66" fill="#E2F7F2" stroke="#EED3DD" stroke-width="2.5"/><text x="830" y="161" font-family="'Geist Mono', Menlo, monospace" font-size="17" font-weight="600" fill="#1C1426" text-anchor="middle">a web page, an order</text><rect x="40" y="202" width="190" height="66" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="135" y="243" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#B0204F" text-anchor="middle">Transport</text><rect x="230" y="202" width="470" height="66" fill="#FFFFFF" stroke="#EED3DD" stroke-width="2.5"/><text x="250" y="243" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#1C1426" text-anchor="start">TCP or UDP: deliver it between two programs</text><rect x="700" y="202" width="260" height="66" fill="#E2F7F2" stroke="#EED3DD" stroke-width="2.5"/><text x="830" y="243" font-family="'Geist Mono', Menlo, monospace" font-size="17" font-weight="600" fill="#1C1426" text-anchor="middle">port 443</text><rect x="40" y="284" width="190" height="66" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="135" y="325" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#B0204F" text-anchor="middle">Internet</text><rect x="230" y="284" width="470" height="66" fill="#FFFFFF" stroke="#EED3DD" stroke-width="2.5"/><text x="250" y="325" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#1C1426" text-anchor="start">IP: find the way between networks</text><rect x="700" y="284" width="260" height="66" fill="#E2F7F2" stroke="#EED3DD" stroke-width="2.5"/><text x="830" y="325" font-family="'Geist Mono', Menlo, monospace" font-size="17" font-weight="600" fill="#1C1426" text-anchor="middle">104.18.26.120</text><rect x="40" y="366" width="190" height="66" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="135" y="407" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#B0204F" text-anchor="middle">Link</text><rect x="230" y="366" width="470" height="66" fill="#FFFFFF" stroke="#EED3DD" stroke-width="2.5"/><text x="250" y="407" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#1C1426" text-anchor="start">Wi-Fi, mobile data, cable: one step</text><rect x="700" y="366" width="260" height="66" fill="#E2F7F2" stroke="#EED3DD" stroke-width="2.5"/><text x="830" y="407" font-family="'Geist Mono', Menlo, monospace" font-size="17" font-weight="600" fill="#1C1426" text-anchor="middle">the shop&#x27;s Wi-Fi</text><text x="40" y="480" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1C1426" text-anchor="start">Each layer does one job, and uses the layer below it. The web lives at the top.</text></svg>