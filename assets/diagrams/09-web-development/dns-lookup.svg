<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="530" viewBox="0 0 1060 530" role="img" aria-label="How DNS finds an address"><title>How DNS finds an address</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5E5366"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5E5366"/></marker></defs><rect width="1060" height="530" fill="#FFFFFF"/><text x="40" y="52" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1C1426" text-anchor="start">How DNS finds an address</text><text x="40" y="84" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="start">From a name to an IP address, in a few questions</text><rect x="40" y="170" width="200" height="100" fill="#E2F7F2" stroke="#B0204F" stroke-width="2.5"/><text x="140.0" y="211.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">Browser</text><text x="140.0" y="239.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">minacoffee.example?</text><rect x="330" y="170" width="230" height="100" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="445.0" y="211.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">DNS resolver</text><text x="445.0" y="239.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">your provider, or 1.1.1.1</text><line x1="242" y1="220" x2="328" y2="220" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#tail)"/><rect x="680" y="65" width="330" height="90" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="845.0" y="101.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">Root server</text><text x="845.0" y="129.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">Ask the .example servers</text><line x1="562" y1="220" x2="678" y2="110" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#tail)"/><rect x="640" y="63" width="30" height="30" fill="#B0204F"/><text x="655" y="84" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="680" y="185" width="330" height="90" fill="#FFFFFF" stroke="#B0204F" stroke-width="2.5"/><text x="845.0" y="221.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">Top-level domain</text><text x="845.0" y="249.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">.example: ask the shop&#x27;s DNS host</text><line x1="562" y1="220" x2="678" y2="230" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#tail)"/><rect x="640" y="183" width="30" height="30" fill="#B0204F"/><text x="655" y="204" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="680" y="305" width="330" height="90" fill="#FBE9F0" stroke="#B0204F" stroke-width="2.5"/><text x="845.0" y="341.4" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1C1426" text-anchor="middle">Authoritative server</text><text x="845.0" y="369.3" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E5366" text-anchor="middle">minacoffee.example is 203.0.113.10</text><line x1="562" y1="220" x2="678" y2="350" stroke="#5E5366" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#tail)"/><rect x="640" y="303" width="30" height="30" fill="#B0204F"/><text x="655" y="324" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><rect x="270" y="190" width="30" height="30" fill="#B0204F"/><text x="285" y="211" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="270" y="270" width="30" height="30" fill="#B0204F"/><text x="285" y="291" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="285" y="320" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5E5366" text-anchor="middle">answer, kept for later</text><text x="40" y="460" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1C1426" text-anchor="start">A DNS lookup turns a name into an address. The resolver remembers the answer, so the next lookup is instant.</text><text x="40" y="490" font-family="'Geist', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5E5366" text-anchor="start">203.0.113.10 is an address kept for examples; a real shop has its own.</text></svg>