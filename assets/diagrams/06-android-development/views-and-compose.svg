<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-label="Two ways to build a screen"><title>Two ways to build a screen</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#4F6356"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#4F6356"/></marker></defs><rect width="1100" height="590" fill="#FFFFFF"/><text x="40" y="52" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#13241A" text-anchor="start">Two ways to build a screen</text><text x="40" y="84" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F6356" text-anchor="start">The older View system changes views; Compose describes the screen</text><text x="60" y="140" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#1B7A44" text-anchor="start">Views (XML): find the view, then change it</text><rect x="60" y="160" width="300" height="90" fill="#FFFFFF" stroke="#1B7A44" stroke-width="2.5"/><text x="210.0" y="196.4" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#13241A" text-anchor="middle">activity_orders.xml</text><text x="210.0" y="224.3" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F6356" text-anchor="middle">a TextView with an id</text><rect x="400" y="160" width="300" height="90" fill="#FFFFFF" stroke="#1B7A44" stroke-width="2.5"/><text x="550.0" y="196.4" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#13241A" text-anchor="middle">findViewById</text><text x="550.0" y="224.3" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F6356" text-anchor="middle">get the TextView</text><rect x="740" y="160" width="300" height="90" fill="#FFFFFF" stroke="#1B7A44" stroke-width="2.5"/><text x="890.0" y="196.4" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#13241A" text-anchor="middle">ordersText.text = ...</text><text x="890.0" y="224.3" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F6356" text-anchor="middle">change it, every time</text><line x1="360" y1="205" x2="398" y2="205" stroke="#4F6356" stroke-width="2.5" marker-end="url(#head)"/><line x1="700" y1="205" x2="738" y2="205" stroke="#4F6356" stroke-width="2.5" marker-end="url(#head)"/><text x="60" y="285" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F6356" text-anchor="start">Every change to the data needs code that updates the right view.</text><text x="60" y="360" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#1B7A44" text-anchor="start">Compose: describe the screen from the state</text><rect x="60" y="380" width="300" height="100" fill="#E3FAEC" stroke="#2FB86A" stroke-width="2.5"/><text x="210.0" y="421.4" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#13241A" text-anchor="middle">State</text><text x="210.0" y="449.3" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F6356" text-anchor="middle">orders = 3</text><rect x="400" y="380" width="300" height="100" fill="#EFF8EC" stroke="#1B7A44" stroke-width="2.5"/><text x="550.0" y="421.4" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#13241A" text-anchor="middle">@Composable</text><text x="550.0" y="449.3" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F6356" text-anchor="middle">Text(&quot;Orders waiting: $orders&quot;)</text><rect x="740" y="380" width="300" height="100" fill="#FFFFFF" stroke="#1B7A44" stroke-width="2.5"/><text x="890.0" y="421.4" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#13241A" text-anchor="middle">Screen</text><text x="890.0" y="449.3" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F6356" text-anchor="middle">Orders waiting: 3</text><line x1="360" y1="430" x2="398" y2="430" stroke="#4F6356" stroke-width="2.5" marker-end="url(#head)"/><line x1="700" y1="430" x2="738" y2="430" stroke="#4F6356" stroke-width="2.5" marker-end="url(#head)"/><path d="M210,480 L210,525 L890,525 L890,484" fill="none" stroke="#4F6356" stroke-width="2.5" marker-end="url(#head)"/><text x="550" y="552" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F6356" text-anchor="middle">When the state changes, Compose calls the function again: this is recomposition.</text></svg>