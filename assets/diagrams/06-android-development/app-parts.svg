<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-label="The parts of an Android app"><title>The parts of an Android app</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#4F6356"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#4F6356"/></marker></defs><rect width="1100" height="580" fill="#FFFFFF"/><text x="40" y="52" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#13241A" text-anchor="start">The parts of an Android app</text><text x="40" y="84" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F6356" text-anchor="start">What Android Studio creates, and what it builds on</text><rect x="60" y="130" width="330" height="95" fill="#FFFFFF" stroke="#1B7A44" stroke-width="2.5"/><text x="225.0" y="168.9" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#13241A" text-anchor="middle">AndroidManifest.xml</text><text x="225.0" y="196.8" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F6356" text-anchor="middle">names the app and its activities</text><rect x="60" y="260" width="330" height="95" fill="#E3FAEC" stroke="#2FB86A" stroke-width="2.5"/><text x="225.0" y="298.9" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#13241A" text-anchor="middle">MainActivity</text><text x="225.0" y="326.8" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F6356" text-anchor="middle">an entry point: one screen</text><rect x="60" y="390" width="330" height="95" fill="#EFF8EC" stroke="#1B7A44" stroke-width="2.5"/><text x="225.0" y="428.9" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#13241A" text-anchor="middle">setContent { }</text><text x="225.0" y="456.8" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F6356" text-anchor="middle">the Compose UI starts here</text><line x1="225" y1="225" x2="225" y2="258" stroke="#4F6356" stroke-width="2.5" marker-end="url(#head)"/><line x1="225" y1="355" x2="225" y2="388" stroke="#4F6356" stroke-width="2.5" marker-end="url(#head)"/><rect x="470" y="130" width="270" height="95" fill="#EFF8EC" stroke="#1B7A44" stroke-width="2.5"/><text x="605.0" y="168.9" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#13241A" text-anchor="middle">Composables</text><text x="605.0" y="196.8" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F6356" text-anchor="middle">OrderBoard, Text, Column</text><rect x="780" y="130" width="270" height="95" fill="#FFFFFF" stroke="#1B7A44" stroke-width="2.5"/><text x="915.0" y="168.9" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#13241A" text-anchor="middle">Resources</text><text x="915.0" y="196.8" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F6356" text-anchor="middle">strings, images, icons</text><rect x="470" y="260" width="580" height="95" fill="#FFFFFF" stroke="#1B7A44" stroke-width="2.5"/><text x="760.0" y="298.9" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#13241A" text-anchor="middle">Jetpack libraries (AndroidX)</text><text x="760.0" y="326.8" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F6356" text-anchor="middle">Compose, Activity, Navigation, Room, and more</text><rect x="470" y="390" width=