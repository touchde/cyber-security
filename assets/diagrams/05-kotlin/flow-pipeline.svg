<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-label="A Flow from producer to collector"><title>A Flow from producer to collector</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#6B5462"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#6B5462"/></marker></defs><rect width="1100" height="500" fill="#FFFFFF"/><text x="40" y="52" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1E1219" text-anchor="start">A Flow from producer to collector</text><text x="40" y="84" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B5462" text-anchor="start">Values over time, not all at once like a list</text><rect x="40" y="150" width="300" height="150" fill="#FCF1F6" stroke="#A61E6E" stroke-width="2.5"/><text x="190" y="195" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#A61E6E" text-anchor="middle">producer</text><text x="190" y="235" font-family="'Red Hat Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#1E1219" text-anchor="middle">flow { emit(sale) }</text><text x="190" y="270" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6B5462" text-anchor="middle">the till emits sales</text><rect x="400" y="150" width="300" height="150" fill="#FFFFFF" stroke="#A61E6E" stroke-width="2.5"/><text x="550" y="195" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#A61E6E" text-anchor="middle">operators</text><text x="550" y="235" font-family="'Red Hat Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#1E1219" text-anchor="middle">filter, map, runningFold</text><text x="550" y="270" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6B5462" text-anchor="middle">each value passes through</text><line x1="342" y1="225" x2="398" y2="225" stroke="#6B5462" stroke-width="2.5" marker-end="url(#head)"/><rect x="760" y="150" width="300" height="150" fill="#FFF1E6" stroke="#E8672A" stroke-width="2.5"/><text x="910" y="195" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#E8672A" text-anchor="middle">collector</text><text x="910" y="235" font-family="'Red Hat Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#1E1219" text-anchor="middle">collect { ... }</text><text x="910" y="270" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6B5462" text-anchor="middle">the screen shows each one</text><line x1="702" y1="225" x2="758" y2="225" stroke="#6B5462" stroke-width="2.5" marker-end="url(#head)"/><line x1="100" y1="362" x2="1040" y2="362" stroke="#6B5462" stroke-width="2.5" marker-end="url(#head)"/><rect x="150" y="340" width="110" height="44" fill="#FFFFFF" stroke="#A61E6E" stroke-width="2.5"/><text x="205" y="369" font-family="'Red Hat Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#1E1219" text-anchor="middle">6600</text><rect x="450" y="340" width="110" height="44" fill="#FFFFFF" stroke="#A61E6E" stroke-width="2.5"/><text x="505" y="369" font-family="'Red Hat Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#1E1219" text-anchor="middle">4400</text><rect x="750" y="340" width="110" height="44" fill="#FFFFFF" stroke="#A61E6E" stroke-width="2.5"/><text x="805" y="369" font-family="'Red Hat Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#1E1219" text-anchor="middle">7150</text><text x="550" y="430" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1E1219" text-anchor="middle">Cold: nothing runs until a collector calls collect.</text><text x="550" y="462" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B5462" text-anchor="middle">Values arrive one at a time, when they are ready; emit waits while the collector is busy.</text></svg>