<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-label="From source code to a running program"><title>From source code to a running program</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#6B5462"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#6B5462"/></marker></defs><rect width="1100" height="530" fill="#FFFFFF"/><text x="40" y="52" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1E1219" text-anchor="start">From source code to a running program</text><text x="40" y="84" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B5462" text-anchor="start">Kotlin on the JVM: compile once, run on any system with a JVM</text><rect x="40" y="150" width="225" height="110" fill="#FCF1F6" stroke="#A61E6E" stroke-width="2.5"/><text x="152.5" y="196.4" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1219" text-anchor="middle">Welcome.kt</text><text x="152.5" y="224.3" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B5462" text-anchor="middle">your source code</text><rect x="305" y="150" width="225" height="110" fill="#FFFFFF" stroke="#A61E6E" stroke-width="2.5"/><text x="417.5" y="196.4" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1219" text-anchor="middle">kotlinc</text><text x="417.5" y="224.3" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B5462" text-anchor="middle">the Kotlin compiler</text><line x1="265" y1="205" x2="303" y2="205" stroke="#6B5462" stroke-width="2.5" marker-end="url(#head)"/><rect x="570" y="150" width="225" height="110" fill="#FFF1E6" stroke="#E8672A" stroke-width="2.5"/><text x="682.5" y="196.4" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1219" text-anchor="middle">bytecode</text><text x="682.5" y="224.3" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B5462" text-anchor="middle">.class files in a .jar</text><line x1="530" y1="205" x2="568" y2="205" stroke="#6B5462" stroke-width="2.5" marker-end="url(#head)"/><rect x="835" y="150" width="225" height="110" fill="#FFFFFF" stroke="#A61E6E" stroke-width="2.5"/><text x="947.5" y="196.4" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1219" text-anchor="middle">JVM</text><text x="947.5" y="224.3" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B5462" text-anchor="middle">runs the bytecode</text><line x1="795" y1="205" x2="833" y2="205" stroke="#6B5462" stroke-width="2.5" marker-end="url(#head)"/><text x="40" y="330" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1E1219" text-anchor="start">The JVM (Java Virtual Machine) is a program that runs bytecode on any computer that has it:</text><text x="40" y="362" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#6B5462" text-anchor="start">macOS, Windows, or Linux. You install it with a JDK (Java Development Kit).</text><text x="40" y="420" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#A61E6E" text-anchor="start">In the terminal:</text><text x="40" y="455" font-family="'Red Hat Mono', Menlo, monospace" font-size="19" font-weight="400" fill="#1E1219" text-anchor="start">kotlinc Welcome.kt -include-runtime -d welcome.jar</text><text x="40" y="488" font-family="'Red Hat Mono', Menlo, monospace" font-size="19" font-weight="400" fill="#1E1219" text-anchor="start">java -jar welcome.jar</text></svg>