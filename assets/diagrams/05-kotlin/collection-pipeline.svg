<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-label="A collection pipeline"><title>A collection pipeline</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#6B5462"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#6B5462"/></marker></defs><rect width="1100" height="530" fill="#FFFFFF"/><text x="40" y="52" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1E1219" text-anchor="start">A collection pipeline</text><text x="40" y="84" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B5462" text-anchor="start">filter, then map, then sum: small steps, each with one job</text><rect x="20" y="170" width="240" height="170" fill="#FCF1F6" stroke="#A61E6E" stroke-width="2.5"/><text x="140" y="215" font-family="'Red Hat Mono', Menlo, monospace" font-size="20" font-weight="700" fill="#A61E6E" text-anchor="middle">prices</text><text x="140" y="270" font-family="'Red Hat Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#1E1219" text-anchor="middle">[6000, 6500,</text><text x="140" y="300" font-family="'Red Hat Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#1E1219" text-anchor="middle">4500, 4000]</text><rect x="290" y="170" width="240" height="170" fill="#FFFFFF" stroke="#A61E6E" stroke-width="2.5"/><text x="410" y="215" font-family="'Red Hat Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#A61E6E" text-anchor="middle">filter { it &gt;= 4500 }</text><text x="410" y="270" font-family="'Red Hat Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#1E1219" text-anchor="middle">[6000, 6500,</text><text x="410" y="300" font-family="'Red Hat Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#1E1219" text-anchor="middle">4500]</text><line x1="262" y1="255" x2="288" y2="255" stroke="#6B5462" stroke-width="2.5" marker-end="url(#head)"/><rect x="560" y="170" width="240" height="170" fill="#FFFFFF" stroke="#A61E6E" stroke-width="2.5"/><text x="680" y="215" font-family="'Red Hat Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#A61E6E" text-anchor="middle">map { it + it / 10 }</text><text x="680" y="270" font-family="'Red Hat Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#1E1219" text-anchor="middle">[6600, 7150,</text><text x="680" y="300" font-family="'Red Hat Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#1E1219" text-anchor="middle">4950]</text><line x1="532" y1="255" x2="558" y2="255" stroke="#6B5462" stroke-width="2.5" marker-end="url(#head)"/><rect x="830" y="170" width="240" height="170" fill="#FFF1E6" stroke="#E8672A" stroke-width="2.5"/><text x="950" y="215" font-family="'Red Hat Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#E8672A" text-anchor="middle">sum()</text><text x="950" y="270" font-family="'Red Hat Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#1E1219" text-anchor="middle">18700</text><text x="950" y="300" font-family="'Red Hat Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#1E1219" text-anchor="middle"></text><line x1="802" y1="255" x2="828" y2="255" stroke="#6B5462" stroke-width="2.5" marker-end="url(#head)"/><text x="140" y="375" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6B5462" text-anchor="middle">a list of 4</text><text x="410" y="375" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6B5462" text-anchor="middle">keeps 3: drops 4000</text><text x="680" y="375" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6B5462" text-anchor="middle">adds tax to each</text><text x="950" y="375" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6B5462" text-anchor="middle">one number</text><text x="550" y="450" font-family="'Red Hat Mono', Menlo, monospace" font-size="20" font-weight="700" fill="#1E1219" text-anchor="middle">prices.filter { it &gt;= 4500 }.map { it + it / 10 }.sum()</text><text x="550" y="490" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B5462" text-anchor="middle">Each step makes a new list and hands it on; nothing changes the original prices.</text></svg>