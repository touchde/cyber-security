<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-label="A coroutine suspends and resumes"><title>A coroutine suspends and resumes</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#6B5462"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#6B5462"/></marker></defs><rect width="1100" height="600" fill="#FFFFFF"/><text x="40" y="52" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1E1219" text-anchor="start">A coroutine suspends and resumes</text><text x="40" y="84" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B5462" text-anchor="start">Three questions on one thread: the waits overlap, so all three finish in about one second</text><text x="40" y="150" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#6B5462" text-anchor="start">one thread</text><rect x="40" y="165" width="1020" height="4" fill="#F0D6E3" stroke="#F0D6E3" stroke-width="0"/><text x="40" y="470" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6B5462" text-anchor="start">time</text><line x1="90" y1="465" x2="1060" y2="465" stroke="#6B5462" stroke-width="2.5" marker-end="url(#head)"/><text x="110" y="495" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6B5462" text-anchor="middle">0 s</text><text x="980" y="495" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6B5462" text-anchor="middle">1 s</text><text x="40" y="242" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1E1219" text-anchor="start">milk</text><text x="40" y="322" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1E1219" text-anchor="start">beans</text><text x="40" y="402" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1E1219" text-anchor="start">cups</text><rect x="120" y="210" width="150" height="50" fill="#FCF1F6" stroke="#A61E6E" stroke-width="2.5"/><text x="195.0" y="242" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1E1219" text-anchor="middle">ask</text><rect x="280" y="290" width="150" height="50" fill="#FFFFFF" stroke="#A61E6E" stroke-width="2.5"/><text x="355.0" y="322" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1E1219" text-anchor="middle">ask</text><rect x="440" y="370" width="150" height="50" fill="#FFF1E6" stroke="#E8672A" stroke-width="2.5"/><text x="515.0" y="402" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1E1219" text-anchor="middle">ask</text><rect x="600" y="210" width="140" height="50" fill="#FCF1F6" stroke="#A61E6E" stroke-width="2.5"/><text x="670.0" y="242" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1E1219" text-anchor="middle">answer</text><rect x="750" y="290" width="140" height="50" fill="#FFFFFF" stroke="#A61E6E" stroke-width="2.5"/><text x="820.0" y="322" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1E1219" text-anchor="middle">answer</text><rect x="900" y="370" width="140" height="50" fill="#FFF1E6" stroke="#E8672A" stroke-width="2.5"/><text x="970.0" y="402" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1E1219" text-anchor="middle">answer</text><rect x="270" y="232" width="330" height="6" fill="#F0D6E3" stroke="#F0D6E3" stroke-width="0"/><text x="435.0" y="224" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6B5462" text-anchor="middle">suspended</text><rect x="430" y="312" width="320" height="6" fill="#F0D6E3" stroke="#F0D6E3" stroke-width="0"/><text x="590.0" y="304" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6B5462" text-anchor="middle">suspended</text><rect x="590" y="392" width="310" height="6" fill="#F0D6E3" stroke="#F0D6E3" stroke-width="0"/><text x="745.0" y="384" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6B5462" text-anchor="middle">suspended</text><text x="550" y="545" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1E1219" text-anchor="middle">delay(1000) suspends: the coroutine waits without holding the thread,</text><text x="550" y="575" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B5462" text-anchor="middle">so the thread runs the other coroutines. Each resumes when its answer is due.</text></svg>