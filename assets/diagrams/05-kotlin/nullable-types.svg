<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-label="Nullable and non-null types"><title>Nullable and non-null types</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#6B5462"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#6B5462"/></marker></defs><rect width="1100" height="570" fill="#FFFFFF"/><text x="40" y="52" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1E1219" text-anchor="start">Nullable and non-null types</text><text x="40" y="84" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B5462" text-anchor="start">A ? after the type lets the value be null; the compiler then asks you to handle it</text><rect x="40" y="120" width="470" height="230" fill="#FFFFFF" stroke="#A61E6E" stroke-width="2.5"/><text x="275" y="160" font-family="'Red Hat Mono', Menlo, monospace" font-size="24" font-weight="700" fill="#A61E6E" text-anchor="middle">String</text><text x="275" y="192" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B5462" text-anchor="middle">always holds text</text><rect x="90" y="225" width="170" height="70" fill="#FCF1F6" stroke="#A61E6E" stroke-width="2.5"/><text x="175.0" y="268.05" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1219" text-anchor="middle">&quot;Latte&quot;</text><rect x="290" y="225" width="170" height="70" fill="#FCF1F6" stroke="#A61E6E" stroke-width="2.5"/><text x="375.0" y="268.05" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1219" text-anchor="middle">&quot;less ice&quot;</text><rect x="590" y="120" width="470" height="230" fill="#FFFFFF" stroke="#E8672A" stroke-width="2.5"/><text x="825" y="160" font-family="'Red Hat Mono', Menlo, monospace" font-size="24" font-weight="700" fill="#E8672A" text-anchor="middle">String?</text><text x="825" y="192" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B5462" text-anchor="middle">text, or null: no value at all</text><rect x="620" y="225" width="130" height="70" fill="#FCF1F6" stroke="#A61E6E" stroke-width="2.5"/><text x="685.0" y="268.05" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1219" text-anchor="middle">&quot;Latte&quot;</text><rect x="760" y="225" width="130" height="70" fill="#FCF1F6" stroke="#A61E6E" stroke-width="2.5"/><text x="825.0" y="267.35" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#1E1219" text-anchor="middle">&quot;less ice&quot;</text><rect x="900" y="225" width="130" height="70" fill="#FFF1E6" stroke="#E8672A" stroke-width="2.5"/><text x="965.0" y="268.05" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1E1219" text-anchor="middle">null</text><rect x="40" y="400" width="310" height="130" fill="#FFFFFF" stroke="#F0D6E3" stroke-width="2.5"/><text x="195" y="440" font-family="'Red Hat Mono', Menlo, monospace" font-size="20" font-weight="700" fill="#1E1219" text-anchor="middle">note?.length</text><text x="195" y="475" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6B5462" text-anchor="middle">call only if not null;</text><text x="195" y="500" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6B5462" text-anchor="middle">otherwise the result is null</text><rect x="395" y="400" width="310" height="130" fill="#FFFFFF" stroke="#F0D6E3" stroke-width="2.5"/><text x="550" y="440" font-family="'Red Hat Mono', Menlo, monospace" font-size="20" font-weight="700" fill="#1E1219" text-anchor="middle">note ?: &quot;no note&quot;</text><text x="550" y="475" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6B5462" text-anchor="middle">use a default</text><text x="550" y="500" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6B5462" text-anchor="middle">when the value is null</text><rect x="750" y="400" width="310" height="130" fill="#FFF1E6" stroke="#E8672A" stroke-width="2.5"/><text x="905" y="440" font-family="'Red Hat Mono', Menlo, monospace" font-size="20" font-weight="700" fill="#1E1219" text-anchor="middle">note!!.length</text><text x="905" y="475" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6B5462" text-anchor="middle">promise it is not null;</text><text x="905" y="500" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#6B5462" text-anchor="middle">crashes if it is</text></svg>