<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-label="Classes and objects"><title>Classes and objects</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#6B5462"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#6B5462"/></marker></defs><rect width="1100" height="650" fill="#FFFFFF"/><text x="40" y="52" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1E1219" text-anchor="start">Classes and objects</text><text x="40" y="84" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B5462" text-anchor="start">A class describes what every drink has; each object is one real drink</text><rect x="40" y="205" width="340" height="280" fill="#FCF1F6" stroke="#A61E6E" stroke-width="2.5"/><text x="210" y="250" font-family="'Red Hat Mono', Menlo, monospace" font-size="24" font-weight="700" fill="#A61E6E" text-anchor="middle">class Drink</text><text x="210" y="280" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B5462" text-anchor="middle">the blueprint</text><text x="80" y="340" font-family="'Red Hat Mono', Menlo, monospace" font-size="19" font-weight="400" fill="#1E1219" text-anchor="start">name: String</text><text x="80" y="375" font-family="'Red Hat Mono', Menlo, monospace" font-size="19" font-weight="400" fill="#1E1219" text-anchor="start">price: Int</text><text x="80" y="410" font-family="'Red Hat Mono', Menlo, monospace" font-size="19" font-weight="400" fill="#1E1219" text-anchor="start">describe()</text><text x="80" y="455" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6B5462" text-anchor="start">properties and functions</text><rect x="600" y="140" width="460" height="120" fill="#FFF1E6" stroke="#E8672A" stroke-width="2.5"/><text x="630" y="180" font-family="'Red Hat Mono', Menlo, monospace" font-size="18" font-weight="700" fill="#1E1219" text-anchor="start">val latte = Drink(&quot;Latte&quot;, 6000)</text><text x="630" y="215" font-family="'Red Hat Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#6B5462" text-anchor="start">name = &quot;Latte&quot;</text><text x="630" y="242" font-family="'Red Hat Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#6B5462" text-anchor="start">price = 6000</text><line x1="382" y1="345" x2="596" y2="200" stroke="#6B5462" stroke-width="2.5" marker-end="url(#head)"/><rect x="600" y="285" width="460" height="120" fill="#FFFFFF" stroke="#E8672A" stroke-width="2.5"/><text x="630" y="325" font-family="'Red Hat Mono', Menlo, monospace" font-size="18" font-weight="700" fill="#1E1219" text-anchor="start">val mocha = Drink(&quot;Mocha&quot;, 6500)</text><text x="630" y="360" font-family="'Red Hat Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#6B5462" text-anchor="start">name = &quot;Mocha&quot;</text><text x="630" y="387" font-family="'Red Hat Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#6B5462" text-anchor="start">price = 6500</text><line x1="382" y1="345" x2="596" y2="345" stroke="#6B5462" stroke-width="2.5" marker-end="url(#head)"/><rect x="600" y="430" width="460" height="120" fill="#FFFFFF" stroke="#E8672A" stroke-width="2.5"/><text x="630" y="470" font-family="'Red Hat Mono', Menlo, monospace" font-size="18" font-weight="700" fill="#1E1219" text-anchor="start">val tea = Drink(&quot;Green tea&quot;, 4500)</text><text x="630" y="505" font-family="'Red Hat Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#6B5462" text-anchor="start">name = &quot;Green tea&quot;</text><text x="630" y="532" font-family="'Red Hat Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#6B5462" text-anchor="start">price = 4500</text><line x1="382" y1="345" x2="596" y2="490" stroke="#6B5462" stroke-width="2.5" marker-end="url(#head)"/><text x="550" y="615" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1E1219" text-anchor="middle">One class, many objects: each object has its own values, and all share the same functions.</text></svg>