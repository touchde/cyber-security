<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-label="Contrast you can measure"><title>Contrast you can measure</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#3D4350"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#3D4350"/></marker></defs><rect width="1100" height="510" fill="#FFFFFF"/><text x="40" y="52" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#111111" text-anchor="start">Contrast you can measure</text><text x="40" y="84" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#3D4350" text-anchor="start">The same text in three colors, with its contrast ratio</text><rect x="40" y="140" width="320" height="170" fill="#FFF8EC" stroke="#111111" stroke-width="2"/><text x="200" y="215" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#C8A27A" text-anchor="middle">Iced latte</text><text x="200" y="265" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#C8A27A" text-anchor="middle">6000 riel</text><text x="200" y="345" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Light brown on cream</text><text x="200" y="375" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">2.2 to 1</text><text x="200" y="405" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#B00020" text-anchor="middle">fails: too faint</text><rect x="385" y="140" width="320" height="170" fill="#FFF8EC" stroke="#111111" stroke-width="2"/><text x="545" y="215" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#5D3A1A" text-anchor="middle">Iced latte</text><text x="545" y="265" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#5D3A1A" text-anchor="middle">6000 riel</text><text x="545" y="345" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Dark brown on cream</text><text x="545" y="375" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">9.5 to 1</text><text x="545" y="405" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1A4FD6" text-anchor="middle">passes (4.5 to 1 or more)</text><rect x="730" y="140" width="320" height="170" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="890" y="215" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#000000" text-anchor="middle">Iced latte</text><text x="890" y="265" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#000000" text-anchor="middle">6000 riel</text><text x="890" y="345" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#111111" text-anchor="middle">Black on white</text><text x="890" y="375" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">21 to 1</text><text x="890" y="405" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1A4FD6" text-anchor="middle">passes (4.5 to 1 or more)</text><text x="40" y="470" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#111111" text-anchor="start">WCAG asks for at least 4.5 to 1 for normal text, and 3 to 1 for large text.</text></svg>