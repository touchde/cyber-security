<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-label="Text kept out of the code"><title>Text kept out of the code</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#3D4350"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#3D4350"/></marker></defs><rect width="1100" height="460" fill="#FFFFFF"/><text x="40" y="52" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#111111" text-anchor="start">Text kept out of the code</text><text x="40" y="84" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#3D4350" text-anchor="start">One key, a message in each language</text><rect x="40" y="150" width="300" height="110" fill="#FFFFFF" stroke="#1A4FD6" stroke-width="2.5"/><text x="190.0" y="196.4" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111111" text-anchor="middle">Code</text><text x="190.0" y="224.3" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#3D4350" text-anchor="middle">message(&#x27;km&#x27;, &#x27;welcome&#x27;)</text><rect x="420" y="120" width="300" height="80" fill="#EEF3FF" stroke="#1A4FD6" stroke-width="2.5"/><text x="570.0" y="151.4" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111111" text-anchor="middle">English messages</text><text x="570.0" y="179.3" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#3D4350" text-anchor="middle">welcome → Welcome to...</text><rect x="420" y="220" width="300" height="80" fill="#EEF3FF" stroke="#1A4FD6" stroke-width="2.5"/><text x="570.0" y="251.4" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111111" text-anchor="middle">Khmer messages</text><text x="570.0" y="279.3" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#3D4350" text-anchor="middle">welcome → សូមស្វាគមន៍...</text><rect x="800" y="150" width="260" height="110" fill="#FFFFFF" stroke="#1A4FD6" stroke-width="2.5"/><text x="930.0" y="196.4" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111111" text-anchor="middle">Screen</text><text x="930.0" y="224.3" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#3D4350" text-anchor="middle">the right language</text><line x1="340" y1="205" x2="418" y2="160" stroke="#3D4350" stroke-width="2.5" marker-end="url(#head)"/><line x1="340" y1="205" x2="418" y2="260" stroke="#3D4350" stroke-width="2.5" marker-end="url(#head)"/><line x1="720" y1="205" x2="798" y2="205" stroke="#3D4350" stroke-width="2.5" marker-end="url(#head)"/><text x="40" y="360" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#111111" text-anchor="start">The code asks for a key. The message table for the user&#x27;s language gives the words.</text><text x="40" y="392" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#3D4350" text-anchor="start">A missing Khmer message falls back to English, instead of showing nothing.</text><text x="40" y="424" font-family="'Atkinson Hyperlegible Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#3D4350" text-anchor="start">Translators edit the tables, never the code.</text></svg>