<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="Flutter layout: constraints down, sizes up, parent sets position"><title>Flutter layout: constraints down, sizes up, parent sets position</title><defs><marker id="arrow-2353C9" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#2353C9"/></marker><marker id="arrow-55607A" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#55607A"/></marker><marker id="arrow-C26A00" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#C26A00"/></marker></defs><rect width="1100" height="560" fill="#FFFFFF"/><text x="40" y="52" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="28" font-weight="700" fill="#14213D" text-anchor="start">How Flutter layout works</text><text x="40" y="82" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start">Constraints go down. Sizes go up. Parents set positions.</text><rect x="80" y="130" width="940" height="380" fill="#EAF0FD" stroke="#2353C9" stroke-width="2"/><text x="110" y="170" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#14213D" text-anchor="start">Parent</text><text x="110" y="196" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="start">e.g. Center inside a 400 × 800 screen</text><rect x="640" y="300" width="260" height="120" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="770.0" y="356.0" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#14213D" text-anchor="middle">Child</text><text x="770.0" y="380.0" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle">chooses 120 × 48</text><line x1="380" y1="300" x2="630" y2="330" stroke="#2353C9" stroke-width="2.5" marker-end="url(#arrow-2353C9)"/><text x="370.0" y="254.0" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="600" fill="#2353C9" text-anchor="start">① Constraints go down</text><text x="370" y="278" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="start">min 0 × 0, max 400 × 800</text><line x1="630" y1="400" x2="380" y2="430" stroke="#C26A00" stroke-width="2.5" marker-end="url(#arrow-C26A00)"/><text x="380.0" y="464.0" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="600" fill="#C26A00" text-anchor="start">② Size goes up</text><text x="380" y="486" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="start">“I&#x27;m 120 × 48”</text><path d="M900 250 C 960 250, 960 290, 905 300" fill="none" stroke="#55607A" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-55607A)"/><text x="870" y="236" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="600" fill="#55607A" text-anchor="middle">③ Parent sets position</text></svg>
