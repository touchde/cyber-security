<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="One codebase, many platforms"><title>One codebase, many platforms</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5D5A78"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5D5A78"/></marker></defs><rect width="1100" height="560" fill="#FFFFFF"/><text x="40" y="52" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1A1830" text-anchor="start">One codebase, many platforms</text><text x="40" y="84" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5D5A78" text-anchor="start">The same Dart code becomes an app for each system</text><rect x="60" y="230" width="230" height="120" fill="#F2F0FE" stroke="#4B3FCF" stroke-width="2.5"/><text x="175.0" y="281.4" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1A1830" text-anchor="middle">lib/main.dart</text><text x="175.0" y="309.3" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5D5A78" text-anchor="middle">one Dart codebase</text><rect x="390" y="230" width="230" height="120" fill="#FFFFFF" stroke="#4B3FCF" stroke-width="2.5"/><text x="505.0" y="281.4" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1A1830" text-anchor="middle">flutter build</text><text x="505.0" y="309.3" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5D5A78" text-anchor="middle">one command per target</text><line x1="290" y1="290" x2="388" y2="290" stroke="#5D5A78" stroke-width="2.5" marker-end="url(#head)"/><rect x="720" y="120" width="330" height="85" fill="#E3F5FD" stroke="#0A8FC7" stroke-width="2.5"/><text x="885.0" y="153.9" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1A1830" text-anchor="middle">Android</text><text x="885.0" y="181.8" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5D5A78" text-anchor="middle">APK or app bundle</text><line x1="620" y1="290" x2="718" y2="162" stroke="#5D5A78" stroke-width="2.5" marker-end="url(#head)"/><rect x="720" y="225" width="330" height="85" fill="#FFFFFF" stroke="#0A8FC7" stroke-width="2.5"/><text x="885.0" y="258.9" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1A1830" text-anchor="middle">iOS</text><text x="885.0" y="286.8" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5D5A78" text-anchor="middle">an app for the App Store</text><line x1="620" y1="290" x2="718" y2="267" stroke="#5D5A78" stroke-width="2.5" marker-end="url(#head)"/><rect x="720" y="330" width="330" height="85" fill="#E3F5FD" stroke="#0A8FC7" stroke-width="2.5"/><text x="885.0" y="363.9" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1A1830" text-anchor="middle">Web</text><text x="885.0" y="391.8" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5D5A78" text-anchor="middle">HTML and JavaScript</text><line x1="620" y1="290" x2="718" y2="372" stroke="#5D5A78" stroke-width="2.5" marker-end="url(#head)"/><rect x="720" y="435" width="330" height="85" fill="#FFFFFF" stroke="#0A8FC7" stroke-width="2.5"/><text x="885.0" y="468.9" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1A1830" text-anchor="middle">macOS, Windows, Linux</text><text x="885.0" y="496.8" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5D5A78" text-anchor="middle">a desktop app</text><line x1="620" y1="290" x2="718" y2="477" stroke="#5D5A78" stroke-width="2.5" marker-end="url(#head)"/><text x="60" y="470" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1830" text-anchor="start">The same widgets on every target,</text><text x="60" y="498" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5D5A78" text-anchor="start">so the app looks the same everywhere.</text></svg>