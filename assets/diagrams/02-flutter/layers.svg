<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-label="How Flutter is built"><title>How Flutter is built</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5D5A78"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5D5A78"/></marker></defs><rect width="1100" height="600" fill="#FFFFFF"/><text x="40" y="52" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1A1830" text-anchor="start">How Flutter is built</text><text x="40" y="84" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5D5A78" text-anchor="start">Four layers, from the code you write down to the device</text><rect x="80" y="120" width="640" height="88" fill="#FFFFFF" stroke="#4B3FCF" stroke-width="2.5"/><text x="110" y="160" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1830" text-anchor="start">Your app</text><text x="110" y="188" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5D5A78" text-anchor="start">the Mina Coffee code, in Dart</text><rect x="80" y="225" width="640" height="88" fill="#F2F0FE" stroke="#4B3FCF" stroke-width="2.5"/><text x="110" y="265" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1830" text-anchor="start">Framework</text><text x="110" y="293" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5D5A78" text-anchor="start">widgets, Material, layout, and painting, in Dart</text><rect x="80" y="330" width="640" height="88" fill="#E3F5FD" stroke="#0A8FC7" stroke-width="2.5"/><text x="110" y="370" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1830" text-anchor="start">Engine</text><text x="110" y="398" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5D5A78" text-anchor="start">draws every pixel, runs Dart; written in C++</text><rect x="80" y="435" width="640" height="88" fill="#FFFFFF" stroke="#5D5A78" stroke-width="2.5"/><text x="110" y="475" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1830" text-anchor="start">Embedder</text><text x="110" y="503" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5D5A78" text-anchor="start">the window, touch, and keyboard of each system</text><text x="770" y="165" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#4B3FCF" text-anchor="start">You write this</text><text x="770" y="190" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5D5A78" text-anchor="start">every day</text><text x="770" y="270" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#4B3FCF" text-anchor="start">Open source, in Dart:</text><text x="770" y="295" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5D5A78" text-anchor="start">you can read all of it</text><text x="770" y="375" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#0A8FC7" text-anchor="start">Comes with Flutter</text><text x="770" y="400" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5D5A78" text-anchor="start">inside every app</text><text x="770" y="480" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1830" text-anchor="start">One for each system:</text><text x="770" y="505" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5D5A78" text-anchor="start">Android, iOS, web, desktop</text><text x="400" y="572" font-family="'Figtree', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1830" text-anchor="middle">The screen is a canvas. Flutter paints the buttons and text itself.</text></svg>