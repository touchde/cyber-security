<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-label="Types stop at the edge"><title>Types stop at the edge</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#4F5D70"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#4F5D70"/></marker></defs><rect width="1100" height="510" fill="#FFFFFF"/><text x="40" y="52" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#111A26" text-anchor="start">Types stop at the edge</text><text x="40" y="84" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="start">What TypeScript can check, and what it cannot</text><rect x="330" y="130" width="440" height="270" fill="#E6F0FB" stroke="#235A97" stroke-width="2.5"/><text x="550" y="170" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#235A97" text-anchor="middle">Your program</text><text x="550" y="205" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#4F5D70" text-anchor="middle">TypeScript checks this code</text><rect x="370" y="230" width="360" height="70" fill="#FFFFFF" stroke="#235A97" stroke-width="2.5"/><text x="550.0" y="273.05" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">total(price: number)</text><rect x="370" y="315" width="360" height="60" fill="#FFFFFF" stroke="#235A97" stroke-width="2.5"/><text x="550.0" y="353.05" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">receipt(order: Order)</text><rect x="40" y="100" width="220" height="80" fill="#FFFFFF" stroke="#235A97" stroke-width="2.5"/><text x="150.0" y="131.4" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">Server</text><text x="150.0" y="159.3" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">JSON over the network</text><line x1="262" y1="140" x2="328" y2="140" stroke="#4F5D70" stroke-width="2.5" marker-end="url(#head)"/><rect x="40" y="230" width="220" height="80" fill="#FFFFFF" stroke="#235A97" stroke-width="2.5"/><text x="150.0" y="261.4" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">Keyboard</text><text x="150.0" y="289.3" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">what a person types</text><line x1="262" y1="270" x2="328" y2="270" stroke="#4F5D70" stroke-width="2.5" marker-end="url(#head)"/><rect x="40" y="360" width="220" height="80" fill="#FFFFFF" stroke="#235A97" stroke-width="2.5"/><text x="150.0" y="391.4" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">Files</text><text x="150.0" y="419.3" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">data saved earlier</text><line x1="262" y1="400" x2="328" y2="400" stroke="#4F5D70" stroke-width="2.5" marker-end="url(#head)"/><rect x="820" y="190" width="240" height="150" fill="#FCE8E6" stroke="#B3261E" stroke-width="2.5"/><text x="940" y="225" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#B3261E" text-anchor="middle">Not checked</text><text x="940" y="255" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#B3261E" text-anchor="middle">Data from outside</text><text x="940" y="278" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#B3261E" text-anchor="middle">can be anything:</text><text x="940" y="308" font-family="'Spline Sans Mono', Menlo, monospace" font-size="16" font-weight="600" fill="#B3261E" text-anchor="middle">&quot;6000&quot; instead of 6000</text><text x="40" y="470" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#111A26" text-anchor="start">Types stop at the edge of your program. Data that comes in must be checked while the program runs.</text></svg>