<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-label="When is the mistake found?"><title>When is the mistake found?</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#4F5D70"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#4F5D70"/></marker></defs><rect width="1100" height="470" fill="#FFFFFF"/><text x="40" y="52" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#111A26" text-anchor="start">When is the mistake found?</text><text x="40" y="84" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="start">The same mistake, in JavaScript and in TypeScript</text><rect x="40" y="130" width="222" height="96" fill="#FFFFFF" stroke="#235A97" stroke-width="2.5"/><text x="151.0" y="169.4" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">Write</text><text x="151.0" y="197.3" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">you type the code</text><rect x="302" y="130" width="222" height="96" fill="#E6F0FB" stroke="#235A97" stroke-width="2.5"/><text x="413.0" y="169.4" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">Check</text><text x="413.0" y="197.3" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">the editor and tsc</text><line x1="264" y1="178" x2="300" y2="178" stroke="#4F5D70" stroke-width="2.5" marker-end="url(#head)"/><rect x="564" y="130" width="222" height="96" fill="#FFFFFF" stroke="#235A97" stroke-width="2.5"/><text x="675.0" y="169.4" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">Run</text><text x="675.0" y="197.3" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">on your computer</text><line x1="526" y1="178" x2="562" y2="178" stroke="#4F5D70" stroke-width="2.5" marker-end="url(#head)"/><rect x="826" y="130" width="222" height="96" fill="#FFFFFF" stroke="#235A97" stroke-width="2.5"/><text x="937.0" y="169.4" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">Customer</text><text x="937.0" y="197.3" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">Friday night, at the shop</text><line x1="788" y1="178" x2="824" y2="178" stroke="#4F5D70" stroke-width="2.5" marker-end="url(#head)"/><rect x="826" y="270" width="222" height="70" fill="#FCE8E6" stroke="#B3261E" stroke-width="2.5"/><text x="937" y="300" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#B3261E" text-anchor="middle">JavaScript finds it here</text><text x="937" y="325" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#B3261E" text-anchor="middle">the total is 6000500</text><rect x="302" y="270" width="222" height="70" fill="#E3F5EC" stroke="#1B7A44" stroke-width="2.5"/><text x="413" y="300" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1B7A44" text-anchor="middle">TypeScript finds it here</text><text x="413" y="325" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#1B7A44" text-anchor="middle">a red line under the mistake</text><line x1="413" y1="268" x2="413" y2="230" stroke="#4F5D70" stroke-width="2.5" marker-end="url(#head)"/><line x1="937" y1="268" x2="937" y2="230" stroke="#4F5D70" stroke-width="2.5" marker-end="url(#head)"/><text x="40" y="400" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#111A26" text-anchor="start">The earlier a mistake is found, the cheaper it is to fix: a red line in the editor costs seconds;</text><text x="40" y="430" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#4F5D70" text-anchor="start">a wrong total at the counter costs money, time, and a customer&#x27;s trust.</text></svg>