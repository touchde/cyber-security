<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="Variance"><title>Variance</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#4F5D70"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#4F5D70"/></marker></defs><rect width="1100" height="560" fill="#FFFFFF"/><text x="40" y="52" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#111A26" text-anchor="start">Variance</text><text x="40" y="84" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="start">Which way can a generic type be replaced?</text><rect x="40" y="120" width="240" height="80" fill="#FFFFFF" stroke="#235A97" stroke-width="2.5"/><text x="160.0" y="151.4" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">Latte</text><text x="160.0" y="179.3" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">has name and milk</text><line x1="282" y1="160" x2="398" y2="160" stroke="#4F5D70" stroke-width="2.5" marker-end="url(#head)"/><rect x="400" y="120" width="240" height="80" fill="#FFFFFF" stroke="#235A97" stroke-width="2.5"/><text x="520.0" y="151.4" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">Drink</text><text x="520.0" y="179.3" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">has name</text><text x="700" y="152" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#4F5D70" text-anchor="start">A Latte can be used</text><text x="700" y="176" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#4F5D70" text-anchor="start">where a Drink is expected.</text><rect x="40" y="250" width="240" height="80" fill="#E3F5EC" stroke="#1B7A44" stroke-width="2.5"/><text x="160.0" y="281.4" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">Producer&lt;Latte&gt;</text><text x="160.0" y="309.3" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">() =&gt; Latte</text><line x1="282" y1="290" x2="398" y2="290" stroke="#4F5D70" stroke-width="2.5" marker-end="url(#head)"/><rect x="400" y="250" width="240" height="80" fill="#E3F5EC" stroke="#1B7A44" stroke-width="2.5"/><text x="520.0" y="281.4" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">Producer&lt;Drink&gt;</text><text x="520.0" y="309.3" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">() =&gt; Drink</text><text x="700" y="282" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1B7A44" text-anchor="start">Covariant: same direction.</text><text x="700" y="306" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#4F5D70" text-anchor="start">It gives out lattes, which are drinks.</text><rect x="40" y="380" width="240" height="80" fill="#E3F5EC" stroke="#1B7A44" stroke-width="2.5"/><text x="160.0" y="411.4" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">Consumer&lt;Drink&gt;</text><text x="160.0" y="439.3" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">(d: Drink) =&gt; void</text><line x1="282" y1="420" x2="398" y2="420" stroke="#4F5D70" stroke-width="2.5" marker-end="url(#head)"/><rect x="400" y="380" width="240" height="80" fill="#E3F5EC" stroke="#1B7A44" stroke-width="2.5"/><text x="520.0" y="411.4" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">Consumer&lt;Latte&gt;</text><text x="520.0" y="439.3" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">(l: Latte) =&gt; void</text><text x="700" y="412" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1B7A44" text-anchor="start">Contravariant: direction flips.</text><text x="700" y="436" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#4F5D70" text-anchor="start">It accepts any drink, so lattes too.</text><text x="40" y="520" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#111A26" text-anchor="start">Each arrow means: the left side can be used where the right side is expected.</text></svg>