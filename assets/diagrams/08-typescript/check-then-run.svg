<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="Check, then the types disappear"><title>Check, then the types disappear</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#4F5D70"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#4F5D70"/></marker></defs><rect width="1000" height="520" fill="#FFFFFF"/><text x="40" y="52" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#111A26" text-anchor="start">Check, then the types disappear</text><text x="40" y="84" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="start">What happens to TypeScript code before it runs</text><rect x="40" y="140" width="250" height="110" fill="#E6F0FB" stroke="#235A97" stroke-width="2.5"/><text x="165.0" y="186.4" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">order.ts</text><text x="165.0" y="214.3" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">TypeScript: code + types</text><rect x="345" y="140" width="250" height="110" fill="#FFFFFF" stroke="#235A97" stroke-width="2.5"/><text x="470.0" y="186.4" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">Check</text><text x="470.0" y="214.3" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">tsc or the editor</text><rect x="650" y="140" width="250" height="110" fill="#FFFFFF" stroke="#235A97" stroke-width="2.5"/><text x="775.0" y="186.4" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">Remove types</text><text x="775.0" y="214.3" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">tsc, Node.js, or a bundler</text><line x1="292" y1="195" x2="343" y2="195" stroke="#4F5D70" stroke-width="2.5" marker-end="url(#head)"/><line x1="597" y1="195" x2="648" y2="195" stroke="#4F5D70" stroke-width="2.5" marker-end="url(#head)"/><rect x="40" y="300" width="250" height="120" fill="#FFFFFF" stroke="#CFDDF0" stroke-width="2.5"/><text x="55" y="335" font-family="'Spline Sans Mono', Menlo, monospace" font-size="19" font-weight="600" fill="#235A97" text-anchor="start">price: number</text><text x="55" y="365" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#4F5D70" text-anchor="start">→ checked, then</text><text x="55" y="395" font-family="'Spline Sans Mono', Menlo, monospace" font-size="19" font-weight="600" fill="#111A26" text-anchor="start">price</text><rect x="650" y="300" width="250" height="120" fill="#E6F0FB" stroke="#235A97" stroke-width="2.5"/><text x="775.0" y="339.9" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">JavaScript</text><text x="775.0" y="367.8" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">runs in a browser,</text><text x="775.0" y="390.8" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">Node.js, or React Native</text><line x1="775" y1="252" x2="775" y2="298" stroke="#4F5D70" stroke-width="2.5" marker-end="url(#head)"/><rect x="345" y="300" width="250" height="120" fill="#FCE8E6" stroke="#B3261E" stroke-width="2.5"/><text x="470" y="345" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#B3261E" text-anchor="middle">A type error?</text><text x="470" y="375" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#B3261E" text-anchor="middle">You see it now,</text><text x="470" y="398" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#B3261E" text-anchor="middle">before the code runs.</text><line x1="470" y1="252" x2="470" y2="298" stroke="#4F5D70" stroke-width="2.5" marker-end="url(#head)"/><text x="40" y="480" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#111A26" text-anchor="start">Types exist only while you write and check the code. The program that runs has no types at all.</text></svg>