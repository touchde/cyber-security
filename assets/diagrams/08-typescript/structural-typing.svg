 x="515" y="417" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#B3261E" text-anchor="middle">does not fit: no price</text><text x="40" y="510" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#111A26" text-anchor="start">TypeScript compares shapes. Any value with a string name and a number price is a Drink.</text></svg>