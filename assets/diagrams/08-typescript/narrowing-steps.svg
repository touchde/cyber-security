<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-label="Narrowing"><title>Narrowing</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#4F5D70"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#4F5D70"/></marker></defs><rect width="1120" height="500" fill="#FFFFFF"/><text x="40" y="52" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#111A26" text-anchor="start">Narrowing</text><text x="40" y="84" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="start">How one check gives each branch a more exact type</text><rect x="40" y="200" width="270" height="100" fill="#E6F0FB" stroke="#235A97" stroke-width="2.5"/><text x="175.0" y="241.4" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">price</text><text x="175.0" y="269.3" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">number | string</text><line x1="312" y1="250" x2="378" y2="250" stroke="#4F5D70" stroke-width="2.5" marker-end="url(#head)"/><rect x="380" y="190" width="330" height="120" fill="#FFFFFF" stroke="#235A97" stroke-width="2.5"/><text x="545.0" y="241.4" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">if (typeof price</text><text x="545.0" y="269.3" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">=== &quot;number&quot;)</text><line x1="712" y1="225" x2="778" y2="165" stroke="#4F5D70" stroke-width="2.5" marker-end="url(#head)"/><line x1="712" y1="275" x2="778" y2="335" stroke="#4F5D70" stroke-width="2.5" marker-end="url(#head)"/><rect x="780" y="110" width="300" height="100" fill="#E3F5EC" stroke="#1B7A44" stroke-width="2.5"/><text x="930.0" y="151.4" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">true: number</text><text x="930.0" y="179.3" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">price.toFixed(0) is allowed</text><rect x="780" y="290" width="300" height="100" fill="#E3F5EC" stroke="#1B7A44" stroke-width="2.5"/><text x="930.0" y="331.4" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#111A26" text-anchor="middle">false: string</text><text x="930.0" y="359.3" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4F5D70" text-anchor="middle">price.trim() is allowed</text><text x="40" y="460" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#111A26" text-anchor="start">The declared type never changes. What the checker knows changes at each line, after each check.</text></svg>