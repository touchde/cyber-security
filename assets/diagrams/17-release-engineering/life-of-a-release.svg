<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-label="The life of a release"><title>The life of a release</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5B6170"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5B6170"/></marker></defs><rect width="1100" height="580" fill="#FFFFFF"/><text x="40" y="52" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#16202F" text-anchor="start">The life of a release</text><text x="40" y="84" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6170" text-anchor="start">From merged code to users&#x27; phones</text><rect x="40" y="130" width="300" height="100" fill="#F6F1E4" stroke="#1C3F73" stroke-width="2.5"/><text x="190.0" y="171.4" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16202F" text-anchor="middle">1. Code ready</text><text x="190.0" y="199.3" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6170" text-anchor="middle">merged, tests green</text><rect x="400" y="130" width="300" height="100" fill="#FFFFFF" stroke="#1C3F73" stroke-width="2.5"/><text x="550.0" y="171.4" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16202F" text-anchor="middle">2. Build</text><text x="550.0" y="199.3" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6170" text-anchor="middle">versioned, signed</text><line x1="342" y1="180.0" x2="398" y2="180.0" stroke="#5B6170" stroke-width="2.5" marker-end="url(#head)"/><rect x="760" y="130" width="300" height="100" fill="#FFFFFF" stroke="#1C3F73" stroke-width="2.5"/><text x="910.0" y="171.4" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16202F" text-anchor="middle">3. Test</text><text x="910.0" y="199.3" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6170" text-anchor="middle">team and beta testers</text><line x1="702" y1="180.0" x2="758" y2="180.0" stroke="#5B6170" stroke-width="2.5" marker-end="url(#head)"/><rect x="40" y="290" width="300" height="100" fill="#FFFFFF" stroke="#1C3F73" stroke-width="2.5"/><text x="190.0" y="331.4" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16202F" text-anchor="middle">4. Store review</text><text x="190.0" y="359.3" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6170" text-anchor="middle">Google and Apple</text><path d="M910.0,230 L910.0,260.0 L190.0,260.0 L190.0,288" fill="none" stroke="#5B6170" stroke-width="2.5" marker-end="url(#head)"/><rect x="400" y="290" width="300" height="100" fill="#FFFFFF" stroke="#1C3F73" stroke-width="2.5"/><text x="550.0" y="331.4" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16202F" text-anchor="middle">5. Rollout</text><text x="550.0" y="359.3" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6170" text-anchor="middle">1% → 100%</text><line x1="342" y1="340.0" x2="398" y2="340.0" stroke="#5B6170" stroke-width="2.5" marker-end="url(#head)"/><rect x="760" y="290" width="300" height="100" fill="#F6F1E4" stroke="#1C3F73" stroke-width="2.5"/><text x="910.0" y="331.4" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16202F" text-anchor="middle">6. Watch</text><text x="910.0" y="359.3" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6170" text-anchor="middle">crashes, ratings</text><line x1="702" y1="340.0" x2="758" y2="340.0" stroke="#5B6170" stroke-width="2.5" marker-end="url(#head)"/><text x="40" y="450" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#16202F" text-anchor="start">A broken build stopped at any step before Rollout reaches nobody.</text><text x="40" y="482" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6170" text-anchor="start">A broken build found during Rollout reaches only the users who already have it.</text><text x="40" y="535" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#C8102E" text-anchor="start">Once it is on a phone, the only fix is a new release.</text></svg>