<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-label="A staged rollout"><title>A staged rollout</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5B6170"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5B6170"/></marker></defs><rect width="1100" height="550" fill="#FFFFFF"/><text x="40" y="52" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#16202F" text-anchor="start">A staged rollout</text><text x="40" y="84" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6170" text-anchor="start">The ordering app&#x27;s 2000 active users, a few at a time</text><rect x="60" y="417" width="140" height="43" fill="#1C3F73" opacity="0.35"/><text x="130" y="490" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#16202F" text-anchor="middle">1%</text><text x="130" y="518" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6170" text-anchor="middle">about 20 users</text><rect x="260" y="405" width="140" height="55" fill="#1C3F73" opacity="0.5"/><text x="330" y="490" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#16202F" text-anchor="middle">5%</text><text x="330" y="518" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6170" text-anchor="middle">about 100 users</text><rect x="460" y="360" width="140" height="100" fill="#1C3F73" opacity="0.6499999999999999"/><text x="530" y="490" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#16202F" text-anchor="middle">20%</text><text x="530" y="518" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6170" text-anchor="middle">about 400 users</text><rect x="660" y="270" width="140" height="190" fill="#1C3F73" opacity="0.7999999999999999"/><text x="730" y="490" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#16202F" text-anchor="middle">50%</text><text x="730" y="518" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6170" text-anchor="middle">about 1000 users</text><rect x="860" y="120" width="140" height="340" fill="#C8102E" opacity="0.95"/><text x="930" y="490" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#16202F" text-anchor="middle">100%</text><text x="930" y="518" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6170" text-anchor="middle">about 2000 users</text><text x="60" y="140" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#16202F" text-anchor="start">Each step waits a day or more, and moves on only if crashes and ratings look normal.</text><text x="60" y="170" font-family="'Libre Franklin', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6170" text-anchor="start">A problem at 5% hurts about 100 people instead of 2000; the rollout is halted, and a fix follows.</text></svg>