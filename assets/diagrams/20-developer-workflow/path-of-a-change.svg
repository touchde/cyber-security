<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="525" viewBox="0 0 1100 525" role="img" aria-label="The path of a change"><title>The path of a change</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5C5670"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5C5670"/></marker></defs><rect width="1100" height="525" fill="#FFFFFF"/><text x="40" y="52" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1A1726" text-anchor="start">The path of a change</text><text x="40" y="84" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5C5670" text-anchor="start">From Vanna&#x27;s laptop to the team&#x27;s main branch</text><rect x="40" y="130" width="300" height="100" fill="#FFFFFF" stroke="#5B3FC4" stroke-width="2.5"/><text x="190.0" y="171.4" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1A1726" text-anchor="middle">1. Branch</text><text x="190.0" y="199.3" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5C5670" text-anchor="middle">fix/member-discount</text><rect x="400" y="130" width="300" height="100" fill="#FFFFFF" stroke="#5B3FC4" stroke-width="2.5"/><text x="550.0" y="171.4" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1A1726" text-anchor="middle">2. Commits</text><text x="550.0" y="199.3" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5C5670" text-anchor="middle">small, clear messages</text><line x1="342" y1="180.0" x2="398" y2="180.0" stroke="#5C5670" stroke-width="2.5" marker-end="url(#head)"/><rect x="760" y="130" width="300" height="100" fill="#F4F0FF" stroke="#5B3FC4" stroke-width="2.5"/><text x="910.0" y="171.4" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1A1726" text-anchor="middle">3. Pull request</text><text x="910.0" y="199.3" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5C5670" text-anchor="middle">describe the change</text><line x1="702" y1="180.0" x2="758" y2="180.0" stroke="#5C5670" stroke-width="2.5" marker-end="url(#head)"/><rect x="40" y="290" width="300" height="100" fill="#FFFFFF" stroke="#5B3FC4" stroke-width="2.5"/><text x="190.0" y="331.4" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1A1726" text-anchor="middle">4. Checks</text><text x="190.0" y="359.3" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5C5670" text-anchor="middle">format, analyze, test</text><path d="M910.0,230 L910.0,260.0 L190.0,260.0 L190.0,288" fill="none" stroke="#5C5670" stroke-width="2.5" marker-end="url(#head)"/><rect x="400" y="290" width="300" height="100" fill="#F4F0FF" stroke="#5B3FC4" stroke-width="2.5"/><text x="550.0" y="331.4" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1A1726" text-anchor="middle">5. Review</text><text x="550.0" y="359.3" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5C5670" text-anchor="middle">a teammate reads it</text><line x1="342" y1="340.0" x2="398" y2="340.0" stroke="#5C5670" stroke-width="2.5" marker-end="url(#head)"/><rect x="760" y="290" width="300" height="100" fill="#FFFFFF" stroke="#5B3FC4" stroke-width="2.5"/><text x="910.0" y="331.4" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1A1726" text-anchor="middle">6. Merge</text><text x="910.0" y="359.3" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5C5670" text-anchor="middle">into main</text><line x1="702" y1="340.0" x2="758" y2="340.0" stroke="#5C5670" stroke-width="2.5" marker-end="url(#head)"/><text x="40" y="450" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1726" text-anchor="start">Machines check what machines can check. People check what only people can see:</text><text x="40" y="482" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5C5670" text-anchor="start">is it the right change, is it clear, and will the next person understand it?</text></svg>