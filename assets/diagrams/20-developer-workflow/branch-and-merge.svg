<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-label="A branch and a merge"><title>A branch and a merge</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5C5670"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5C5670"/></marker></defs><rect width="1100" height="530" fill="#FFFFFF"/><text x="40" y="52" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1A1726" text-anchor="start">A branch and a merge</text><text x="40" y="84" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5C5670" text-anchor="start">Vanna&#x27;s fix, from her branch back into main</text><line x1="80" y1="330" x2="1020" y2="330" stroke="#5B3FC4" stroke-width="4"/><path d="M260,330 C300,230 340,220 400,220 L640,220 C700,220 740,300 780,330" fill="none" stroke="#D99A06" stroke-width="4"/><circle cx="140" cy="330" r="16" fill="#FFFFFF" stroke="#5B3FC4" stroke-width="4"/><text x="140" y="380" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1726" text-anchor="middle">docs: add a README</text><circle cx="780" cy="330" r="16" fill="#FFFFFF" stroke="#5B3FC4" stroke-width="4"/><text x="780" y="380" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1726" text-anchor="middle">Merge fix/member-discount</text><circle cx="520" cy="220" r="16" fill="#D99A06"/><text x="520" y="180" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#D99A06" text-anchor="middle">fix: members get 20% off, not 10%</text><text x="80" y="300" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#5B3FC4" text-anchor="start">main</text><text x="400" y="255" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#D99A06" text-anchor="start">fix/member-discount</text><text x="80" y="460" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1726" text-anchor="start">A branch lets Vanna work without changing main. A merge brings her finished work back.</text><text x="80" y="492" font-family="'Karla', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5C5670" text-anchor="start">Everyone else keeps working on main the whole time.</text></svg>