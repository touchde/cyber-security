<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-label="Parts of a version number and what ^1.9.0 allows"><title>Parts of a version number and what ^1.9.0 allows</title><defs></defs><rect width="1100" height="600" fill="#FFFFFF"/><text x="40" y="52" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="28" font-weight="700" fill="#14213D" text-anchor="start">Semantic versioning</text><text x="40" y="82" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start">Each part of a version number tells you what kind of change it is.</text><text x="400" y="210" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="64" font-weight="700" fill="#14213D" text-anchor="middle">1</text><line x1="360" y1="235" x2="440" y2="235" stroke="#2353C9" stroke-width="3"/><text x="400" y="265" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="18" font-weight="700" fill="#2353C9" text-anchor="middle">MAJOR</text><text x="400" y="290" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="600" fill="#55607A" text-anchor="middle">breaking change</text><text x="550" y="210" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="64" font-weight="700" fill="#14213D" text-anchor="middle">9</text><line x1="510" y1="235" x2="590" y2="235" stroke="#2353C9" stroke-width="3"/><text x="550" y="265" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="18" font-weight="700" fill="#2353C9" text-anchor="middle">MINOR</text><text x="550" y="290" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="600" fill="#55607A" text-anchor="middle">new feature</text><text x="700" y="210" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="64" font-weight="700" fill="#14213D" text-anchor="middle">1</text><line x1="660" y1="235" x2="740" y2="235" stroke="#2353C9" stroke-width="3"/><text x="700" y="265" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="18" font-weight="700" fill="#2353C9" text-anchor="middle">PATCH</text><text x="700" y="290" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="600" fill="#55607A" text-anchor="middle">bug fix</text><text x="475" y="210" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="64" font-weight="700" fill="#14213D" text-anchor="middle">.</text><text x="625" y="210" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="64" font-weight="700" fill="#14213D" text-anchor="middle">.</text><line x1="100" y1="430" x2="1000" y2="430" stroke="#D9DEE8" stroke-width="3"/><rect x="320" y="418" width="560" height="24" fill="#178A5B" stroke="none" stroke-width="0"/><line x1="140" y1="410" x2="140" y2="450" stroke="#55607A" stroke-width="2"/><text x="140" y="480" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#55607A" text-anchor="middle">1.8.0</text><line x1="320" y1="410" x2="320" y2="450" stroke="#14213D" stroke-width="2"/><text x="320" y="480" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#14213D" text-anchor="middle">1.9.0</text><line x1="470" y1="410" x2="470" y2="450" stroke="#14213D" stroke-width="2"/><text x="470" y="480" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#14213D" text-anchor="middle">1.9.1</text><line x1="640" y1="410" x2="640" y2="450" stroke="#14213D" stroke-width="2"/><text x="640" y="480" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#14213D" text-anchor="middle">1.10.0</text><line x1="900" y1="410" x2="900" y2="450" stroke="#C26A00" stroke-width="2"/><text x="900" y="480" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#C26A00" text-anchor="middle">2.0.0</text><text x="600" y="400" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#178A5B" text-anchor="middle">^1.9.0 allows these</text><text x="900" y="395" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="26" font-weight="700" fill="#C26A00" text-anchor="middle">✗</text><text x="900" y="520" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="700" fill="#C26A00" text-anchor="middle">not allowed:</text><text x="900" y="542" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="700" fill="#C26A00" text-anchor="middle">may break your code</text></svg>
