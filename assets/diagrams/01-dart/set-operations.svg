<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-label="Union, intersection, and difference of two sets"><title>Union, intersection, and difference of two sets</title><defs></defs><rect width="1100" height="620" fill="#FFFFFF"/><text x="40" y="52" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="28" font-weight="700" fill="#14213D" text-anchor="start">Set operations</text><text x="40" y="82" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start">Morning sales and afternoon sales at Mina Coffee</text><circle cx="430" cy="320" r="190" fill="#2353C9" fill-opacity="0.10" stroke="#2353C9" stroke-width="3"/><circle cx="670" cy="320" r="190" fill="#C26A00" fill-opacity="0.10" stroke="#C26A00" stroke-width="3"/><text x="300" y="120" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#2353C9" text-anchor="middle">morning</text><text x="800" y="120" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#C26A00" text-anchor="middle">afternoon</text><text x="340" y="325" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="22" font-weight="600" fill="#14213D" text-anchor="middle">Mocha</text><text x="550" y="305" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="22" font-weight="600" fill="#14213D" text-anchor="middle">Latte</text><text x="550" y="345" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="22" font-weight="600" fill="#14213D" text-anchor="middle">Croissant</text><text x="760" y="325" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="22" font-weight="600" fill="#14213D" text-anchor="middle">Iced tea</text><text x="190" y="545" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#14213D" text-anchor="start">morning.union(afternoon)</text><text x="590" y="545" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start">everything in either circle</text><text x="190" y="571" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#14213D" text-anchor="start">morning.intersection(afternoon)</text><text x="590" y="571" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start">only the middle</text><text x="190" y="597" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#14213D" text-anchor="start">morning.difference(afternoon)</text><text x="590" y="597" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start">only the left part</text></svg>
