<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="Destructuring a positional record and a named record"><title>Destructuring a positional record and a named record</title><defs><marker id="arrow-C26A00" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#C26A00"/></marker></defs><rect width="1100" height="560" fill="#FFFFFF"/><text x="40" y="52" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="28" font-weight="700" fill="#14213D" text-anchor="start">Destructuring</text><text x="40" y="82" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start">A pattern takes a value apart and puts each part in a new variable.</text><text x="550.0" y="140" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#2353C9" text-anchor="middle">var (name, cups) = bestSeller();</text><rect x="100" y="190" width="340" height="70" fill="#EAF0FD" stroke="#2353C9" stroke-width="2"/><text x="270" y="233" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#14213D" text-anchor="middle">(&#x27;Iced latte&#x27;, 42)</text><rect x="680" y="170" width="320" height="56" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="840.0" y="204.3" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#14213D" text-anchor="middle">name = &#x27;Iced latte&#x27;</text><rect x="680" y="240" width="320" height="56" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="840.0" y="274.3" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#14213D" text-anchor="middle">cups = 42</text><line x1="444" y1="215" x2="674" y2="198" stroke="#C26A00" stroke-width="2.5" marker-end="url(#arrow-C26A00)"/><line x1="444" y1="235" x2="674" y2="268" stroke="#C26A00" stroke-width="2.5" marker-end="url(#arrow-C26A00)"/><text x="550.0" y="360" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#2353C9" text-anchor="middle">var (:subtotal, :tax) = totals;</text><rect x="100" y="400" width="340" height="70" fill="#EAF0FD" stroke="#2353C9" stroke-width="2"/><text x="270" y="443" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#14213D" text-anchor="middle">(subtotal: 8000, tax: 800)</text><rect x="680" y="384" width="320" height="50" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="840.0" y="414.95" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#14213D" text-anchor="middle">subtotal = 8000</text><rect x="680" y="446" width="320" height="50" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="840.0" y="476.95" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#14213D" text-anchor="middle">tax = 800</text><line x1="444" y1="425" x2="674" y2="409" stroke="#C26A00" stroke-width="2.5" marker-end="url(#arrow-C26A00)"/><line x1="444" y1="445" x2="674" y2="471" stroke="#C26A00" stroke-width="2.5" marker-end="url(#arrow-C26A00)"/><text x="560" y="520" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#55607A" text-anchor="middle">:subtotal is short for subtotal: subtotal</text></svg>
