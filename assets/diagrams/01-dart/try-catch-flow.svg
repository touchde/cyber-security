<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="The three paths through try, catch, and finally"><title>The three paths through try, catch, and finally</title><defs><marker id="arrow-178A5B" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#178A5B"/></marker><marker id="arrow-2353C9" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#2353C9"/></marker><marker id="arrow-C26A00" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#C26A00"/></marker></defs><rect width="1100" height="640" fill="#FFFFFF"/><text x="40" y="52" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="28" font-weight="700" fill="#14213D" text-anchor="start">How try, catch, and finally run</text><text x="40" y="82" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start">finally always runs, on all three paths.</text><rect x="390" y="110" width="320" height="76" fill="#EAF0FD" stroke="#2353C9" stroke-width="2"/><text x="550.0" y="144.0" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#14213D" text-anchor="middle">try</text><text x="550.0" y="168.0" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle">the code that may fail</text><text x="170" y="235" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="700" fill="#178A5B" text-anchor="middle">No problem</text><text x="562" y="225" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="700" fill="#2353C9" text-anchor="start">Caught</text><text x="930" y="235" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="700" fill="#C26A00" text-anchor="middle">No matching catch</text><line x1="420" y1="190" x2="200" y2="370" stroke="#178A5B" stroke-width="2.5" marker-end="url(#arrow-178A5B)"/><line x1="550" y1="190" x2="550" y2="252" stroke="#2353C9" stroke-width="2.5" marker-end="url(#arrow-2353C9)"/><line x1="680" y1="190" x2="900" y2="370" stroke="#C26A00" stroke-width="2.5" marker-end="url(#arrow-C26A00)"/><rect x="390" y="258" width="320" height="76" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="550.0" y="292.0" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#14213D" text-anchor="middle">catch</text><text x="550.0" y="316.0" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle">handle the problem</text><rect x="70" y="376" width="960" height="76" fill="#FFF3E0" stroke="#C26A00" stroke-width="2"/><text x="550.0" y="410.0" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#14213D" text-anchor="middle">finally</text><text x="550.0" y="434.0" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle">always runs: close the cash drawer</text><line x1="550" y1="338" x2="550" y2="370" stroke="#2353C9" stroke-width="2.5" marker-end="url(#arrow-2353C9)"/><line x1="200" y1="456" x2="200" y2="512" stroke="#178A5B" stroke-width="2.5" marker-end="url(#arrow-178A5B)"/><line x1="550" y1="456" x2="550" y2="512" stroke="#2353C9" stroke-width="2.5" marker-end="url(#arrow-2353C9)"/><line x1="900" y1="456" x2="900" y2="512" stroke="#C26A00" stroke-width="2.5" marker-end="url(#arrow-C26A00)"/><rect x="70" y="518" width="300" height="70" fill="#F4F6FA" stroke="#D9DEE8" stroke-width="2"/><text x="220.0" y="559.3" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#14213D" text-anchor="middle">The next line runs</text><rect x="400" y="518" width="300" height="70" fill="#F4F6FA" stroke="#D9DEE8" stroke-width="2"/><text x="550.0" y="559.3" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#14213D" text-anchor="middle">The next line runs</text><rect x="730" y="518" width="300" height="70" fill="#FFF3E0" stroke="#C26A00" stroke-width="2"/><text x="880.0" y="559.3" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#14213D" text-anchor="middle">Goes on to the caller</text></svg>
