<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="An OrderBuilder collects parts and builds an Order"><title>An OrderBuilder collects parts and builds an Order</title><defs><marker id="arrow-C26A00" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#C26A00"/></marker></defs><rect width="1100" height="520" fill="#FFFFFF"/><text x="40" y="52" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="28" font-weight="700" fill="#14213D" text-anchor="start">Builder</text><text x="40" y="82" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start">Collect the parts step by step. build() checks them and creates the object.</text><rect x="60" y="130" width="380" height="170" fill="#EAF0FD" stroke="#2353C9" stroke-width="2"/><text x="250.0" y="164" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14213D" text-anchor="middle">OrderBuilder(&#x27;Dara&#x27;)</text><line x1="60" y1="178" x2="440" y2="178" stroke="#2353C9" stroke-width="1.5"/><text x="78" y="204" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">..add(&#x27;Latte&#x27;)</text><text x="78" y="232" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">..size(&#x27;L&#x27;)</text><text x="78" y="260" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">..iced()</text><text x="78" y="288" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">..note(&#x27;less ice&#x27;)</text><line x1="444" y1="230" x2="634" y2="230" stroke="#C26A00" stroke-width="2.5" marker-end="url(#arrow-C26A00)"/><text x="539.0" y="216.0" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="600" fill="#C26A00" text-anchor="middle">build()</text><text x="539" y="262" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="600" fill="#C26A00" text-anchor="middle">checks the parts</text><rect x="640" y="130" width="400" height="170" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="840.0" y="164" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14213D" text-anchor="middle">Order</text><line x1="640" y1="178" x2="1040" y2="178" stroke="#2353C9" stroke-width="1.5"/><text x="658" y="204" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">customer: &#x27;Dara&#x27;</text><text x="658" y="232" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">items: [Latte]</text><text x="658" y="260" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">size: &#x27;L&#x27;, iced: true</text><text x="658" y="288" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">note: &#x27;less ice&#x27;</text><rect x="60" y="380" width="380" height="60" fill="#F4F6FA" stroke="#D9DEE8" stroke-width="2" stroke-dasharray="6 5"/><text x="80" y="417" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#55607A" text-anchor="start">no items?</text><text x="420" y="417" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#C26A00" text-anchor="end">StateError</text><text x="550.0" y="490" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#55607A" text-anchor="middle">The finished Order cannot change. Only the builder can create it.</text></svg>
