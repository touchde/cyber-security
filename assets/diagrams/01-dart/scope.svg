<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-label="Variable scope in a Dart file"><title>Variable scope in a Dart file</title><defs></defs><rect width="1100" height="600" fill="#FFFFFF"/><text x="40" y="52" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="28" font-weight="700" fill="#14213D" text-anchor="start">Scope follows the curly braces</text><text x="40" y="82" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start">Code inside can use variables from outside. Code outside cannot use variables from inside.</text><rect x="40" y="110" width="1020" height="460" fill="#F4F6FA" stroke="#D9DEE8" stroke-width="2" stroke-dasharray="8 6"/><text x="56" y="138" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="13" font-weight="700" fill="#55607A" text-anchor="start">FILE (TOP LEVEL)</text><rect x="250" y="122" width="112" height="34" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="306.0" y="145" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#2353C9" text-anchor="middle">shopName</text><rect x="80" y="190" width="440" height="340" fill="#F4F6FA" stroke="#D9DEE8" stroke-width="2" stroke-dasharray="8 6"/><text x="96" y="220" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#55607A" text-anchor="start">printOpening() { }</text><rect x="110" y="240" width="79" height="34" fill="#FFFFFF" stroke="#C26A00" stroke-width="2"/><text x="149.5" y="263" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#C26A00" text-anchor="middle">hours</text><text x="110" y="320" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#14213D" text-anchor="start">✓ can use shopName</text><text x="110" y="352" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#14213D" text-anchor="start">✓ can use hours</text><rect x="560" y="190" width="460" height="340" fill="#F4F6FA" stroke="#D9DEE8" stroke-width="2" stroke-dasharray="8 6"/><text x="576" y="220" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#55607A" text-anchor="start">main() { }</text><text x="590" y="250" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#14213D" text-anchor="start">✓ can use shopName</text><text x="590" y="282" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#C26A00" text-anchor="start">✗ cannot use hours</text><rect x="590" y="320" width="400" height="180" fill="#F4F6FA" stroke="#D9DEE8" stroke-width="2" stroke-dasharray="8 6"/><text x="606" y="350" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#55607A" text-anchor="start">if (...) { }</text><rect x="620" y="366" width="101" height="34" fill="#FFFFFF" stroke="#C26A00" stroke-width="2"/><text x="670.5" y="389" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#C26A00" text-anchor="middle">message</text><text x="620" y="440" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="16" font-weight="600" fill="#14213D" text-anchor="start">✓ can use message and shopName</text></svg>
