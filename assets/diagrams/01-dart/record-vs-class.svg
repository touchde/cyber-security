<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-label="A record compared with a class"><title>A record compared with a class</title><defs><marker id="arrow-55607A" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#55607A"/></marker></defs><rect width="1100" height="600" fill="#FFFFFF"/><text x="40" y="52" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="28" font-weight="700" fill="#14213D" text-anchor="start">Record or class?</text><text x="40" y="82" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start">Both group values. A class can also have methods and private fields.</text><text x="260" y="140" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="22" font-weight="700" fill="#2353C9" text-anchor="middle">Record</text><rect x="100" y="170" width="320" height="80" fill="#EAF0FD" stroke="#2353C9" stroke-width="2"/><line x1="260" y1="170" x2="260" y2="250" stroke="#2353C9" stroke-width="2"/><text x="180" y="218" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#14213D" text-anchor="middle">&#x27;Latte&#x27;</text><text x="340" y="218" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#14213D" text-anchor="middle">6000</text><text x="180" y="278" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#55607A" text-anchor="middle">$1</text><text x="340" y="278" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#55607A" text-anchor="middle">$2</text><text x="110" y="340" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">• No class needed</text><text x="110" y="370" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">• Compared by value</text><text x="110" y="400" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">• Cannot be changed</text><text x="800" y="140" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="22" font-weight="700" fill="#C26A00" text-anchor="middle">Class</text><rect x="580" y="170" width="210" height="142" fill="#FFF3E0" stroke="#C26A00" stroke-width="2"/><text x="685.0" y="204" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14213D" text-anchor="middle">class MenuItem</text><line x1="580" y1="218" x2="790" y2="218" stroke="#C26A00" stroke-width="1.5"/><text x="598" y="244" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">name</text><text x="598" y="272" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">price</text><text x="598" y="300" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">describe()</text><rect x="860" y="170" width="200" height="114" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="960.0" y="204" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14213D" text-anchor="middle">an object</text><line x1="860" y1="218" x2="1060" y2="218" stroke="#2353C9" stroke-width="1.5"/><text x="878" y="244" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">&#x27;Latte&#x27;</text><text x="878" y="272" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">6000</text><line x1="794" y1="230" x2="854" y2="230" stroke="#55607A" stroke-width="2.5" marker-end="url(#arrow-55607A)"/><text x="590" y="400" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">• Needs a class first</text><text x="590" y="430" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">• Can have methods</text><text x="590" y="460" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">• Can have private fields</text><text x="550.0" y="560" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#55607A" text-anchor="middle">Use a record for a quick group of values. Use a class for a real thing in your program.</text></svg>
