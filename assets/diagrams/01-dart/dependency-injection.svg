<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-label="main and a test each inject a different menu into PriceService"><title>main and a test each inject a different menu into PriceService</title><defs><marker id="arrow-C26A00" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#C26A00"/></marker></defs><rect width="1100" height="620" fill="#FFFFFF"/><text x="40" y="52" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="28" font-weight="700" fill="#14213D" text-anchor="start">Dependency injection</text><text x="40" y="82" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start">An object gets what it needs from outside, through its constructor.</text><rect x="40" y="110" width="460" height="200" fill="#F4F6FA" stroke="#D9DEE8" stroke-width="2" stroke-dasharray="8 6"/><text x="56" y="138" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="13" font-weight="700" fill="#55607A" text-anchor="start">MAIN(): THE COMPOSITION ROOT</text><rect x="70" y="160" width="400" height="60" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="270.0" y="195.25" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#14213D" text-anchor="middle">FileMenuRepository(&#x27;data/menu.json&#x27;)</text><text x="70" y="270" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#C26A00" text-anchor="start">PriceService(menu)</text><rect x="40" y="350" width="460" height="200" fill="#F4F6FA" stroke="#D9DEE8" stroke-width="2" stroke-dasharray="8 6"/><text x="56" y="378" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="13" font-weight="700" fill="#55607A" tex