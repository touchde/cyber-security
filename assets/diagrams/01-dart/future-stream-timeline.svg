<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="One Future value compared with many Stream values over time"><title>One Future value compared with many Stream values over time</title><defs><marker id="arrow-55607A" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#55607A"/></marker></defs><rect width="1100" height="560" fill="#FFFFFF"/><text x="40" y="52" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="28" font-weight="700" fill="#14213D" text-anchor="start">Future and Stream</text><text x="40" y="82" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start">A Future gives one value later. A Stream gives many values over time, then it is done.</text><text x="60" y="128" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14213D" text-anchor="start">Future&lt;String&gt;</text><line x1="80" y1="190" x2="1000" y2="190" stroke="#D9DEE8" stroke-width="3"/><circle cx="80" cy="190" r="9" fill="#FFFFFF" stroke="#2353C9" stroke-width="3"/><text x="60" y="328" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14213D" text-anchor="start">Stream&lt;String&gt;</text><line x1="80" y1="390" x2="1000" y2="390" stroke="#D9DEE8" stroke-width="3"/><circle cx="80" cy="390" r="9" fill="#FFFFFF" stroke="#2353C9" stroke-width="3"/><line x1="990" y1="190" x2="1030" y2="190" stroke="#55607A" stroke-width="2.5" marker-end="url(#arrow-55607A)"/><text x="1030" y="225" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="600" fill="#55607A" text-anchor="end">time</text><text x="80" y="228" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="600" fill="#55607A" text-anchor="start">brew(&#x27;Latte&#x27;) called</text><text x="440" y="175" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#55607A" text-anchor="middle">waiting...</text><circle cx="760" cy="190" r="14" fill="#2353C9"/><text x="760" y="160" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#2353C9" text-anchor="middle">&#x27;Latte is ready.&#x27;</text><text x="760" y="228" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="600" fill="#55607A" text-anchor="middle">completes once</text><text x="80" y="428" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="600" fill="#55607A" text-anchor="start">listen</text><circle cx="260" cy="390" r="14" fill="#2353C9"/><text x="260" y="360" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#2353C9" text-anchor="middle">received</text><circle cx="440" cy="390" r="14" fill="#2353C9"/><text x="440" y="360" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#2353C9" text-anchor="middle">preparing</text><circle cx="620" cy="390" r="14" fill="#2353C9"/><text x="620" y="360" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#2353C9" text-anchor="middle">ready</text><circle cx="800" cy="390" r="14" fill="#2353C9"/><text x="800" y="360" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#2353C9" text-anchor="middle">paid</text><rect x="940" y="360" width="10" height="60" fill="#C26A00" stroke="none" stroke-width="0"/><text x="945" y="448" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="700" fill="#C26A00" text-anchor="middle">done</text><text x="550.0" y="515" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#55607A" text-anchor="middle">Either one can also end with an error instead of a value.</text></svg>
