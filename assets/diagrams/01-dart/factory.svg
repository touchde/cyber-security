<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="A factory constructor creates a Drink or a Pastry from JSON"><title>A factory constructor creates a Drink or a Pastry from JSON</title><defs><marker id="arrow-55607A" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#55607A"/></marker><marker id="arrow-C26A00" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#C26A00"/></marker></defs><rect width="1100" height="520" fill="#FFFFFF"/><text x="40" y="52" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="28" font-weight="700" fill="#14213D" text-anchor="start">Factory</text><text x="40" y="82" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start">One constructor decides which class to create.</text><rect x="40" y="150" width="280" height="80" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="180.0" y="195.6" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#14213D" text-anchor="middle">{&#x27;type&#x27;: &#x27;drink&#x27;, ...}</text><rect x="40" y="300" width="280" height="80" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="180.0" y="345.6" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#14213D" text-anchor="middle">{&#x27;type&#x27;: &#x27;pastry&#x27;, ...}</text><rect x="400" y="170" width="320" height="86" fill="#FFF3E0" stroke="#C26A00" stroke-width="2"/><text x="560.0" y="204" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14213D" text-anchor="middle">MenuItem.fromJson</text><line x1="400" y1="218" x2="720" y2="218" stroke="#C26A00" stroke-width="1.5"/><text x="418" y="244" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">switch (json[&#x27;type&#x27;])</text><line x1="324" y1="190" x2="394" y2="230" stroke="#55607A" stroke-width="2.5" marker-end="url(#arrow-55607A)"/><line x1="324" y1="340" x2="394" y2="260" stroke="#55607A" stroke-width="2.5" marker-end="url(#arrow-55607A)"/><rect x="820" y="120" width="240" height="86" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="940.0" y="154" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14213D" text-anchor="middle">Drink</text><line x1="820" y1="168" x2="1060" y2="168" stroke="#2353C9" stroke-width="1.5"/><text x="838" y="194" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">name, price</text><rect x="820" y="300" width="240" height="114" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="940.0" y="334" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14213D" text-anchor="middle">Pastry</text><line x1="820" y1="348" x2="1060" y2="348" stroke="#2353C9" stroke-width="1.5"/><text x="838" y="374" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">name, price</text><text x="838" y="402" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">isWarm</text><line x1="724" y1="220" x2="814" y2="170" stroke="#C26A00" stroke-width="2.5" marker-end="url(#arrow-C26A00)"/><line x1="724" y1="250" x2="814" y2="340" stroke="#C26A00" stroke-width="2.5" marker-end="url(#arrow-C26A00)"/><text x="762" y="232" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#C26A00" text-anchor="start">&#x27;drink&#x27;</text><text x="752" y="332" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#C26A00" text-anchor="end">&#x27;pastry&#x27;</text><text x="550.0" y="480" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#55607A" text-anchor="middle">The caller only asks for a MenuItem. It never names Drink or Pastry.</text></svg>
