="150" width="300" height="86" fill="#FFFFFF" stroke="#2353C9" stroke-width="2" stroke-dasharray="6 5"/><text x="510.0" y="184" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14213D" text-anchor="middle">CardTerminal</text><line x1="360" y1="198" x2="660" y2="198" stroke="#2353C9" stroke-width="1.5"/><text x="378" y="224" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">bool charge(int riel)</text><text x="676" y="200" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="600" fill="#55607A" text-anchor="start">what our code expects</text><rect x="360" y="300" width="300" height="114" fill="#FFF3E0" stroke="#C26A00" stroke-width="2"/><text x="510.0" y="334" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14213D" text-anchor="middle">BankCardAdapter</text><line x1="360" y1="348" x2="660" y2="348" stroke="#C26A00" stroke-width="1.5"/><text x="378" y="374" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">riel → cents</text><text x="378" y="402" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">0 → true</text><line x1="510" y1="296" x2="510" y2="240" stroke="#C26A00" stroke-width="2.5" marker-end="url(#arrow-C26A00)"/><text x="522" y="274" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#C26A00" text-anchor="start">implements</text><rect x="820" y="300" width="320" height="86" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="980.0" y="334" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14213D" text-anchor="middle">BankCar