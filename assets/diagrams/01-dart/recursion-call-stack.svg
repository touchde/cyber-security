<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="Call stack of factorial(4)"><title>Call stack of factorial(4)</title><defs><marker id="arrow-2353C9" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#2353C9"/></marker><marker id="arrow-C26A00" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#C26A00"/></marker></defs><rect width="1100" height="560" fill="#FFFFFF"/><text x="40" y="52" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="28" font-weight="700" fill="#14213D" text-anchor="start">How factorial(4) runs</text><text x="40" y="82" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start">Each call waits for a smaller call. Results come back up after the base case.</text><rect x="80" y="120" width="300" height="64" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="230.0" y="148.0" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#14213D" text-anchor="middle">factorial(4)</text><text x="230.0" y="172.0" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle">4 × factorial(3)</text><line x1="140" y1="186" x2="270" y2="216" stroke="#2353C9" stroke-width="2.5" marker-end="url(#arrow-2353C9)"/><line x1="500" y1="216" x2="370" y2="188" stroke="#C26A00" stroke-width="2.5" marker-end="url(#arrow-C26A00)"/><text x="532" y="208" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="16" font-weight="700" fill="#C26A00" text-anchor="start">returns 6</text><rect x="230" y="220" width="300" height="64" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="380.0" y="248.0" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#14213D" text-anchor="middle">factorial(3)</text><text x="380.0" y="272.0" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle">3 × factorial(2)</text><line x1="290" y1="286" x2="420" y2="316" stroke="#2353C9" stroke-width="2.5" marker-end="url(#arrow-2353C9)"/><line x1="650" y1="316" x2="520" y2="288" stroke="#C26A00" stroke-width="2.5" marker-end="url(#arrow-C26A00)"/><text x="682" y="308" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="16" font-weight="700" fill="#C26A00" text-anchor="start">returns 2</text><rect x="380" y="320" width="300" height="64" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="530.0" y="348.0" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#14213D" text-anchor="middle">factorial(2)</text><text x="530.0" y="372.0" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle">2 × factorial(1)</text><line x1="440" y1="386" x2="570" y2="416" stroke="#2353C9" stroke-width="2.5" marker-end="url(#arrow-2353C9)"/><line x1="800" y1="416" x2="670" y2="388" stroke="#C26A00" stroke-width="2.5" marker-end="url(#arrow-C26A00)"/><text x="832" y="408" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="16" font-weight="700" fill="#C26A00" text-anchor="start">returns 1</text><rect x="530" y="420" width="300" height="64" fill="#FFF3E0" stroke="#C26A00" stroke-width="2"/><text x="680.0" y="448.0" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#14213D" text-anchor="middle">factorial(1)</text><text x="680.0" y="472.0" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="400" fill="#55607A" text-anchor="middle">base case</text><text x="400" y="160" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="26" font-weight="700" fill="#C26A00" text-anchor="start">= 24</text><text x="80" y="528" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="16" font-weight="700" fill="#2353C9" text-anchor="start">calls go down</text><text x="240" y="528" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="16" font-weight="700" fill="#C26A00" text-anchor="start">results come back up</text></svg>
