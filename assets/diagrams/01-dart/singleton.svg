<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="Three callers share one TicketCounter object"><title>Three callers share one TicketCounter object</title><defs><marker id="arrow-2353C9" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#2353C9"/></marker></defs><rect width="1100" height="560" fill="#FFFFFF"/><text x="40" y="52" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="28" font-weight="700" fill="#14213D" text-anchor="start">Singleton</text><text x="40" y="82" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start">One object, shared by every part of the program.</text><rect x="60" y="130" width="300" height="70" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="210.0" y="171.3" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#14213D" text-anchor="middle">takeOrder(&#x27;Latte&#x27;)</text><line x1="364" y1="165" x2="634" y2="230" stroke="#2353C9" stroke-width="2.5" marker-end="url(#arrow-2353C9)"/><rect x="60" y="250" width="300" height="70" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="210.0" y="291.3" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#14213D" text-anchor="middle">takeOrder(&#x27;Mocha&#x27;)</text><line x1="364" y1="285" x2="634" y2="270" stroke="#2353C9" stroke-width="2.5" marker-end="url(#arrow-2353C9)"/><rect x="60" y="370" width="300" height="70" fill="#FFFFFF" stroke="#2353C9" stroke-width="2"/><text x="210.0" y="411.3" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#14213D" text-anchor="middle">takeOrder(&#x27;Green tea&#x27;)</text><line x1="364" y1="405" x2="634" y2="310" stroke="#2353C9" stroke-width="2.5" marker-end="url(#arrow-2353C9)"/><text x="500" y="168" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#2353C9" text-anchor="middle">TicketCounter.instance</text><rect x="640" y="190" width="380" height="142" fill="#FFF3E0" stroke="#C26A00" stroke-width="2"/><text x="830.0" y="224" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14213D" text-anchor="middle">TicketCounter</text><line x1="640" y1="238" x2="1020" y2="238" stroke="#C26A00" stroke-width="1.5"/><text x="658" y="264" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">static instance</text><text x="658" y="292" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">_last = 3</text><text x="658" y="320" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#14213D" text-anchor="start">next()</text><text x="830" y="390" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="16" font-weight="700" fill="#C26A00" text-anchor="middle">the only object</text><rect x="640" y="430" width="380" height="60" fill="#F4F6FA" stroke="#D9DEE8" stroke-width="2" stroke-dasharray="6 5"/><text x="660" y="467" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#55607A" text-anchor="start">TicketCounter()</text><text x="1000" y="467" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="700" fill="#C26A00" text-anchor="end">✗ private</text><text x="550.0" y="530" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#55607A" text-anchor="middle">The constructor is private, so nobody can make a second counter.</text></svg>
