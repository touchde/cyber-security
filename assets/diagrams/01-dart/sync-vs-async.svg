<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-label="Synchronous compared with asynchronous execution"><title>Synchronous compared with asynchronous execution</title><defs><marker id="arrow-C26A00" viewBox="0 0 14 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 z" fill="#C26A00"/></marker></defs><rect width="1100" height="500" fill="#FFFFFF"/><text x="40" y="52" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="28" font-weight="700" fill="#14213D" text-anchor="start">Synchronous vs asynchronous</text><text x="40" y="82" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55607A" text-anchor="start">Async code starts slow work, keeps going, and handles the result later.</text><text x="40" y="156" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="18" font-weight="700" fill="#14213D" text-anchor="start">Synchronous</text><text x="40" y="326" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="18" font-weight="700" fill="#14213D" text-anchor="start">Asynchronous</text><line x1="240" y1="150" x2="1040" y2="150" stroke="#D9DEE8" stroke-width="2"/><rect x="240" y="126" width="150" height="48" fill="#EAF0FD" stroke="#2353C9" stroke-width="2"/><text x="315.0" y="155.6" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#14213D" text-anchor="middle">step 1</text><rect x="400" y="126" width="380" height="48" fill="#F4F6FA" stroke="#D9DEE8" stroke-width="2"/><text x="590.0" y="155.6" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#14213D" text-anchor="middle">wait for network…</text><rect x="790" y="126" width="120" height="48" fill="#EAF0FD" stroke="#2353C9" stroke-width="2"/><text x="850.0" y="155.6" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#14213D" text-anchor="middle">step 2</text><text x="590" y="204" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="600" fill="#C26A00" text-anchor="middle">Nothing else can run while it waits</text><line x1="240" y1="320" x2="1040" y2="320" stroke="#D9DEE8" stroke-width="2"/><rect x="240" y="296" width="150" height="48" fill="#EAF0FD" stroke="#2353C9" stroke-width="2"/><text x="315.0" y="325.6" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#14213D" text-anchor="middle">start fetch</text><rect x="400" y="296" width="150" height="48" fill="#EAF0FD" stroke="#2353C9" stroke-width="2"/><text x="475.0" y="325.6" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#14213D" text-anchor="middle">step 2</text><rect x="560" y="296" width="150" height="48" fill="#EAF0FD" stroke="#2353C9" stroke-width="2"/><text x="635.0" y="325.6" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#14213D" text-anchor="middle">handle tap</text><rect x="820" y="296" width="200" height="48" fill="#FFF3E0" stroke="#C26A00" stroke-width="2"/><text x="920.0" y="325.6" font-family="&#x27;JetBrains Mono&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#14213D" text-anchor="middle">use result</text><path d="M315 346 C 420 430, 760 430, 900 350" fill="none" stroke="#C26A00" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-C26A00)"/><text x="610" y="440" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="15" font-weight="600" fill="#C26A00" text-anchor="middle">Future completes later  →  code after await runs</text></svg>
