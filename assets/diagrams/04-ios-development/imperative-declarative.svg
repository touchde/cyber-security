<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-label="Two ways to build a screen"><title>Two ways to build a screen</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#6A5B6E"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#6A5B6E"/></marker></defs><rect width="1100" height="590" fill="#FFFFFF"/><text x="40" y="52" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#24152B" text-anchor="start">Two ways to build a screen</text><text x="40" y="84" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6A5B6E" text-anchor="start">UIKit gives orders; SwiftUI describes the result</text><text x="60" y="140" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#6B3483" text-anchor="start">Imperative: give orders, step by step</text><rect x="60" y="160" width="290" height="90" fill="#FFFFFF" stroke="#6B3483" stroke-width="2.5"/><text x="205.0" y="196.4" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#24152B" text-anchor="middle">1. Make a label</text><text x="205.0" y="224.3" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6A5B6E" text-anchor="middle">UILabel()</text><rect x="400" y="160" width="290" height="90" fill="#FFFFFF" stroke="#6B3483" stroke-width="2.5"/><text x="545.0" y="196.4" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#24152B" text-anchor="middle">2. Set its text</text><text x="545.0" y="224.3" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6A5B6E" text-anchor="middle">Points: 120</text><rect x="740" y="160" width="300" height="90" fill="#FFFFFF" stroke="#6B3483" stroke-width="2.5"/><text x="890.0" y="196.4" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#24152B" text-anchor="middle">3. Points change</text><text x="890.0" y="224.3" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6A5B6E" text-anchor="middle">set the text again</text><line x1="350" y1="205" x2="398" y2="205" stroke="#6A5B6E" stroke-width="2.5" marker-end="url(#head)"/><line x1="690" y1="205" x2="738" y2="205" stroke="#6A5B6E" stroke-width="2.5" marker-end="url(#head)"/><text x="60" y="285" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6A5B6E" text-anchor="start">You must remember to update every label, every time.</text><text x="60" y="360" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#6B3483" text-anchor="start">Declarative: describe the screen for any data</text><rect x="60" y="380" width="290" height="100" fill="#FBF3DF" stroke="#B4841F" stroke-width="2.5"/><text x="205.0" y="421.4" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#24152B" text-anchor="middle">Data</text><text x="205.0" y="449.3" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6A5B6E" text-anchor="middle">points = 120</text><rect x="400" y="380" width="290" height="100" fill="#F6EEF9" stroke="#6B3483" stroke-width="2.5"/><text x="545.0" y="421.4" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#24152B" text-anchor="middle">body</text><text x="545.0" y="449.3" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6A5B6E" text-anchor="middle">Text(&quot;Points: \(points)&quot;)</text><rect x="740" y="380" width="300" height="100" fill="#FFFFFF" stroke="#6B3483" stroke-width="2.5"/><text x="890.0" y="421.4" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#24152B" text-anchor="middle">Screen</text><text x="890.0" y="449.3" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6A5B6E" text-anchor="middle">Points: 120</text><line x1="350" y1="430" x2="398" y2="430" stroke="#6A5B6E" stroke-width="2.5" marker-end="url(#head)"/><line x1="690" y1="430" x2="738" y2="430" stroke="#6A5B6E" stroke-width="2.5" marker-end="url(#head)"/><path d="M205,480 L205,525 L890,525 L890,484" fill="none" stroke="#6A5B6E" stroke-width="2.5" marker-end="url(#head)"/><text x="548" y="552" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6A5B6E" text-anchor="middle">When the data changes, SwiftUI runs body again and updates the screen.</text></svg>