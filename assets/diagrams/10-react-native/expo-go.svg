<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-label="Running your app with Expo Go"><title>Running your app with Expo Go</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#525C66"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#525C66"/></marker></defs><rect width="1100" height="460" fill="#FFFFFF"/><text x="40" y="52" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#15191F" text-anchor="start">Running your app with Expo Go</text><text x="40" y="84" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#525C66" text-anchor="start">No Android Studio or Xcode needed for the first steps</text><rect x="60" y="160" width="280" height="110" fill="#EBF7FB" stroke="#0E6E8C" stroke-width="2.5"/><text x="200.0" y="206.4" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#15191F" text-anchor="middle">Your computer</text><text x="200.0" y="234.3" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#525C66" text-anchor="middle">npx expo start (Metro)</text><rect x="420" y="160" width="260" height="110" fill="#FFFFFF" stroke="#0E6E8C" stroke-width="2.5"/><text x="550.0" y="206.4" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#15191F" text-anchor="middle">QR code</text><text x="550.0" y="234.3" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#525C66" text-anchor="middle">the address of your code</text><rect x="760" y="160" width="290" height="110" fill="#F3F4F6" stroke="#525C66" stroke-width="2.5"/><text x="905.0" y="206.4" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#15191F" text-anchor="middle">Your phone</text><text x="905.0" y="234.3" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#525C66" text-anchor="middle">Expo Go app</text><line x1="340" y1="215" x2="418" y2="215" stroke="#525C66" stroke-width="2.5" marker-end="url(#head)"/><line x1="680" y1="215" x2="758" y2="215" stroke="#525C66" stroke-width="2.5" marker-end="url(#head)"/><path d="M905,270 L905,330 L200,330 L200,274" fill="none" stroke="#525C66" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#tail)"/><text x="552" y="360" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#525C66" text-anchor="middle">Expo Go downloads your JavaScript from Metro, and runs it. Save a file, and the phone updates.</text><text x="552" y="420" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#15191F" text-anchor="middle">Phone and computer must be on the same Wi-Fi network.</text></svg>