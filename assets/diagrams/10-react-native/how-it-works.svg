<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-label="How React Native works"><title>How React Native works</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#525C66"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#525C66"/></marker></defs><rect width="1100" height="540" fill="#FFFFFF"/><text x="40" y="52" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#15191F" text-anchor="start">How React Native works</text><text x="40" y="84" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#525C66" text-anchor="start">Your JavaScript describes the screen; the system draws real native views</text><text x="60" y="135" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0E6E8C" text-anchor="start">JavaScript side</text><text x="700" y="135" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#15191F" text-anchor="start">Native side</text><rect x="60" y="155" width="360" height="100" fill="#EBF7FB" stroke="#0E6E8C" stroke-width="2.5"/><text x="240.0" y="196.4" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#15191F" text-anchor="middle">Your components</text><text x="240.0" y="224.3" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#525C66" text-anchor="middle">App.tsx: &lt;View&gt;, &lt;Text&gt;</text><rect x="60" y="300" width="360" height="100" fill="#EBF7FB" stroke="#0E6E8C" stroke-width="2.5"/><text x="240.0" y="341.4" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#15191F" text-anchor="middle">React</text><text x="240.0" y="369.3" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#525C66" text-anchor="middle">works out what changed</text><rect x="700" y="155" width="340" height="100" fill="#F3F4F6" stroke="#525C66" stroke-width="2.5"/><text x="870.0" y="196.4" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#15191F" text-anchor="middle">Native views</text><text x="870.0" y="224.3" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#525C66" text-anchor="middle">a real Android or iOS view</text><rect x="700" y="300" width="340" height="100" fill="#F3F4F6" stroke="#525C66" stroke-width="2.5"/><text x="870.0" y="341.4" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#15191F" text-anchor="middle">Native modules</text><text x="870.0" y="369.3" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#525C66" text-anchor="middle">camera, storage, location</text><line x1="240" y1="255" x2="240" y2="298" stroke="#525C66" stroke-width="2.5" marker-end="url(#head)"/><rect x="470" y="225" width="180" height="110" fill="#FFFFFF" stroke="#0E6E8C" stroke-width="2.5"/><text x="560" y="272" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#0E6E8C" text-anchor="middle">JSI</text><text x="560" y="302" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#525C66" text-anchor="middle">direct calls</text><line x1="420" y1="350" x2="468" y2="300" stroke="#525C66" stroke-width="2.5" marker-end="url(#head)"/><line x1="652" y1="260" x2="698" y2="205" stroke="#525C66" stroke-width="2.5" marker-end="url(#head)"/><line x1="652" y1="300" x2="698" y2="350" stroke="#525C66" stroke-width="2.5" marker-end="url(#head)" marker-start="url(#tail)"/><text x="550" y="470" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#15191F" text-anchor="middle">&lt;Text&gt; on Android becomes an Android text view; on iOS, an iOS text view.</text><text x="550" y="500" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#525C66" text-anchor="middle">So the app looks and feels native, from one JavaScript codebase.</text></svg>