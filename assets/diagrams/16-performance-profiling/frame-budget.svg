<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-label="The frame budget"><title>The frame budget</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#66554A"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#66554A"/></marker></defs><rect width="1100" height="420" fill="#FFFFFF"/><text x="40" y="52" font-family="'Sora', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1F130B" text-anchor="start">The frame budget</text><text x="40" y="84" font-family="'Sora', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#66554A" text-anchor="start">Every frame must be ready before the screen refreshes</text><text x="40" y="140" font-family="'Sora', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#C2410C" text-anchor="start">At 60 Hz, each frame has 16.7 ms</text><rect x="40" y="170" width="132" height="70" fill="#FFFFFF" stroke="#66554A" stroke-width="2"/><text x="106.0" y="213" font-family="'Sora', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1F130B" text-anchor="middle">11 ms</text><rect x="180" y="170" width="168" height="70" fill="#FFFFFF" stroke="#66554A" stroke-width="2"/><text x="264.0" y="213" font-family="'Sora', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1F130B" text-anchor="middle">14 ms</text><rect x="356" y="170" width="348" height="70" fill="#FFD8C2" stroke="#C2410C" stroke-width="2"/><text x="530.0" y="213" font-family="'Sora', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1F130B" text-anchor="middle">29 ms</text><rect x="712" y="170" width="108" height="70" fill="#FFFFFF" stroke="#66554A" stroke-width="2"/><text x="766.0" y="213" font-family="'Sora', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1F130B" text-anchor="middle">9 ms</text><rect x="828" y="170" width="144" height="70" fill="#FFFFFF" stroke="#66554A" stroke-width="2"/><text x="900.0" y="213" font-family="'Sora', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1F130B" text-anchor="middle">12 ms</text><line x1="40" y1="260" x2="240.39999999999998" y2="260" stroke="#C2410C" stroke-width="3"/><text x="40" y="290" font-family="'Sora', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#C2410C" text-anchor="start">16.7 ms budget</text><text x="40" y="350" font-family="'Sora', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1F130B" text-anchor="start">One frame took 29 ms: the screen showed the old frame twice. Users see a stutter, called jank.</text><text x="40" y="382" font-family="'Sora', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#66554A" text-anchor="start">At 120 Hz, the budget is only 8.3 ms.</text></svg>