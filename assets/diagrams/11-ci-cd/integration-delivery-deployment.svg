<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="Integration, delivery, and deployment"><title>Integration, delivery, and deployment</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#536373"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#536373"/></marker></defs><rect width="1100" height="560" fill="#FFFFFF"/><text x="40" y="52" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#16212B" text-anchor="start">Integration, delivery, and deployment</text><text x="40" y="84" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#536373" text-anchor="start">Three steps of automation; most mobile teams stop at delivery</text><text x="40" y="130" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#2F5573" text-anchor="start">Continuous integration</text><text x="40" y="156" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#536373" text-anchor="start">Every change is built and tested, many times a day</text><rect x="40" y="172" width="175" height="56" fill="#FFFFFF" stroke="#2F5573" stroke-width="2.5"/><text x="127.5" y="208.05" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16212B" text-anchor="middle">Merge</text><rect x="245" y="172" width="175" height="56" fill="#FFFFFF" stroke="#2F5573" stroke-width="2.5"/><text x="332.5" y="208.05" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16212B" text-anchor="middle">Build</text><line x1="217" y1="200" x2="243" y2="200" stroke="#536373" stroke-width="2.5" marker-end="url(#head)"/><rect x="450" y="172" width="175" height="56" fill="#FFFFFF" stroke="#2F5573" stroke-width="2.5"/><text x="537.5" y="208.05" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16212B" text-anchor="middle">Test</text><line x1="422" y1="200" x2="448" y2="200" stroke="#536373" stroke-width="2.5" marker-end="url(#head)"/><text x="40" y="270" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#2F5573" text-anchor="start">Continuous delivery</text><text x="40" y="296" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#536373" text-anchor="start">Every passing change could be released; a person presses the button</text><rect x="40" y="312" width="175" height="56" fill="#FFFFFF" stroke="#2F5573" stroke-width="2.5"/><text x="127.5" y="348.05" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16212B" text-anchor="middle">Merge</text><rect x="245" y="312" width="175" height="56" fill="#FFFFFF" stroke="#2F5573" stroke-width="2.5"/><text x="332.5" y="348.05" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16212B" text-anchor="middle">Build</text><line x1="217" y1="340" x2="243" y2="340" stroke="#536373" stroke-width="2.5" marker-end="url(#head)"/><rect x="450" y="312" width="175" height="56" fill="#FFFFFF" stroke="#2F5573" stroke-width="2.5"/><text x="537.5" y="348.05" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16212B" text-anchor="middle">Test</text><line x1="422" y1="340" x2="448" y2="340" stroke="#536373" stroke-width="2.5" marker-end="url(#head)"/><rect x="655" y="312" width="175" height="56" fill="#FFFFFF" stroke="#2F5573" stroke-width="2.5"/><text x="742.5" y="348.05" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16212B" text-anchor="middle">Package</text><line x1="627" y1="340" x2="653" y2="340" stroke="#536373" stroke-width="2.5" marker-end="url(#head)"/><rect x="860" y="312" width="175" height="56" fill="#ECFADF" stroke="#4E8A2A" stroke-width="2.5"/><text x="947.5" y="348.05" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16212B" text-anchor="middle">Release?</text><line x1="832" y1="340" x2="858" y2="340" stroke="#536373" stroke-width="2.5" marker-end="url(#head)"/><text x="947" y="390" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#536373" text-anchor="middle">a person decides</text><text x="40" y="410" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#2F5573" text-anchor="start">Continuous deployment</text><text x="40" y="436" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#536373" text-anchor="start">Every passing change is released automatically</text><rect x="40" y="452" width="175" height="56" fill="#FFFFFF" stroke="#2F5573" stroke-width="2.5"/><text x="127.5" y="488.05" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16212B" text-anchor="middle">Merge</text><rect x="245" y="452" width="175" height="56" fill="#FFFFFF" stroke="#2F5573" stroke-width="2.5"/><text x="332.5" y="488.05" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16212B" text-anchor="middle">Build</text><line x1="217" y1="480" x2="243" y2="480" stroke="#536373" stroke-width="2.5" marker-end="url(#head)"/><rect x="450" y="452" width="175" height="56" fill="#FFFFFF" stroke="#2F5573" stroke-width="2.5"/><text x="537.5" y="488.05" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16212B" text-anchor="middle">