<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-label="A pipeline, from push to result"><title>A pipeline, from push to result</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#536373"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#536373"/></marker></defs><rect width="1100" height="500" fill="#FFFFFF"/><text x="40" y="52" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#16212B" text-anchor="start">A pipeline, from push to result</text><text x="40" y="84" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#536373" text-anchor="start">What happens every time someone pushes a change</text><rect x="30" y="160" width="146" height="104" fill="#EEF4F8" stroke="#2F5573" stroke-width="2.5"/><text x="103.0" y="203.4" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16212B" text-anchor="middle">Push</text><text x="103.0" y="231.3" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#536373" text-anchor="middle">git push</text><rect x="208" y="160" width="146" height="104" fill="#FFFFFF" stroke="#2F5573" stroke-width="2.5"/><text x="281.0" y="203.4" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16212B" text-anchor="middle">Checkout</text><text x="281.0" y="231.3" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#536373" text-anchor="middle">get the code</text><line x1="178" y1="212" x2="206" y2="212" stroke="#536373" stroke-width="2.5" marker-end="url(#head)"/><rect x="268" y="275" width="30" height="30" fill="#4E8A2A"/><text x="283" y="296" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="386" y="160" width="146" height="104" fill="#FFFFFF" stroke="#2F5573" stroke-width="2.5"/><text x="459.0" y="204.4" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16212B" text-anchor="middle">Build</text><text x="459.0" y="230.6" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#536373" text-anchor="middle">pub get, compile</text><line x1="356" y1="212" x2="384" y2="212" stroke="#536373" stroke-width="2.5" marker-end="url(#head)"/><rect x="446" y="275" width="30" height="30" fill="#4E8A2A"/><text x="461" y="296" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="564" y="160" width="146" height="104" fill="#FFFFFF" stroke="#2F5573" stroke-width="2.5"/><text x="637.0" y="203.9" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16212B" text-anchor="middle">Check</text><text x="637.0" y="230.95" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#536373" text-anchor="middle">format, analyze</text><line x1="534" y1="212" x2="562" y2="212" stroke="#536373" stroke-width="2.5" marker-end="url(#head)"/><rect x="624" y="275" width="30" height="30" fill="#4E8A2A"/><text x="639" y="296" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="742" y="160" width="146" height="104" fill="#FFFFFF" stroke="#2F5573" stroke-width="2.5"/><text x="815.0" y="203.4" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16212B" text-anchor="middle">Test</text><text x="815.0" y="231.3" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#536373" text-anchor="middle">dart test</text><line x1="712" y1="212" x2="740" y2="212" stroke="#536373" stroke-width="2.5" marker-end="url(#head)"/><rect x="802" y="275" width="30" height="30" fill="#4E8A2A"/><text x="817" y="296" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><rect x="920" y="160" width="146" height="104" fill="#ECFADF" stroke="#4E8A2A" stroke-width="2.5"/><text x="993.0" y="203.4" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#16212B" text-anchor="middle">Result</text><text x="993.0" y="231.3" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#536373" text-anchor="middle">green or red</text><line x1="890" y1="212" x2="918" y2="212" stroke="#536373" stroke-width="2.5" marker-end="url(#head)"/><text x="30" y="370" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#16212B" text-anchor="start">Each numbered step runs on a fresh machine, called a runner, in the order shown.</text><text x="30" y="400" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#536373" text-anchor="start">If one step fails, the steps after it do not run, and the result is red.</text><text x="30" y="455" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#536373" text-anchor="start">The team sees the result on the commit and on the pull request, within minutes.</text></svg>