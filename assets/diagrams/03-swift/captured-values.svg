<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="A closure captures a variable"><title>A closure captures a variable</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5F5A69"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5F5A69"/></marker></defs><rect width="1100" height="560" fill="#FFFFFF"/><text x="40" y="52" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1D1A24" text-anchor="start">A closure captures a variable</text><text x="40" y="84" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="start">Two ticket counters, each with its own lastTicket</text><text x="40" y="140" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#5F5A69" text-anchor="start">Constant</text><text x="320" y="140" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#5F5A69" text-anchor="start">Closure</text><text x="700" y="140" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#5F5A69" text-anchor="start">Captured variable</text><rect x="40" y="160" width="220" height="100" fill="#FBF5F1" stroke="#C2391F" stroke-width="2.5"/><text x="150.0" y="201.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">counter</text><text x="150.0" y="229.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">let</text><line x1="262" y1="210" x2="318" y2="210" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="320" y="160" width="320" height="100" fill="#FFFFFF" stroke="#C2391F" stroke-width="2.5"/><text x="480.0" y="201.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">{ lastTicket += 1 }</text><text x="480.0" y="229.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">returns the next ticket</text><line x1="642" y1="210" x2="698" y2="210" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="700" y="160" width="360" height="100" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="880.0" y="201.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">lastTicket</text><text x="880.0" y="229.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">now 4, after four calls</text><rect x="40" y="300" width="220" height="100" fill="#FBF5F1" stroke="#C2391F" stroke-width="2.5"/><text x="150.0" y="341.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">tomorrow</text><text x="150.0" y="369.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">let</text><line x1="262" y1="350" x2="318" y2="350" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="320" y="300" width="320" height="100" fill="#FFFFFF" stroke="#C2391F" stroke-width="2.5"/><text x="480.0" y="341.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">{ lastTicket += 1 }</text><text x="480.0" y="369.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">returns the next ticket</text><line x1="642" y1="350" x2="698" y2="350" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="700" y="300" width="360" height="100" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="880.0" y="341.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">lastTicket</text><text x="880.0" y="369.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">now 1, after one call</text><text x="40" y="460" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1D1A24" text-anchor="start">Each call of makeTicketCounter() makes a new lastTicket, starting at 0.</text><text x="40" y="492" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5F5A69" text-anchor="start">The closure holds on to that variable after the function has returned,</text><text x="40" y="520" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5F5A69" text-anchor="start">so the two counters never share a number.</text></svg>