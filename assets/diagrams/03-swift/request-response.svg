fill="#FFFFFF" stroke="#C2391F" stroke-width="2.5"/><text x="420.0" y="361.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">JSONDecoder</text><text x="420.0" y="389.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">Codable types</text><line x1="568" y1="370" x2="537" y2="370" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="570" y="320" width="230" height="100" fill="#FFFFFF" stroke="#C2391F" stroke-width="2.5"/><text x="685.0" y="361.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">Status check</text><text x="685.0" y="389.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">200 to 299, or an error</text><line x1="833" y1="370" x2="802" y2="370" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="835" y="320" width="230" height="100" fill="#FBF5F1" stroke="#C2391F" stroke-width="2.5"/><text x="950.0" y="360.5" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#1D1A24" text-anchor="middle">HTTPURLResponse</text><text x="950.0" y="387.8" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">status, headers, body</text><text x="40" y="455" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#5F5A69" text-anchor="start">Response</text><text x="40" y="505" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1D1A24" text-anchor="start">Every step can fail; map each failure to one clear error type.</text></svg>