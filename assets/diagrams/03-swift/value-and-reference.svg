<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-label="Value types and reference types"><title>Value types and reference types</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5F5A69"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5F5A69"/></marker></defs><rect width="1100" height="500" fill="#FFFFFF"/><text x="40" y="52" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1D1A24" text-anchor="start">Value types and reference types</text><text x="40" y="84" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="start">What happens when you assign one to another name</text><text x="40" y="140" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1A24" text-anchor="start">Struct: a value</text><text x="590" y="140" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1A24" text-anchor="start">Class: a reference</text><rect x="40" y="165" width="160" height="90" fill="#FBF5F1" stroke="#C2391F" stroke-width="2.5"/><text x="120.0" y="201.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">latte</text><text x="120.0" y="229.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">let</text><line x1="202" y1="210" x2="268" y2="210" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="270" y="165" width="250" height="90" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="395.0" y="201.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">DrinkCard</text><text x="395.0" y="229.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">price: 6000</text><rect x="40" y="295" width="160" height="90" fill="#FBF5F1" stroke="#C2391F" stroke-width="2.5"/><text x="120.0" y="331.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">copy</text><text x="120.0" y="359.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">var</text><line x1="202" y1="340" x2="268" y2="340" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="270" y="295" width="250" height="90" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="395.0" y="331.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">DrinkCard</text><text x="395.0" y="359.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">price: 9999</text><rect x="590" y="165" width="170" height="90" fill="#FBF5F1" stroke="#C2391F" stroke-width="2.5"/><text x="675.0" y="201.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">dara</text><text x="675.0" y="229.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">let</text><line x1="762" y1="210" x2="868" y2="233" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="590" y="295" width="170" height="90" fill="#FBF5F1" stroke="#C2391F" stroke-width="2.5"/><text x="675.0" y="331.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">sameDara</text><text x="675.0" y="359.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">let</text><line x1="762" y1="340" x2="868" y2="277" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="870" y="210" width="190" height="90" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="965.0" y="246.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">CustomerCard</text><text x="965.0" y="274.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">visits: 4</text><text x="40" y="430" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="start">Two separate values. Changing the copy</text><text x="40" y="456" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="start">leaves the original as it was.</text><text x="590" y="430" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="start">Two names for one instance. A change</text><text x="590" y="456" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="start">through either name is seen by both.</text></svg>