<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="One moment, many clocks"><title>One moment, many clocks</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5F5A69"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5F5A69"/></marker></defs><rect width="1100" height="560" fill="#FFFFFF"/><text x="40" y="52" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1D1A24" text-anchor="start">One moment, many clocks</text><text x="40" y="84" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="start">A Date has no time zone; formatting adds one</text><rect x="40" y="230" width="300" height="110" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="190.0" y="276.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">One Date</text><text x="190.0" y="304.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">2026-11-04T08:40:00Z</text><text x="40" y="380" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5F5A69" text-anchor="start">Stored once, in UTC,</text><text x="40" y="404" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5F5A69" text-anchor="start">the same moment everywhere</text><line x1="342" y1="285" x2="568" y2="158" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="570" y="120" width="490" height="76" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"