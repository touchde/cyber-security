#5F5A69" text-anchor="middle">Europe/Paris</text><text x="40" y="520" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1D1A24" text-anchor="start">Store the moment; format it for the reader&#x27;s time zone only when you show it.</text></svg>