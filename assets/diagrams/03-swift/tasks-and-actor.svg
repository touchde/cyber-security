<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-label="Tasks and an actor"><title>Tasks and an actor</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5F5A69"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5F5A69"/></marker></defs><rect width="1100" height="530" fill="#FFFFFF"/><text x="40" y="52" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1D1A24" text-anchor="start">Tasks and an actor</text><text x="40" y="84" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="start">Three drinks brew at once; tickets come from one actor</text><rect x="40" y="130" width="240" height="80" fill="#FBF5F1" stroke="#C2391F" stroke-width="2.5"/><text x="160.0" y="161.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">Task group</text><text x="160.0" y="189.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">waits for all children</text><text x="380" y="125" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#5F5A69" text-anchor="start">Child tasks run at the same time</text><line x1="282" y1="170" x2="378" y2="180" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="380" y="140" width="250" height="80" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="505.0" y="171.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">brew(Latte)</text><text x="505.0" y="199.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">for Dara</text><line x1="632" y1="180" x2="718" y2="230" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><line x1="282" y1="170" x2="378" y2="290" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="380" y="250" width="250" height="80" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="505.0" y="281.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">brew(Mocha)</text><text x="505.0" y="309.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">for Sokha</text><line x1="632" y1="290" x2="718" y2="260" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><line x1="282" y1="170" x2="378" y2="400" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="380" y="360" width="250" height="80" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="505.0" y="391.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">brew(Green tea)</text><text x="505.0" y="419.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">for Chenda</text><line x1="632" y1="400" x2="718" y2="290" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="720" y="170" width="340" height="180" fill="#FBF5F1" stroke="#C2391F" stroke-width="2.5"/><text x="890" y="210" font-family="'IBM Plex Mono', Menlo, monospace" font-size="20" font-weight="700" fill="#1D1A24" text-anchor="middle">actor TicketCounter</text><text x="890" y="245" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5F5A69" text-anchor="middle">one task inside at a time</text><rect x="760" y="270" width="260" height="60" fill="#FFFFFF" stroke="#C2391F" stroke-width="2.5"/><text x="890.0" y="308.05" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">last = 3</text><text x="40" y="500" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1D1A24" text-anchor="start">Tasks may finish in any order, but the actor never hands out the same ticket twice.</text></svg>