<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-label="Reference cycles"><title>Reference cycles</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5F5A69"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5F5A69"/></marker></defs><rect width="1100" height="530" fill="#FFFFFF"/><text x="40" y="52" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1D1A24" text-anchor="start">Reference cycles</text><text x="40" y="84" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="start">Dara and her order point at each other</text><text x="40" y="140" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1A24" text-anchor="start">A strong reference cycle</text><text x="40" y="168" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5F5A69" text-anchor="start">neither count reaches 0, so nothing is freed</text><rect x="40" y="200" width="180" height="90" fill="#FBF5F1" stroke="#C2391F" stroke-width="2.5"/><text x="130.0" y="236.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">dara</text><text x="130.0" y="264.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">variable, set to nil</text><rect x="330" y="200" width="180" height="90" fill="#FBF5F1" stroke="#C2391F" stroke-width="2.5"/><text x="420.0" y="236.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">order</text><text x="420.0" y="264.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">variable, set to nil</text><rect x="40" y="360" width="180" height="90" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="130.0" y="396.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">Customer</text><text x="130.0" y="424.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">Dara</text><rect x="330" y="360" width="180" height="90" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="420.0" y="396.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">Order</text><text x="420.0" y="424.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">ticket 1</text><line x1="130" y1="292" x2="130" y2="356" stroke="#EBDDD3" stroke-width="2.5" stroke-dasharray="6 6"/><line x1="420" y1="292" x2="420" y2="356" stroke="#EBDDD3" stroke-width="2.5" stroke-dasharray="6 6"/><line x1="222" y1="390" x2="328" y2="390" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><text x="275" y="380" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F5A69" text-anchor="middle">strong</text><line x1="328" y1="425" x2="222" y2="425" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><text x="275" y="448" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F5A69" text-anchor="middle">strong</text><text x="590" y="140" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1A24" text-anchor="start">Fixed with weak</text><text x="590" y="168" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5F5A69" text-anchor="start">the order does not keep Dara alive</text><rect x="590" y="200" width="180" height="90" fill="#FBF5F1" stroke="#C2391F" stroke-width="2.5"/><text x="680.0" y="236.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">dara</text><text x="680.0" y="264.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">variable, set to nil</text><rect x="880" y="200" width="180" height="90" fill="#FBF5F1" stroke="#C2391F" stroke-width="2.5"/><text x="970.0" y="236.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">order</text><text x="970.0" y="264.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">variable, set to nil</text><rect x="590" y="360" width="180" height="90" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="680.0" y="396.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">Customer</text><text x="680.0" y="424.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">Dara</text><rect x="880" y="360" width="180" height="90" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="970.0" y="396.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">Order</text><text x="970.0" y="424.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">ticket 1</text><line x1="680" y1="292" x2="680" y2="356" stroke="#EBDDD3" stroke-width="2.5" stroke-dasharray="6 6"/><line x1="970" y1="292" x2="970" y2="356" stroke="#EBDDD3" stroke-width="2.5" stroke-dasharray="6 6"/><line x1="772" y1="390" x2="878" y2="390" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><text x="825" y="380" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F5A69" text-anchor="middle">strong</text><line x1="878" y1="425" x2="772" y2="425" stroke="#C2391F" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#head)"/><text x="825" y="448" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#C2391F" text-anchor="middle">weak</text><text x="40" y="500" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5F5A69" text-anchor="start">Dashed grey lines: the variables were set to nil, so they no longer hold anything.</text></svg>