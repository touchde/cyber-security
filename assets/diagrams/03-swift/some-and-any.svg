<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-label="some and any"><title>some and any</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5F5A69"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5F5A69"/></marker></defs><rect width="1100" height="510" fill="#FFFFFF"/><text x="40" y="52" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1D1A24" text-anchor="start">some and any</text><text x="40" y="84" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="start">Two ways to say &quot;a type that conforms to Discount&quot;</text><text x="40" y="140" font-family="'IBM Plex Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#1D1A24" text-anchor="start">some Discount</text><text x="40" y="168" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5F5A69" text-anchor="start">one real type, fixed when the code is compiled</text><rect x="40" y="190" width="440" height="90" fill="#FBF5F1" stroke="#C2391F" stroke-width="2.5"/><text x="260.0" y="226.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">todaysMemberDeal()</text><text x="260.0" y="254.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">always returns MemberDiscount</text><line x1="260" y1="282" x2="260" y2="328" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="140" y="330" width="240" height="80" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="260.0" y="378.05" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">MemberDiscount</text><text x="560" y="140" font-family="'IBM Plex Mono', Menlo, monospace" font-size="22" font-weight="700" fill="#1D1A24" text-anchor="start">any Discount</text><text x="560" y="168" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5F5A69" text-anchor="start">a box; the type inside is chosen while running</text><rect x="560" y="190" width="500" height="220" fill="#FBF5F1" stroke="#EBDDD3" stroke-width="2.5"/><text x="810" y="222" font-family="'IBM Plex Mono', Menlo, monospace" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">[any Discount]</text><rect x="572" y="250" width="152" height="80" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="648.0" y="295.6" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#1D1A24" text-anchor="middle">MemberDiscount</text><rect x="734" y="250" width="152" height="80" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="810.0" y="297.7" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1A24" text-anchor="middle">HappyHour</text><rect x="896" y="250" width="152" height="80" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="972.0" y="297.35" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#1D1A24" text-anchor="middle">NoDiscount</text><text x="810" y="380" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5F5A69" text-anchor="middle">different types, side by side</text><text x="40" y="470" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1D1A24" text-anchor="start">Prefer some: faster, and the compiler checks more. Use any when the type must change.</text></svg>