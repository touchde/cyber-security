<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-label="How a result builder works"><title>How a result builder works</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5F5A69"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5F5A69"/></marker></defs><rect width="1100" height="540" fill="#FFFFFF"/><text x="40" y="52" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1D1A24" text-anchor="start">How a result builder works</text><text x="40" y="84" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="start">Each statement becomes a part; buildBlock joins the parts</text><text x="40" y="128" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#5F5A69" text-anchor="start">In the function body</text><text x="560" y="128" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#5F5A69" text-anchor="start">The builder method called</text><rect x="40" y="145" width="440" height="64" fill="#FFFFFF" stroke="#EBDDD3" stroke-width="2.5"/><text x="60" y="184" font-family="'IBM Plex Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#1D1A24" text-anchor="start">&quot;Mina Coffee, Phnom Penh&quot;</text><line x1="482" y1="177" x2="558" y2="177" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="560" y="145" width="240" height="64" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="680.0" y="185.05" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">buildExpression</text><line x1="802" y1="177" x2="868" y2="290" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="40" y="230" width="440" height="64" fill="#FFFFFF" stroke="#EBDDD3" stroke-width="2.5"/><text x="60" y="269" font-family="'IBM Plex Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#1D1A24" text-anchor="start">for item in items { item }</text><line x1="482" y1="262" x2="558" y2="262" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="560" y="230" width="240" height="64" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="680.0" y="270.05" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">buildArray</text><line x1="802" y1="262" x2="868" y2="290" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="40" y="315" width="440" height="64" fill="#FFFFFF" stroke="#EBDDD3" stroke-width="2.5"/><text x="60" y="354" font-family="'IBM Plex Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#1D1A24" text-anchor="start">if isMember { ... }</text><line x1="482" y1="347" x2="558" y2="347" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="560" y="315" width="240" height="64" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="680.0" y="355.05" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">buildOptional</text><line x1="802" y1="347" x2="868" y2="290" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="40" y="400" width="440" height="64" fill="#FFFFFF" stroke="#EBDDD3" stroke-width="2.5"/><text x="60" y="439" font-family="'IBM Plex Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#1D1A24" text-anchor="start">if cups &gt;= 5 { ... } else { ... }</text><line x1="482" y1="432" x2="558" y2="432" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="560" y="400" width="240" height="64" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="680.0" y="440.05" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">buildEither</text><line x1="802" y1="432" x2="868" y2="290" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="870" y="230" width="190" height="120" fill="#FBF5F1" stroke="#C2391F" stroke-width="2.5"/><text x="965.0" y="281.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">buildBlock</text><text x="965.0" y="309.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">joins every part</text><line x1="965" y1="352" x2="965" y2="418" stroke="#5F5A69" stroke-width="2.5" marker-end="url(#head)"/><rect x="870" y="420" width="190" height="80" fill="#FFFFFF" stroke="#C2391F" stroke-width="2.5"/><text x="965.0" y="451.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">[String]</text><text x="965.0" y="479.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">the receipt</text></svg>