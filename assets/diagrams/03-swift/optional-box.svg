<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-label="An optional is a box"><title>An optional is a box</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5F5A69"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5F5A69"/></marker></defs><rect width="1100" height="530" fill="#FFFFFF"/><text x="40" y="52" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1D1A24" text-anchor="start">An optional is a box</text><text x="40" y="84" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="start">It holds one value, or nothing (nil)</text><text x="40" y="145" font-family="'IBM Plex Mono', Menlo, monospace" font-size="19" font-weight="400" fill="#1D1A24" text-anchor="start">Int(&quot;6000&quot;)</text><text x="530" y="145" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5F5A69" text-anchor="end">gives an Int?</text><rect x="40" y="160" width="490" height="100" fill="#FDF3EF" stroke="#C2391F" stroke-width="2.5"/><text x="285.0" y="201.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">6000</text><text x="285.0" y="229.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">the box holds a value</text><text x="570" y="145" font-family="'IBM Plex Mono', Menlo, monospace" font-size="19" font-weight="400" fill="#1D1A24" text-anchor="start">Int(&quot;six thousand&quot;)</text><text x="1060" y="145" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5F5A69" text-anchor="end">gives an Int?</text><rect x="570" y="160" width="490" height="100" fill="#FFFFFF" stroke="#C2391F" stroke-width="2.5"/><text x="815.0" y="201.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">nil</text><text x="815.0" y="229.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">the box is empty</text><text x="40" y="320" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#1D1A24" text-anchor="start">Five ways to open the box</text><rect x="40" y="340" width="190" height="100" fill="#FBF5F1" stroke="#C2391F" stroke-width="2.5"/><text x="135.0" y="381.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">if let</text><text x="135.0" y="409.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">use it, if there</text><rect x="246" y="340" width="190" height="100" fill="#FBF5F1" stroke="#C2391F" stroke-width="2.5"/><text x="341.0" y="381.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">guard let</text><text x="341.0" y="409.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">leave early if nil</text><rect x="452" y="340" width="190" height="100" fill="#FBF5F1" stroke="#C2391F" stroke-width="2.5"/><text x="547.0" y="381.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">??</text><text x="547.0" y="409.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">use a default</text><rect x="658" y="340" width="190" height="100" fill="#FBF5F1" stroke="#C2391F" stroke-width="2.5"/><text x="753.0" y="381.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">?.</text><text x="753.0" y="409.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">go on only if there</text><rect x="864" y="340" width="190" height="100" fill="#FFFFFF" stroke="#9A2A16" stroke-width="2.5"/><text x="959.0" y="381.4" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A24" text-anchor="middle">!</text><text x="959.0" y="409.3" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="middle">crash if nil</text><text x="40" y="490" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5F5A69" text-anchor="start">Swift never lets you use an Int? as an Int until you have opened it.</text></svg>