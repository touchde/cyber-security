<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="655" viewBox="0 0 1100 655" role="img" aria-label="The Xcode window"><title>The Xcode window</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#5F5A69"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#5F5A69"/></marker></defs><rect width="1100" height="655" fill="#FFFFFF"/><text x="40" y="52" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#1D1A24" text-anchor="start">The Xcode window</text><text x="40" y="84" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="start">Five main areas</text><rect x="40" y="120" width="1020" height="470" fill="#FFFFFF" stroke="#EBDDD3" stroke-width="2.5"/><rect x="40" y="120" width="1020" height="64" fill="#FBF5F1" stroke="#EBDDD3" stroke-width="2.5"/><text x="64" y="160" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1D1A24" text-anchor="start">Toolbar</text><text x="160" y="160" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5F5A69" text-anchor="start">Run ▶  and  Stop ■</text><rect x="40" y="184" width="230" height="406" fill="#FDF3EF" stroke="#EBDDD3" stroke-width="2.5"/><text x="155" y="340" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1D1A24" text-anchor="middle">Navigator</text><text x="155" y="368" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F5A69" text-anchor="middle">files and folders</text><rect x="850" y="184" width="210" height="406" fill="#FBF5F1" stroke="#EBDDD3" stroke-width="2.5"/><text x="955" y="340" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1D1A24" text-anchor="middle">Inspector</text><text x="955" y="368" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F5A69" text-anchor="middle">settings for the</text><text x="955" y="390" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F5A69" text-anchor="middle">selected file</text><rect x="270" y="450" width="580" height="140" fill="#FDF3EF" stroke="#EBDDD3" stroke-width="2.5"/><text x="560.0" y="512" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#1D1A24" text-anchor="middle">Debug area</text><text x="560.0" y="540" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F5A69" text-anchor="middle">the console shows the output</text><text x="560.0" y="310" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1A24" text-anchor="middle">Editor</text><text x="560.0" y="340" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#5F5A69" text-anchor="middle">read and write code here</text><rect x="310" y="370" width="210.0" height="5" fill="#EBDDD3" stroke="#C2391F" stroke-width="0"/><rect x="310" y="384" width="154.0" height="5" fill="#EBDDD3" stroke="#C2391F" stroke-width="0"/><rect x="310" y="398" width="237.99999999999997" height="5" fill="#EBDDD3" stroke="#C2391F" stroke-width="0"/><rect x="310" y="412" width="182.0" height="5" fill="#EBDDD3" stroke="#C2391F" stroke-width="0"/><rect x="310" y="426" width="125.99999999999999" height="5" fill="#EBDDD3" stroke="#C2391F" stroke-width="0"/><text x="40" y="625" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5A69" text-anchor="start">Open a package with open Package.swift, then press Run (Command-R).</text></svg>