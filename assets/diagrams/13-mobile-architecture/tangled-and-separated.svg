<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="Separation of concerns"><title>Separation of concerns</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#4D6075"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#4D6075"/></marker></defs><rect width="1100" height="520" fill="#FFFFFF"/><text x="40" y="52" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#0F1E2E" text-anchor="start">Separation of concerns</text><text x="40" y="84" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4D6075" text-anchor="start">The same receipt code, before and after</text><text x="40" y="135" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#1F5F9E" text-anchor="start">Before: one function does everything</text><rect x="40" y="155" width="470" height="300" fill="#FFFFFF" stroke="#B23A3A" stroke-width="2.5"/><text x="70" y="205" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#0F1E2E" text-anchor="start">• read the order text</text><text x="70" y="267" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#0F1E2E" text-anchor="start">• price rules</text><text x="70" y="329" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#0F1E2E" text-anchor="start">• receipt layout</text><text x="70" y="391" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#0F1E2E" text-anchor="start">• print</text><text x="275" y="485" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#B23A3A" text-anchor="middle">Change one job, and you touch them all.</text><text x="590" y="135" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#1F5F9E" text-anchor="start">After: parts with one job each</text><rect x="590" y="160" width="470" height="80" fill="#DCEBFA" stroke="#1F5F9E" stroke-width="2.5"/><text x="825.0" y="191.4" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1E2E" text-anchor="middle">Order</text><text x="825.0" y="219.3" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4D6075" text-anchor="middle">what an order is (data)</text><rect x="590" y="265" width="470" height="80" fill="#EEF5FC" stroke="#1F5F9E" stroke-width="2.5"/><text x="825.0" y="296.4" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1E2E" text-anchor="middle">orderTotal</text><text x="825.0" y="324.3" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4D6075" text-anchor="middle">how much it costs (rules)</text><rect x="590" y="370" width="470" height="80" fill="#FFFFFF" stroke="#1F5F9E" stroke-width="2.5"/><text x="825.0" y="401.4" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#0F1E2E" text-anchor="middle">receiptLines</text><text x="825.0" y="429.3" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4D6075" text-anchor="middle">how it looks (presentation)</text><text x="825" y="485" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1F5F9E" text-anchor="middle">Change one job, and the others stay the same.</text></svg>