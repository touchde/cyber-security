<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-label="Three layers"><title>Three layers</title><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#4D6075"/></marker><marker id="tail" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M14,0 L0,6 L14,12 z" fill="#4D6075"/></marker></defs><rect width="1100" height="540" fill="#FFFFFF"/><text x="40" y="52" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#0F1E2E" text-anchor="start">Three layers</text><text x="40" y="84" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4D6075" text-anchor="start">The usual shape of a mobile app; lesson 3 looks closer</text><rect x="80" y="130" width="700" height="100" fill="#FFFFFF" stroke="#1F5F9E" stroke-width="2.5"/><text x="110" y="175" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#0F1E2E" text-anchor="start">UI layer</text><text x="110" y="205" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4D6075" text-anchor="start">screens and what they show: receipt, SMS, cart</text><line x1="430" y1="230" x2="430" y2="258" stroke="#4D6075" stroke-width="2.5" marker-end="url(#head)"/><rect x="80" y="260" width="700" height="100" fill="#DCEBFA" stroke="#1F5F9E" stroke-width="2.5"/><text x="110" y="305" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#0F1E2E" text-anchor="start">Domain layer</text><text x="110" y="335" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4D6075" text-anchor="start">the shop&#x27;s rules: discounts, tax, points</text><line x1="430" y1="360" x2="430" y2="388" stroke="#4D6075" stroke-width="2.5" marker-end="url(#head)"/><rect x="80" y="390" width="700" height="100" fill="#EEF5FC" stroke="#1F5F9E" stroke-width="2.5"/><text x="110" y="435" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#0F1E2E" text-anchor="start">Data layer</text><text x="110" y="465" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4D6075" text-anchor="start">where data comes from and goes: server, database, files</text><text x="820" y="190" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1F5F9E" text-anchor="start">Each layer only</text><text x="820" y="215" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1F5F9E" text-anchor="start">talks to the one</text><text x="820" y="240" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1F5F9E" text-anchor="start">below it.</text><text x="820" y="330" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4D6075" text-anchor="start">The rules know</text><text x="820" y="355" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4D6075" text-anchor="start">nothing about</text><text x="820" y="380" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4D6075" text-anchor="start">screens or servers.</text></svg>